<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
<title id="title">A file must be connected to its consumer</title>
<desc id="desc">1 · RESOURCE. Image, model, audio, or video. Export a reference → import your edit. Check scale, dimensions, and preview.. 2 · IDENTITY / TABLE. FID_ / RID_ / BGM_ / model slot. Save the owning resource or table. Keep new identities distinct from shared ones.. 3 · CONSUMER. Character, scene, chapter, or script. Assign or call the exact identity. Test from the place that actually uses it.. A successful asset preview does not prove the game reaches that asset.</desc>
<rect width="920" height="680" rx="18" fill="#f4f3ec"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="32" y="36" font-size="14" fill="#456575" font-weight="600">TELLIUS MODDING · EXPLANATORY DIAGRAM</text>
<text x="32" y="72" font-size="27" fill="#123c50" font-weight="700">A file must be connected to its consumer</text>
<rect x="32" y="126" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="126" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="152" font-size="14" fill="#26728a" font-weight="700">1 · RESOURCE</text>
<text x="55" y="183" font-size="23" fill="#123c50" font-weight="600">Image, model, audio, or video</text>
<text x="55" y="213" font-size="19" fill="#243c48" font-weight="400">Export a reference → import your edit</text>
<text x="55" y="240" font-size="18" fill="#496557" font-weight="400">Check scale, dimensions, and preview.</text>
<path d="M460 265 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="284" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="284" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="310" font-size="14" fill="#26728a" font-weight="700">2 · IDENTITY / TABLE</text>
<text x="55" y="341" font-size="23" fill="#123c50" font-weight="600">FID_ / RID_ / BGM_ / model slot</text>
<text x="55" y="371" font-size="19" fill="#243c48" font-weight="400">Save the owning resource or table</text>
<text x="55" y="398" font-size="18" fill="#496557" font-weight="400">Keep new identities distinct from shared ones.</text>
<path d="M460 423 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="442" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="442" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="468" font-size="14" fill="#26728a" font-weight="700">3 · CONSUMER</text>
<text x="55" y="499" font-size="23" fill="#123c50" font-weight="600">Character, scene, chapter, or script</text>
<text x="55" y="529" font-size="19" fill="#243c48" font-weight="400">Assign or call the exact identity</text>
<text x="55" y="556" font-size="18" fill="#496557" font-weight="400">Test from the place that actually uses it.</text>
<text x="32" y="626" font-size="18" fill="#123c50" font-weight="600">A successful asset preview does not prove the game reaches that asset.</text>
</g></svg>
