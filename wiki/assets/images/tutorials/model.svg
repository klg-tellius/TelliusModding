<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
<title id="title">Prove a small model round trip first</title>
<desc id="desc">1 · EXPORT EXACT SET. Keep an untouched reference. Preserve coordinates, rig, materials. Start with one small visible geometry change.. 2 · IMPORT REVIEW. Geometry + textures + bones + events. Inspect warnings before writing. Check attachments and several animations.. 3 · CONTEXT TEST. Render fight → built game. Near / far cameras, hit / miss / recovery. Rigged imports still need Dolphin confirmation.. A correct idle pose does not prove attack timing or weapon attachment.</desc>
<rect width="920" height="680" rx="18" fill="#f4f3ec"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="32" y="36" font-size="14" fill="#456575" font-weight="600">TELLIUS MODDING · EXPLANATORY DIAGRAM</text>
<text x="32" y="72" font-size="27" fill="#123c50" font-weight="700">Prove a small model round trip first</text>
<rect x="32" y="126" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="126" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="152" font-size="14" fill="#26728a" font-weight="700">1 · EXPORT EXACT SET</text>
<text x="55" y="183" font-size="23" fill="#123c50" font-weight="600">Keep an untouched reference</text>
<text x="55" y="213" font-size="19" fill="#243c48" font-weight="400">Preserve coordinates, rig, materials</text>
<text x="55" y="240" font-size="18" fill="#496557" font-weight="400">Start with one small visible geometry change.</text>
<path d="M460 265 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="284" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="284" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="310" font-size="14" fill="#26728a" font-weight="700">2 · IMPORT REVIEW</text>
<text x="55" y="341" font-size="23" fill="#123c50" font-weight="600">Geometry + textures + bones + events</text>
<text x="55" y="371" font-size="19" fill="#243c48" font-weight="400">Inspect warnings before writing</text>
<text x="55" y="398" font-size="18" fill="#496557" font-weight="400">Check attachments and several animations.</text>
<path d="M460 423 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="442" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="442" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="468" font-size="14" fill="#26728a" font-weight="700">3 · CONTEXT TEST</text>
<text x="55" y="499" font-size="23" fill="#123c50" font-weight="600">Render fight → built game</text>
<text x="55" y="529" font-size="19" fill="#243c48" font-weight="400">Near / far cameras, hit / miss / recovery</text>
<text x="55" y="556" font-size="18" fill="#496557" font-weight="400">Rigged imports still need Dolphin confirmation.</text>
<text x="32" y="626" font-size="18" fill="#123c50" font-weight="600">A correct idle pose does not prove attack timing or weapon attachment.</text>
</g></svg>
