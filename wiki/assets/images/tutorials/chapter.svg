<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
<title id="title">A chapter works when its references agree</title>
<desc id="desc">1 · CHAPTER IDENTITY. Slot + part + difficulty. Overview names the resources. Example: slot 01 is the Prologue.. 2 · CONNECTED FILES. Map + deployment + script + messages. Script loads groups and calls messages. Match IDs and section names exactly.. 3 · STORY BOUNDARY. Current chapter → next chapter. Win → transition → save → reload. Test the boundary through normal play.. Copying one resource does not copy a complete chapter.</desc>
<rect width="920" height="680" rx="18" fill="#f4f3ec"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="32" y="36" font-size="14" fill="#456575" font-weight="600">TELLIUS MODDING · EXPLANATORY DIAGRAM</text>
<text x="32" y="72" font-size="27" fill="#123c50" font-weight="700">A chapter works when its references agree</text>
<rect x="32" y="126" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="126" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="152" font-size="14" fill="#26728a" font-weight="700">1 · CHAPTER IDENTITY</text>
<text x="55" y="183" font-size="23" fill="#123c50" font-weight="600">Slot + part + difficulty</text>
<text x="55" y="213" font-size="19" fill="#243c48" font-weight="400">Overview names the resources</text>
<text x="55" y="240" font-size="18" fill="#496557" font-weight="400">Example: slot 01 is the Prologue.</text>
<path d="M460 265 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="284" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="284" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="310" font-size="14" fill="#26728a" font-weight="700">2 · CONNECTED FILES</text>
<text x="55" y="341" font-size="23" fill="#123c50" font-weight="600">Map + deployment + script + messages</text>
<text x="55" y="371" font-size="19" fill="#243c48" font-weight="400">Script loads groups and calls messages</text>
<text x="55" y="398" font-size="18" fill="#496557" font-weight="400">Match IDs and section names exactly.</text>
<path d="M460 423 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="442" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="442" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="468" font-size="14" fill="#26728a" font-weight="700">3 · STORY BOUNDARY</text>
<text x="55" y="499" font-size="23" fill="#123c50" font-weight="600">Current chapter → next chapter</text>
<text x="55" y="529" font-size="19" fill="#243c48" font-weight="400">Win → transition → save → reload</text>
<text x="55" y="556" font-size="18" fill="#496557" font-weight="400">Test the boundary through normal play.</text>
<text x="32" y="626" font-size="18" fill="#123c50" font-weight="600">Copying one resource does not copy a complete chapter.</text>
</g></svg>
