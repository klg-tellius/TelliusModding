<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
<title id="title">From written dialogue to an in-game scene</title>
<desc id="desc">1 · SCENE SETUP. Layout → background → portraits. Choose seats, speaker, and textbox. Inspect inherited starting context.. 2 · TEXT &amp; TIMING. Line → wait → transition. Preview from the beginning, then save. Check glyphs, page breaks, and continuity.. 3 · SCRIPT CALL. Trigger → exact Message ID. Compile caller → play the trigger. A saved message needs a reachable call.. Preview checks the scene; playing the trigger checks its integration.</desc>
<rect width="920" height="680" rx="18" fill="#f4f3ec"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="32" y="36" font-size="14" fill="#456575" font-weight="600">TELLIUS MODDING · EXPLANATORY DIAGRAM</text>
<text x="32" y="72" font-size="27" fill="#123c50" font-weight="700">From written dialogue to an in-game scene</text>
<rect x="32" y="126" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="126" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="152" font-size="14" fill="#26728a" font-weight="700">1 · SCENE SETUP</text>
<text x="55" y="183" font-size="23" fill="#123c50" font-weight="600">Layout → background → portraits</text>
<text x="55" y="213" font-size="19" fill="#243c48" font-weight="400">Choose seats, speaker, and textbox</text>
<text x="55" y="240" font-size="18" fill="#496557" font-weight="400">Inspect inherited starting context.</text>
<path d="M460 265 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="284" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="284" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="310" font-size="14" fill="#26728a" font-weight="700">2 · TEXT &amp; TIMING</text>
<text x="55" y="341" font-size="23" fill="#123c50" font-weight="600">Line → wait → transition</text>
<text x="55" y="371" font-size="19" fill="#243c48" font-weight="400">Preview from the beginning, then save</text>
<text x="55" y="398" font-size="18" fill="#496557" font-weight="400">Check glyphs, page breaks, and continuity.</text>
<path d="M460 423 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="442" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="442" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="468" font-size="14" fill="#26728a" font-weight="700">3 · SCRIPT CALL</text>
<text x="55" y="499" font-size="23" fill="#123c50" font-weight="600">Trigger → exact Message ID</text>
<text x="55" y="529" font-size="19" fill="#243c48" font-weight="400">Compile caller → play the trigger</text>
<text x="55" y="556" font-size="18" fill="#496557" font-weight="400">A saved message needs a reachable call.</text>
<text x="32" y="626" font-size="18" fill="#123c50" font-weight="600">Preview checks the scene; playing the trigger checks its integration.</text>
</g></svg>
