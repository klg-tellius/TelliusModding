<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
<title id="title">A release is tested from the recipient’s starting point</title>
<desc id="desc">1 · RELEASE CANDIDATE. Saved, checked, tested project. Mod details + version + base revision. Remove temporary debug changes.. 2 · PATCH. Create patch… → .tpatch. Keep the matching source disc available. Review changed assets and release notes.. 3 · CLEAN APPLICATION. Unmodified matching disc + patch. Apply patch to a disc… → separate output. Launch that result and repeat a smoke test.. Test patch application separately from your existing working build.</desc>
<rect width="920" height="680" rx="18" fill="#f4f3ec"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="32" y="36" font-size="14" fill="#456575" font-weight="600">TELLIUS MODDING · EXPLANATORY DIAGRAM</text>
<text x="32" y="72" font-size="27" fill="#123c50" font-weight="700">A release is tested from the recipient’s starting point</text>
<rect x="32" y="126" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="126" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="152" font-size="14" fill="#26728a" font-weight="700">1 · RELEASE CANDIDATE</text>
<text x="55" y="183" font-size="23" fill="#123c50" font-weight="600">Saved, checked, tested project</text>
<text x="55" y="213" font-size="19" fill="#243c48" font-weight="400">Mod details + version + base revision</text>
<text x="55" y="240" font-size="18" fill="#496557" font-weight="400">Remove temporary debug changes.</text>
<path d="M460 265 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="284" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="284" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="310" font-size="14" fill="#26728a" font-weight="700">2 · PATCH</text>
<text x="55" y="341" font-size="23" fill="#123c50" font-weight="600">Create patch… → .tpatch</text>
<text x="55" y="371" font-size="19" fill="#243c48" font-weight="400">Keep the matching source disc available</text>
<text x="55" y="398" font-size="18" fill="#496557" font-weight="400">Review changed assets and release notes.</text>
<path d="M460 423 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="442" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="442" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="468" font-size="14" fill="#26728a" font-weight="700">3 · CLEAN APPLICATION</text>
<text x="55" y="499" font-size="23" fill="#123c50" font-weight="600">Unmodified matching disc + patch</text>
<text x="55" y="529" font-size="19" fill="#243c48" font-weight="400">Apply patch to a disc… → separate output</text>
<text x="55" y="556" font-size="18" fill="#496557" font-weight="400">Launch that result and repeat a smoke test.</text>
<text x="32" y="626" font-size="18" fill="#123c50" font-weight="600">Test patch application separately from your existing working build.</text>
</g></svg>
