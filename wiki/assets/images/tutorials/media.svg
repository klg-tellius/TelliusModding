<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
<title id="title">Test media at the boundaries, not just the start</title>
<desc id="desc">1 · IMPORT &amp; PREVIEW. Source → encoded game resource. Listen / watch the imported result. Preserve a reference export for comparison.. 2 · CONNECT. Cue or path → chapter / script. Use BGM_ / SFX_ / Movie path as appropriate. Save changed data and compile changed calls.. 3 · FULL PLAYBACK. Start → loop or tail → next event. Also test skipping where supported. Inspect build size after large media changes.. Local preview omits some engine behavior; finish in the built game.</desc>
<rect width="920" height="680" rx="18" fill="#f4f3ec"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="32" y="36" font-size="14" fill="#456575" font-weight="600">TELLIUS MODDING · EXPLANATORY DIAGRAM</text>
<text x="32" y="72" font-size="27" fill="#123c50" font-weight="700">Test media at the boundaries, not just the start</text>
<rect x="32" y="126" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="126" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="152" font-size="14" fill="#26728a" font-weight="700">1 · IMPORT &amp; PREVIEW</text>
<text x="55" y="183" font-size="23" fill="#123c50" font-weight="600">Source → encoded game resource</text>
<text x="55" y="213" font-size="19" fill="#243c48" font-weight="400">Listen / watch the imported result</text>
<text x="55" y="240" font-size="18" fill="#496557" font-weight="400">Preserve a reference export for comparison.</text>
<path d="M460 265 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="284" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="284" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="310" font-size="14" fill="#26728a" font-weight="700">2 · CONNECT</text>
<text x="55" y="341" font-size="23" fill="#123c50" font-weight="600">Cue or path → chapter / script</text>
<text x="55" y="371" font-size="19" fill="#243c48" font-weight="400">Use BGM_ / SFX_ / Movie path as appropriate</text>
<text x="55" y="398" font-size="18" fill="#496557" font-weight="400">Save changed data and compile changed calls.</text>
<path d="M460 423 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="442" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="442" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="468" font-size="14" fill="#26728a" font-weight="700">3 · FULL PLAYBACK</text>
<text x="55" y="499" font-size="23" fill="#123c50" font-weight="600">Start → loop or tail → next event</text>
<text x="55" y="529" font-size="19" fill="#243c48" font-weight="400">Also test skipping where supported</text>
<text x="55" y="556" font-size="18" fill="#496557" font-weight="400">Inspect build size after large media changes.</text>
<text x="32" y="626" font-size="18" fill="#123c50" font-weight="600">Local preview omits some engine behavior; finish in the built game.</text>
</g></svg>
