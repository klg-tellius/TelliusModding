<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
<title id="title">Find the owner before changing a value</title>
<desc id="desc">1 · CHAPTER-LOCAL. Chapters → your chapter. Map, deployment, script, dialogue. Check part/phase and difficulty first.. 2 · SHARED RECORDS. Characters / Game Data. Character → class → item / skill. A shared record can affect many units.. 3 · RESOURCES &amp; TESTS. Assets / Tools. Models and media / Check and simulation. Follow IDs to the resource they name.. Ctrl+K finds records; Back returns along your navigation path.</desc>
<rect width="920" height="680" rx="18" fill="#f4f3ec"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="32" y="36" font-size="14" fill="#456575" font-weight="600">TELLIUS MODDING · EXPLANATORY DIAGRAM</text>
<text x="32" y="72" font-size="27" fill="#123c50" font-weight="700">Find the owner before changing a value</text>
<rect x="32" y="126" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="126" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="152" font-size="14" fill="#26728a" font-weight="700">1 · CHAPTER-LOCAL</text>
<text x="55" y="183" font-size="23" fill="#123c50" font-weight="600">Chapters → your chapter</text>
<text x="55" y="213" font-size="19" fill="#243c48" font-weight="400">Map, deployment, script, dialogue</text>
<text x="55" y="240" font-size="18" fill="#496557" font-weight="400">Check part/phase and difficulty first.</text>
<path d="M460 265 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="284" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="284" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="310" font-size="14" fill="#26728a" font-weight="700">2 · SHARED RECORDS</text>
<text x="55" y="341" font-size="23" fill="#123c50" font-weight="600">Characters / Game Data</text>
<text x="55" y="371" font-size="19" fill="#243c48" font-weight="400">Character → class → item / skill</text>
<text x="55" y="398" font-size="18" fill="#496557" font-weight="400">A shared record can affect many units.</text>
<path d="M460 423 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="442" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="442" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="468" font-size="14" fill="#26728a" font-weight="700">3 · RESOURCES &amp; TESTS</text>
<text x="55" y="499" font-size="23" fill="#123c50" font-weight="600">Assets / Tools</text>
<text x="55" y="529" font-size="19" fill="#243c48" font-weight="400">Models and media / Check and simulation</text>
<text x="55" y="556" font-size="18" fill="#496557" font-weight="400">Follow IDs to the resource they name.</text>
<text x="32" y="626" font-size="18" fill="#123c50" font-weight="600">Ctrl+K finds records; Back returns along your navigation path.</text>
</g></svg>
