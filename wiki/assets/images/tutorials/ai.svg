<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
<title id="title">Trace the policy that produces an AI action</title>
<desc id="desc">1 · DEPLOYMENT. The acting unit’s AI assignments. Attack / Move / Heal policies. Copy shared scripts before changing a role.. 2 · CANDIDATES. Eligible actions in this board state. Range, HP, equipment, terrain, counters. Later script actions can replace earlier ones.. 3 · DECISION. Play → how the target was chosen. Compare candidates and the chosen action. Repeat with targets inside and outside range.. A stationary boss needs a movement policy as well as an attack policy.</desc>
<rect width="920" height="680" rx="18" fill="#f4f3ec"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="32" y="36" font-size="14" fill="#456575" font-weight="600">TELLIUS MODDING · EXPLANATORY DIAGRAM</text>
<text x="32" y="72" font-size="27" fill="#123c50" font-weight="700">Trace the policy that produces an AI action</text>
<rect x="32" y="126" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="126" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="152" font-size="14" fill="#26728a" font-weight="700">1 · DEPLOYMENT</text>
<text x="55" y="183" font-size="23" fill="#123c50" font-weight="600">The acting unit’s AI assignments</text>
<text x="55" y="213" font-size="19" fill="#243c48" font-weight="400">Attack / Move / Heal policies</text>
<text x="55" y="240" font-size="18" fill="#496557" font-weight="400">Copy shared scripts before changing a role.</text>
<path d="M460 265 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="284" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="284" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="310" font-size="14" fill="#26728a" font-weight="700">2 · CANDIDATES</text>
<text x="55" y="341" font-size="23" fill="#123c50" font-weight="600">Eligible actions in this board state</text>
<text x="55" y="371" font-size="19" fill="#243c48" font-weight="400">Range, HP, equipment, terrain, counters</text>
<text x="55" y="398" font-size="18" fill="#496557" font-weight="400">Later script actions can replace earlier ones.</text>
<path d="M460 423 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="442" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="442" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="468" font-size="14" fill="#26728a" font-weight="700">3 · DECISION</text>
<text x="55" y="499" font-size="23" fill="#123c50" font-weight="600">Play → how the target was chosen</text>
<text x="55" y="529" font-size="19" fill="#243c48" font-weight="400">Compare candidates and the chosen action</text>
<text x="55" y="556" font-size="18" fill="#496557" font-weight="400">Repeat with targets inside and outside range.</text>
<text x="32" y="626" font-size="18" fill="#123c50" font-weight="600">A stationary boss needs a movement policy as well as an attack policy.</text>
</g></svg>
