<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
<title id="title">A character record is only one link</title>
<desc id="desc">1 · CREATE IDENTITY. Example: PID_TUTORIAL_GUARD. Unique PID + name key + class JID. Save FE8Data.bin after record edits.. 2 · PLACE THE UNIT. Deployment → intended section. Reference the new PID and equipment. Choose difficulty, tile, and army.. 3 · CHECK THE RESULT. Build → Play…. Inspect name, stats, model, inventory. A new record does not auto-deploy.. Text, portraits, models, and placement each have their own references.</desc>
<rect width="920" height="680" rx="18" fill="#f4f3ec"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="32" y="36" font-size="14" fill="#456575" font-weight="600">TELLIUS MODDING · EXPLANATORY DIAGRAM</text>
<text x="32" y="72" font-size="27" fill="#123c50" font-weight="700">A character record is only one link</text>
<rect x="32" y="126" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="126" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="152" font-size="14" fill="#26728a" font-weight="700">1 · CREATE IDENTITY</text>
<text x="55" y="183" font-size="23" fill="#123c50" font-weight="600">Example: PID_TUTORIAL_GUARD</text>
<text x="55" y="213" font-size="19" fill="#243c48" font-weight="400">Unique PID + name key + class JID</text>
<text x="55" y="240" font-size="18" fill="#496557" font-weight="400">Save FE8Data.bin after record edits.</text>
<path d="M460 265 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="284" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="284" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="310" font-size="14" fill="#26728a" font-weight="700">2 · PLACE THE UNIT</text>
<text x="55" y="341" font-size="23" fill="#123c50" font-weight="600">Deployment → intended section</text>
<text x="55" y="371" font-size="19" fill="#243c48" font-weight="400">Reference the new PID and equipment</text>
<text x="55" y="398" font-size="18" fill="#496557" font-weight="400">Choose difficulty, tile, and army.</text>
<path d="M460 423 v12 m-5 -5 l5 5 5 -5" fill="none" stroke="#26728a" stroke-width="2"/>
<rect x="32" y="442" width="856" height="134" rx="10" fill="#ffffff" stroke="#c7d3ce"/>
<rect x="32" y="442" width="7" height="134" rx="3" fill="#26728a"/>
<text x="55" y="468" font-size="14" fill="#26728a" font-weight="700">3 · CHECK THE RESULT</text>
<text x="55" y="499" font-size="23" fill="#123c50" font-weight="600">Build → Play…</text>
<text x="55" y="529" font-size="19" fill="#243c48" font-weight="400">Inspect name, stats, model, inventory</text>
<text x="55" y="556" font-size="18" fill="#496557" font-weight="400">A new record does not auto-deploy.</text>
<text x="32" y="626" font-size="18" fill="#123c50" font-weight="600">Text, portraits, models, and placement each have their own references.</text>
</g></svg>
