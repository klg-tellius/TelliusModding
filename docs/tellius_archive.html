  <p>The Sound Room, the jukebox in the extras menu, plays the game's music over a full-screen illustration. <code>soundroom.bin</code> is the list of those illustrations. It does not hold the track list: the 64 playable tracks are a fixed table of <code>BGM_</code> names in the executable, and no picture belongs to a particular track. ${badge("confirmed","confirmed")}</p>
  <h2>Layout</h2>
  <p>The file uses the same plain data container as ${wl("fe8anim")}: a 32-byte header (file size, data size, pointer count and a symbol count of zero), the data, then the position of every pointer in the data so the loader can relocate it. There is no symbol table. The data is a record count, the records, then the picture names, sorted and stored once each.</p>
  <div class="table-wrap"><table><thead><tr><th>Offset</th><th>Size</th><th>Field</th></tr></thead><tbody>
    <tr><td><code>+0x00</code></td><td>4</td><td>Pointer to the picture's <code>RID_</code> name: a resource of ${wl("rect-format","<code>s/rect.bin</code>")}</td></tr>
    <tr><td><code>+0x04</code></td><td>2</td><td>X position, signed</td></tr>
    <tr><td><code>+0x06</code></td><td>2</td><td>Y position, signed</td></tr>
  </tbody></table></div>
  <h2>How the Sound Room uses it</h2>
  <p>On opening, the menu loads the file and shows record 0. Each picture is created exactly as an event script's <code>RectBuild</code> would create it, then moved to the record's X and Y (the rect's position properties 0 and 1). The pictures form a slideshow that wraps at the record count:</p>
  <ul>
    <li>Playing a track with A shows the next picture.</li>
    <li>X hides the menu. While it is hidden, A or Right shows the next picture and Left the previous one; B, X or Start brings the menu back.</li>
    <li>The outgoing picture fades out over 64 frames while the new one fades in.</li>
  </ul>
  <p>Because the count is read from the file, pictures can be added, removed or reordered, and any rect resource can be used, including a new one. ${badge("confirmed","confirmed")} An edited list has not yet been run in the game.</p>
  <h2>The vanilla list</h2>
  <p>Twenty-one pictures: event illustrations (<code>RID_再会と別離-A</code>/<code>-B</code>, “reunion and parting”; <code>RID_聖天馬騎士</code>, “holy pegasus knight”; <code>RID_クリミアの復興1</code>/<code>2</code>, “Crimea's restoration”; the tower, the Goldoan dragons and others), three views of the crumbling castle, and the exteriors of the six nations (Crimea, Daein, Phoenicis, Begnion, Gallia, Kilvas).</p>
  <p>The layout area is 608 × 448. The full-frame pictures sit at 0, 0. Larger ones use a negative offset to choose the part that is shown: the 608 × 800 tower is at Y −250, the 608 × 912 second restoration picture at Y −420, and the 856 × 480 crumbling-castle view at X −40.</p>
  `
},

"iso-fst": {
  ns:"format", title:"GameCube Disc & FST", dek:"How the disc identifies the game, boots main.dol, and maps paths to file data",
  infobox:{ type:"Disc format", status:"confirmed", fields:[
    ["Platform","Nintendo GameCube"],["Filesystem index","File System Table (FST)"],["Executable","<code>sys/main.dol</code>"]
  ]},
  categories:["Container","Structure"],
  body:`
  <p>The disc image has two conceptual regions. The <strong>system area</strong> contains the boot metadata, apploader, executable, and filesystem index. The <strong>game filesystem</strong> contains the paths documented in ${wl("disc-layout")}. Extractors commonly present these as <code>sys/</code> and <code>files/</code>, but those folders are an extraction convention: the original disc stores offsets and lengths rather than a desktop-style directory tree.</p>
  <h2>How the game boots</h2>
  <ol><li><code>boot.bin</code> identifies the title and points to the executable and FST.</li><li><code>bi2.bin</code> supplies additional boot configuration.</li><li>The apploader prepares memory and loads the executable sections.</li><li>${wl("main-dol","<code>main.dol</code>")} starts the game and requests assets by path or through engine registries.</li></ol>
  <h2>File System Table</h2>
  <p>The FST is the disc's directory. Directory entries describe hierarchy; file entries pair a name with the byte offset and length of its payload. Thus a path such as <code>zmap/bmap01/map.cmp</code> ultimately becomes an FST entry whose offset tells the drive where to read. The FST stores the names once; native code can receive an already-resolved map name and combine it with a fixed prefix such as <code>zmap/%s</code>.</p>
  <h2>ISO, CISO, and extracted files</h2>
  <p><code>.iso</code> is a full disc image. <code>.ciso</code> is a compact representation of the same logical GameCube disc content. Neither changes the internal game formats: LZ10, pack archives, TPL textures, scripts, and messages remain byte-for-byte game resources after extraction.</p>
  `
},

"main-dol": {
  ns:"format", title:"main.dol", dek:"The native PowerPC executable that turns file data into game behavior",
  infobox:{ type:"Executable format", status:"strong", fields:[
    ["CPU","PowerPC / Gekko"],["Role","Native engine code and static data"],["Loaded sections","Text, data, and zero-initialized BSS"]
  ]},
  categories:["Executable","Structure"],
  body:`
  <p><code>main.dol</code> is the game's executable. Data files describe characters, maps, items, scripts, and assets; native functions in this file decide how those records are loaded and used. Combat formulas, chapter progression, action availability, resource hashing, and the script interpreter all live here.</p>
  <h2>How executable data becomes runtime behavior</h2>
  <p>The loader copies initialized code and data sections to their declared addresses, clears BSS, and transfers control to native code. File records become game behavior only when these functions load, resolve, combine, and mutate them.</p>
  <h2>Layout</h2>
  <p>A DOL header lists several code and initialized-data sections. Each entry supplies a file offset, runtime address, and size. A separate BSS range is allocated as zero-filled memory when the program starts, so runtime tables stored there do not exist as initialized bytes in the file.</p>
  <h2>Addresses and references</h2>
  <p>PowerPC instructions operate on 32-bit runtime addresses. Constants and globals are often reached by constructing a base address and then loading from a small offset. Small-data areas provide shorter access to frequently used globals. Function calls use branch-and-link instructions, while tables of function pointers support registries and callbacks.</p>
  <h2>Relationship to game data</h2>
  <table><thead><tr><th>Native subsystem</th><th>File-backed input</th></tr></thead><tbody>
    <tr><td>Combat resolution</td><td>Character, class, item, and skill records from ${wl("fe8data")}</td></tr>
    <tr><td>Chapter controller</td><td>${wl("event-script","Scripts")}, ${wl("dispo-format","deployment")}, ${wl("map-format","maps")}, and ${wl("message-format","messages")}</td></tr>
    <tr><td>Script virtual machine</td><td>Compiled <code>.cmb</code> modules and registered native <code>externCall</code> functions</td></tr>
    <tr><td>Named-resource lookup</td><td>Symbolic names such as <code>BGM_*</code> cues and ${wl("message-format","message IDs")}, resolved through a two-hash bucket table</td></tr>
  </tbody></table>
  <h2>Mapped gameplay surface</h2>
  <p>The executable's named gameplay surface now covers map actions, combat exchanges, inventory, skills and status, unit stats, AI flow, chapter/map/event/save support, and large parts of UI/rendering and library code. Among 5,808 named semantic functions, 1,367 functions with parameters have fully named formal parameters and no gameplay candidate currently has partially named or default formal parameters. The remaining readability gaps are mostly inside locals, raw structure dereferences, undefined data references, and large dispatcher functions rather than unknown formal calling contracts.</p>
  <table><thead><tr><th>Domain</th><th>Named candidates</th><th>Reader-facing examples</th></tr></thead><tbody>
    <tr><td>Battle</td><td>240</td><td>Combat exchanges, forecast stats, strike damage, Steal/Chant/Rescue/Unlock/Shoot action checks</td></tr>
    <tr><td>Chapter / map / event / save</td><td>768</td><td>Script loading, event dispatch, map loading, movement ranges, save-block construction</td></tr>
    <tr><td>Items and inventory</td><td>116</td><td>Item usability, convoy variants, inventory compaction, forging result application</td></tr>
    <tr><td>Skills and status</td><td>87</td><td>Movement-cost grids, active skill slots, terrain defense, skill-driven action availability</td></tr>
    <tr><td>Unit stats</td><td>191</td><td>HP, Strength, Magic, Skill, Speed, Luck, Defense, Resistance, movement, support and actor initialization helpers</td></tr>
    <tr><td>AI flow</td><td>46</td><td>Target scoring, click/target computation, ally-target dispatch</td></tr>
  </tbody></table>
  <p>A separate readability pass over 1,404 gameplay functions rates 1,078 as good, 316 as usable, 9 as noisy, none as hard to read, and one as a decompile failure. The noisiest known gameplay functions are concentrated in the script interpreter, map loading, movement/search helpers, save construction, and combat-exchange execution.</p>
  <h2>Example: named runtime configuration</h2>
  <p>The executable does not embed every balance constant directly in its instruction stream. Seven small native accessors resolve a runtime resource named <code>GameData</code>, map the current difficulty to one of four columns, and read rows controlling battle EXP, promotion effective level, boss and thief bonuses, transformed-unit growth, and a class critical bonus. This pattern separates native formulas from named configuration loaded at runtime.</p>
  <p>In the NTSC-U executable, the seven accessors occupy <code>0x801F19A0</code>&ndash;<code>0x801F1CE8</code>. These addresses identify <code>GFEE01</code> only. The corresponding PAL functions must be matched by their instructions, callers, and behavior rather than by applying a fixed address difference.</p>
  <p>Function addresses identify one regional build only; the durable documentation is the function's behavior, inputs, and relationships rather than a bare address.</p>
  <h2>PAL cross-reference and library boundaries</h2>
  <p>The PAL <code>GFEP01</code> executable can be lined up with the US <code>GFEE01</code> executable by matching each function's machine-code body after masking operands that naturally differ between regional builds. This is not a fixed-offset conversion: the address drift grows through the file because the PAL build carries extra language support. The current cross-reference places 8,746 PAL functions in the US executable with call-graph agreement across 32,204 relationships and identifies 5,046 corresponding data addresses.</p>
  <p>That mapping imported many verified SDK, MSL, and MetroTRK names, corrected earlier disc-drive-versus-audio-chip mislabels, created hundreds of previously missing function entries reached only through pointers, and repaired several bad function extents. It is still only an identity map and boundary aid: a matching decompilation proves byte-level correspondence, not the gameplay meaning of a function.</p>
  <p>Library code is not safely described as one broad contiguous block per library. MSL string/vector code, for example, appears in several islands with ordinary game code between them. Candidate library regions should therefore be treated as candidate provenance until code patterns, diagnostic strings, SDK state/register access, or source-level matches confirm an exact identity.</p>
  <h2>Recovered object and callback structure</h2>
  <p>The executable contains many C++-style object families with vtables. Confirmed classes now include UI widgets, list boxes, popup message windows, map-action panels, sound-voice helpers, gauges, render helpers, and placeholder vtable groups for still-unnamed families. Shared vtable methods remain shared base behavior; a function is not assigned to a derived class merely because it appears in that derived table.</p>
  <p>The controller-input path also uses a real callback table. <code>pad_set_spec</code> selects one of several status decoders; spec 0 and spec 1 are distinct 0x174-byte functions rather than raw labels, while specs 2 through 5 share the modern decoder. The callbacks decode button bits, sticks, and triggers into a 12-byte PAD status record; <code>pad_read</code> writes the error byte separately.</p>
  <p>Not every retained configuration is actually wired up, though. The executable still carries a complete six-language name table and a script-facing call for reading the current language, but in the shipped US disc that call is hardwired to always return the English selection — nothing at runtime reads or writes an actual language choice, even though the data and the plumbing for one still exist.</p>
  `
},

"save-format": {
  ns:"format", title:"GameCube Save (.gci)", dek:"Memory-card container, CRC-checked save blocks, the shared system data and the tagged chapter-state stream",
  infobox:{ type:"Save format", status:"confirmed", fields:[
    ["Container","GameCube <code>.gci</code>"],["Blocks","6 × 0x4000 file blocks + 2 × 0x6000 checkpoints"],
    ["File slots","5, sharing the six file blocks"],["Integrity","CRC-32 per block"],
    ["Chunks","<code>BMST</code>, <code>MDST</code>, <code>UNIP</code>, <code>SOKO</code>, <code>FWEP</code>, <code>T  T</code>"]
  ]},
  categories:["Save Data","Container"],
  body:`
  <p>A <code>.gci</code> file is a single GameCube memory-card entry: a 0x40-byte directory header followed by the game's payload. The header holds the game and company identifiers (<code>GFEE</code>, <code>01</code>), the internal filename <code>FIREEMBLEM8J</code>, timestamps, permissions, icon and banner metadata, and the number of card blocks used (19). There is no file-level checksum.</p>
  <h2>Body layout</h2>
  <p>After 0x2000 bytes of banner and icon images, the payload holds eight save blocks. ${badge("confirmed","confirmed")}</p>
  <table><thead><tr><th>Body offset</th><th>Size</th><th>Use</th></tr></thead><tbody>
    <tr><td><code>0x2000</code> + <em>i</em> × <code>0x4000</code>, <em>i</em> = 0–5</td><td><code>0x4000</code> each</td><td>File blocks</td></tr>
    <tr><td><code>0x1A000</code>, <code>0x20000</code></td><td><code>0x6000</code> each</td><td>Checkpoint (suspend) blocks</td></tr>
  </tbody></table>
  <p>Each file block names its file slot (0–4) in its header; the six blocks are shared by up to five slots. When the card is read at boot, the game discards every block whose checksum fails, keeps only the newest block (highest sequence number) of each slot and only the newer checkpoint, and frees the rest. A new save goes into a free block, and its sequence number is one more than the highest on the card. An interrupted save therefore leaves the slot's previous block in place. ${badge("confirmed","confirmed")}</p>
  <h2>Block header</h2>
  <table><thead><tr><th>Offset</th><th>Size</th><th>Meaning</th></tr></thead><tbody>
    <tr><td><code>+0x00</code></td><td>64</td><td>Title and date text shown by the memory-card screen</td></tr>
    <tr><td><code>+0x40</code></td><td>4</td><td>Magic <code>"FE8J"</code></td></tr>
    <tr><td><code>+0x44</code></td><td>4</td><td>Version stamp <code>0x20050201</code></td></tr>
    <tr><td><code>+0x48</code></td><td>4</td><td>Sequence number</td></tr>
    <tr><td><code>+0x4C</code></td><td>4</td><td>Block size</td></tr>
    <tr><td><code>+0x50</code></td><td>4</td><td>CRC-32 of the block from <code>+0x70</code> to its end</td></tr>
    <tr><td><code>+0x58</code></td><td>8</td><td>Play time in console timer ticks (40.5 million per second)</td></tr>
    <tr><td><code>+0x60</code></td><td>1</td><td>Save kind: 2 file save, 3 checkpoint, 1 a consumed copy (half-written, never loaded)</td></tr>
    <tr><td><code>+0x61</code></td><td>1</td><td>Playthrough id, recorded in the system data when the game is finished</td></tr>
    <tr><td><code>+0x62</code></td><td>1</td><td>File slot 0–4</td></tr>
    <tr><td><code>+0x63</code></td><td>1</td><td>For a checkpoint, the file slot it suspends</td></tr>
    <tr><td><code>+0x64</code></td><td>1</td><td>Chapter number</td></tr>
    <tr><td><code>+0x65</code></td><td>1</td><td>Resume point (below)</td></tr>
    <tr><td><code>+0x66</code></td><td>1</td><td>Difficulty: 0 Normal, 1 Hard, 2 Maniac, 3 Easy</td></tr>
    <tr><td><code>+0x70</code></td><td>0x48</td><td>System data (below)</td></tr>
    <tr><td><code>+0xB8</code></td><td>rest</td><td>Tagged chapter-state stream</td></tr>
  </tbody></table>
  <p>The checksum is standard CRC-32 (the same polynomial as ZIP and PNG). A block whose checksum doesn't match is treated as empty, so changing any byte from <code>+0x70</code> onward requires recomputing it. A stored checksum of <code>0x12345678</code> and save kind 1 skip the check. ${badge("confirmed","confirmed")}</p>
  <p>The resume point decides where loading the block leads (see ${wl("chapters")}): ${badge("confirmed","engine")}</p>
  <table><thead><tr><th>Value</th><th>Saved from</th><th>Loading it</th></tr></thead><tbody>
    <tr><td>1</td><td>The base menu</td><td>Reloads the map and returns to the base</td></tr>
    <tr><td>2</td><td>Battle preparations</td><td>Reloads the map and returns to preparations</td></tr>
    <tr><td>3</td><td>New Game</td><td>Starts the first chapter</td></tr>
    <tr><td>4</td><td>The save after a victory</td><td>Starts the next chapter from its opening</td></tr>
    <tr><td>5, 6, 7</td><td>The end of part 1, 2 or 3 of a multi-part chapter</td><td>Continues with the next part</td></tr>
    <tr><td>8</td><td>A checkpoint (suspend)</td><td>Resumes the battle where it stopped</td></tr>
    <tr><td>10</td><td>A trial map</td><td>Starts that trial map</td></tr>
  </tbody></table>
  <h2>System data</h2>
  <p>Header <code>+0x70</code> is a copy of the console-wide system data, written into every block. At boot the game takes it from the newest block that carries it. ${badge("confirmed","confirmed")}</p>
  <table><thead><tr><th>Offset</th><th>Size</th><th>Meaning</th></tr></thead><tbody>
    <tr><td><code>+0x00</code></td><td>8</td><td><code>"SYSF"</code> and the version stamp</td></tr>
    <tr><td><code>+0x08</code></td><td>8</td><td>Random system id made with the data; a save is only written over data with the same id</td></tr>
    <tr><td><code>+0x10</code></td><td>2</td><td>Unlocks: bit 0 game finished (clear records, trial map 1), bits 1 and 2 trial maps 2 and 3, bits 4 and 5 trial maps 4–6. Finishing on Normal or Easy sets bit 0, Hard bits 0–1, Maniac bits 0–2.</td></tr>
    <tr><td><code>+0x12</code></td><td>30</td><td>Ids of the playthroughs that reached the ending; their count + 1 is the playthrough number shown on a new file</td></tr>
    <tr><td><code>+0x30</code></td><td>16</td><td>Characters met: one bit per character number below 128, set whenever a unit is deployed</td></tr>
    <tr><td><code>+0x40</code></td><td>3</td><td>Screen position X and Y and brightness (the Screen menu)</td></tr>
    <tr><td><code>+0x47</code></td><td>1</td><td>Last file slot used</td></tr>
  </tbody></table>
  <h2>The state stream</h2>
  <p>From <code>+0xB8</code> the block is a sequence of four-character tags, each followed by the record its serializer writes. There are no length fields. Every record has a fixed size except <code>UNIP</code>, which takes 2 bytes per empty unit slot and 143 per used one, so the chunks after it move as the army grows. The rest of the block is zero. ${badge("confirmed","confirmed")}</p>
  <table><thead><tr><th>Tag</th><th>Size</th><th>Contents</th></tr></thead><tbody>
    <tr><td><code>BMST</code></td><td><code>0x214</code></td><td>Party and chapter state, including the ${wl("event-flags","event flags")}</td></tr>
    <tr><td><code>MDST</code></td><td><code>0x20</code></td><td>Map display state (sight mode, weather, fog) and camera</td></tr>
    <tr><td><code>UNIP</code></td><td>159 slots</td><td>Every unit slot, player and enemy</td></tr>
    <tr><td><code>SOKO</code></td><td><code>0x320</code></td><td>The convoy: 200 item slots</td></tr>
    <tr><td><code>FWEP</code></td><td><code>0x480</code></td><td>The forged-weapon pool</td></tr>
    <tr><td><code>T  T</code></td><td><code>0x204</code></td><td>The map's tile records: doors, chests, villages, walls, ballistae</td></tr>
  </tbody></table>
  <h2>BMST — party and chapter state</h2>
  <table><thead><tr><th>Offset after tag</th><th>Size</th><th>Meaning</th></tr></thead><tbody>
    <tr><td><code>0x10</code></td><td>1</td><td>Chapter number</td></tr>
    <tr><td><code>0x11</code>, <code>0x12</code></td><td>1, 2</td><td>Army whose phase it is, turn number</td></tr>
    <tr><td><code>0x18</code>, <code>0x1C</code></td><td>4, 4</td><td>Gold, bonus experience</td></tr>
    <tr><td><code>0x20</code></td><td>0x30</td><td>The chapter's four objective text keys</td></tr>
    <tr><td><code>0x52</code>, <code>0x53</code></td><td>1, 1</td><td>Map cursor tile</td></tr>
    <tr><td><code>0x54</code></td><td>1</td><td>Resume point</td></tr>
    <tr><td><code>0x55</code></td><td>1</td><td>The base's opening event already ran</td></tr>
    <tr><td><code>0x56</code>, <code>0x57</code></td><td>1, 1</td><td>Deployment surplus, playthrough number</td></tr>
    <tr><td><code>0x58</code>, <code>0x60</code></td><td>8, 8</td><td>Play-time tick counters</td></tr>
    <tr><td><code>0x68</code>–<code>0x73</code></td><td>12</td><td>Chapter report: gold gained, gold spent, bonus experience, score</td></tr>
    <tr><td><code>0x74</code>, <code>0x84</code></td><td>16, 16</td><td>Tutorials unlocked and tutorials read (one bit each)</td></tr>
    <tr><td><code>0x9C</code></td><td>12</td><td>Options: menu switches (unit and terrain windows, message speed, fixed growths…), unit speed, brightness, screen position, music and sound volume, difficulty</td></tr>
    <tr><td><code>0xA8</code></td><td>12</td><td>The 96 event flag bits</td></tr>
    <tr><td><code>0xB4</code></td><td>0x140</td><td>Clear history: 40 entries of chapter, part flag, turns and play time in seconds</td></tr>
    <tr><td><code>0x1F4</code></td><td>0x18</td><td>Map name, <code>bmap02</code> or <code>trial_05</code></td></tr>
  </tbody></table>
  <p>In a save made after a victory, the chapter number already points at the next chapter while the map name is still the map just won. Loading such a save starts the next chapter, which clears every chapter-local flag, so the chapter flag bits stored in it are leftovers. In base, preparation, part and checkpoint saves every bit is live. ${badge("confirmed","confirmed")}</p>
  <h2>UNIP — units</h2>
  <p>A unit's position in the 159-slot unit table is its slot number, which the records use to link units together. Characters, classes and items are stored as their position in ${wl("fe8data","FE8Data")}'s tables, counting from 1, so a mod that reorders those tables changes what existing saves contain. A used slot holds: ${badge("confirmed","confirmed")}</p>
  <table><thead><tr><th>Offset</th><th>Size</th><th>Meaning</th></tr></thead><tbody>
    <tr><td><code>0</code>, <code>2</code></td><td>2, 2</td><td>Character and class numbers (0 = empty slot, 2 bytes only)</td></tr>
    <tr><td><code>4</code></td><td>1</td><td>Army: 0 player, 1 enemy, 2 ally, 3 other, 4 free, 5 reserve, 6 inactive, 7 removed</td></tr>
    <tr><td><code>5</code>–<code>7</code></td><td>3</td><td>Previous and next unit of the same army, carried unit</td></tr>
    <tr><td><code>8</code>–<code>14</code></td><td>7</td><td>Deployment group, level, experience (255 = none), laguz gauge, a 0–100 value, tile X and Y</td></tr>
    <tr><td><code>15</code>, <code>19</code></td><td>4, 4</td><td>State bits; temporary status and bonuses</td></tr>
    <tr><td><code>23</code>–<code>25</code></td><td>3</td><td>Current HP, build bonus, movement bonus</td></tr>
    <tr><td><code>26</code></td><td>8</td><td>HP, Str, Mag, Skl, Spd, Lck, Def, Res held on top of the class base</td></tr>
    <tr><td><code>34</code></td><td>8</td><td>Fixed-growth accumulators</td></tr>
    <tr><td><code>42</code></td><td>16</td><td>Skills: one bit per skill table index</td></tr>
    <tr><td><code>58</code></td><td>32</td><td>Eight item slots</td></tr>
    <tr><td><code>90</code></td><td>8</td><td>Weapon experience for sword, lance, axe, bow, fire, thunder, wind and staff (E 1, D 31, C 71, B 121, A 181, S 251)</td></tr>
    <tr><td><code>98</code></td><td>14</td><td>Battles, lifetime kills, kills on this map, tiles moved, two more counters, chapter of the last kill</td></tr>
    <tr><td><code>112</code></td><td>10</td><td>${wl("support-system","Support")} points, one per support-list slot</td></tr>
    <tr><td><code>122</code></td><td>15</td><td>${wl("cp-data-format","AI")} script choices, steps, flags and turn order</td></tr>
    <tr><td><code>137</code></td><td>6</td><td>One more value and padding</td></tr>
  </tbody></table>
  <p>An item slot, in a unit or in the convoy, is the item number (2 bytes), its remaining uses, and a flag byte: <code>0x80</code> equipped, <code>0x40</code> dropped when its holder is defeated, and the low six bits the forge record (1–48) of a forged weapon. ${badge("confirmed","confirmed")}</p>
  <h2>FWEP — forge record pool</h2>
  <p>The forged-weapon pool is copied as raw bytes: 48 records at a stride of <code>0x18</code>.</p>
  <table><thead><tr><th>Record offset</th><th>Meaning</th></tr></thead><tbody>
    <tr><td><code>+0x00</code></td><td>Allocation marker, 0 free and 1 allocated</td></tr>
    <tr><td><code>+0x01..0x0F</code></td><td>Custom weapon name; first byte zero means no custom name</td></tr>
    <tr><td><code>+0x10</code></td><td>Signed might steps</td></tr>
    <tr><td><code>+0x11</code></td><td>Signed hit steps; each step is worth 5 hit</td></tr>
    <tr><td><code>+0x12</code></td><td>Signed critical steps; each step is worth 3 critical</td></tr>
    <tr><td><code>+0x13</code></td><td>Signed weight-reduction steps</td></tr>
    <tr><td><code>+0x14..0x17</code></td><td>Attack-trail colour (RGBA) picked in the forge, <code>80 80 80 FF</code> by default</td></tr>
  </tbody></table>
  <h2>T  T — map tile records</h2>
  <p>64 records of 8 bytes and a count. Each record names a tile (X, Y), a type, a subtype and four value bytes; the chapter scripts fill the table when the map starts, and the map updates it as things happen. ${badge("confirmed","confirmed")}</p>
  <table><thead><tr><th>Type</th><th>Meaning</th></tr></thead><tbody>
    <tr><td>4</td><td>Breakable wall (current and maximum HP)</td></tr>
    <tr><td>7</td><td>Ballista (item and uses)</td></tr>
    <tr><td>9, 10</td><td>Pit, rolling rock</td></tr>
    <tr><td><code>0x21</code>–<code>0x25</code></td><td>Door opened, roof opened, chest opened, village visited, building destroyed</td></tr>
  </tbody></table>
  <h2>What remains unknown</h2>
  <p>Every byte is stored and restored as listed, but a few have no known gameplay meaning yet: the first 16 bytes of <code>BMST</code>, its bytes <code>0x50</code>, <code>0x51</code> and <code>0x94</code>–<code>0x9B</code>, the labels of some option switches, three unit counters, and two system-data bytes. ${badge("open","open")}</p>
  `
},
gcfesnd: {
  ns:"format", title:"gcfesnd.bin", dek:"The game-specific sound cue catalog layered above the MusyX engine",
  infobox:{ type:"Audio registry", status:"strong", fields:[
    ["Location","<code>Sound/gcfesnd.bin</code>"],["Names","BGM, SFX, and STM filenames"],["Runtime lookup","Two-hash bucket table"]
  ]},
  categories:["Audio","Registry"],
  body:`
  <p><code>gcfesnd.bin</code> is the game-specific catalog above ${wl("musyx","MusyX")}. It contains symbolic <code>BGM_*</code> cue names, roughly 1,150 <code>SFX_*</code> names, and the filenames of streamed ${wl("stm-format","STM music tracks")}.</p>
  <h2>Record array</h2>
  <p>After a 0x20-byte header, a flat array of self-sized records runs until a zero length byte: 148 twelve-byte <code>BGM_*</code> records, then 1,154 twenty-byte <code>SFX_*</code> records. All fields are big-endian.</p>
  <table class="wikitable"><tr><th>Offset</th><th>Size</th><th>SFX field</th></tr>
  <tr><td>+0x00</td><td>4</td><td>Name string offset (add 0x20)</td></tr>
  <tr><td>+0x04</td><td>1</td><td>Record length, always 20</td></tr>
  <tr><td>+0x05</td><td>1</td><td>Flags; low 2 bits select the voice class (values 0, 1, 8 seen)</td></tr>
  <tr><td>+0x06</td><td>1</td><td>Default volume, 0-127</td></tr>
  <tr><td>+0x07</td><td>1</td><td>Pan (0x40 = centre on 1,131 of 1,154 cues)</td></tr>
  <tr><td>+0x08</td><td>4</td><td>Sound id into the MusyX banks; several cues share one id (0x158 is the silent dummy)</td></tr>
  <tr><td>+0x0C</td><td>4</td><td>Four small bytes, first usually 0x1E (priority/range-like, inferred from the game's accessors)</td></tr>
  <tr><td>+0x10</td><td>4</td><td>Distance-like value (2000, 100, 200, 150, 750 ...)</td></tr></table>
  <p>Cue names group by second component: BTL (632), BMP (214), ARAM (114), SYS (71), EVT (59), ENV (52) and a few others. The meaning of the last two fields is inferred, not proven.</p>
  <h2>How a cue name reaches audio data</h2>
  <p>The SFX portion contains an ascending numeric-ID/string-offset table. BGM playback instead passes a symbolic name into a generic native lookup. That lookup computes two polynomial hashes (multipliers 37 and 31); the first selects one of 509 buckets, while the second helps reject collisions in the bucket's linked list.</p>
  <p>The bucket table is populated in zero-initialized runtime memory. Consequently the executable proves how names are resolved, while a static copy of the DOL cannot by itself show the final cue-to-loaded-track mapping for every BGM name.</p>
  `
},

musyx: {
  ns:"format", title:"MusyX Audio Resources", dek:"Numeric sample directories and sample banks used by the GameCube sound engine",
  infobox:{ type:"Audio formats", status:"strong", fields:[
    ["Core files","<code>.sdir</code> and <code>.samp</code>"],["Identifiers","Numeric sample IDs"],["Streamed music","Separate <code>.stm</code> files"]
  ]},
  categories:["Audio"],
  body:`
  <p>MusyX is the sound engine used by the game. Its <code>.sdir</code> files are directories describing samples and their numeric identifiers; corresponding <code>.samp</code> files hold encoded sample payloads. These resources primarily serve effects and instrument/sample playback rather than long streamed music.</p>
  <h2>How directory and bank cooperate</h2><p>The directory provides metadata and numeric identity; the sample bank provides encoded waveform bytes. A consumer resolves an ID through the directory, locates the matching payload, and gives it to the MusyX playback engine.</p>
  <h2>Example and boundary</h2><p>A short sound effect can be addressed by numeric sample metadata and decoded from <code>.samp</code>. A chapter BGM cue follows a different route through ${wl("gcfesnd")} to a streamed ${wl("stm-format","STM track")}; searching MusyX sample IDs alone will not explain that mapping.</p>
  <p>MusyX's core tables use numeric IDs, not the readable <code>BGM_*</code> and <code>SFX_*</code> strings used by game logic. ${wl("gcfesnd")} supplies that game-specific naming layer. Long background tracks use ${wl("stm-format","STM containers")}, whose audio payload is GameCube DSP-ADPCM.</p>
  `
},

zdbx: {
  ns:"format", title:"ZDBX & DBX", dek:"The battle engine's text tables: which model each unit uses, and how it animates and moves",
  infobox:{ type:"Text archive", status:"strong", fields:[
    ["Outer file","<code>zdbx.cmp</code>"],["Pipeline","LZ10 → pack → DBX text"],["Entries","449"]
  ]},
  categories:["Container","Battle Graphics"],
  body:`
  <p><code>zdbx.cmp</code> is ${wl("lz10","LZ10-compressed")} and expands to a ${wl("pack-archive","pack archive")} containing 449 mostly Shift-JIS text files. A DBX document uses braces, <code>#</code> comments, and whitespace-separated names and values. It is readable configuration rather than compiled fixed-record data.</p>
  <table><thead><tr><th>Folder</th><th>Entries</th><th>Purpose</th></tr></thead><tbody>
    <tr><td><code>zu/</code></td><td>184</td><td>Two tables per battle-model code of <code>files/zu/</code>: the model table and the parameter table (see below)</td></tr>
    <tr><td><code>xwp/</code></td><td>91</td><td>One table per weapon, named by its item ID without <code>IID_</code>: the model the battle loads (<code>Model</code> block: folder and model name), its kind and whether it flies as a missile (see ${wl("items-weapons","Items & Weapons")})</td></tr>
    <tr><td><code>zbg/</code></td><td>117</td><td>One <code>param.dbx</code> per battle scenery: indoor flag, footstep effect and sound (see below)</td></tr>
    <tr><td><code>xcam/</code></td><td>19</td><td>Camera scripts for attack, critical, impact, death, level-up, and class-change beats: keyframes that move one of the camera rigs of <code>camera.dbx</code> (see below)</td></tr>
    <tr><td><code>zdbx/</code></td><td>11</td><td>Master class, model, weapon, skill, effect, scenery, camera, and engine tables</td></tr>
    <tr><td><code>ztool/</code>, <code>ztex/</code></td><td>27</td><td>Window layouts of the in-game battle tool, and 2D textures: the battle screen's windows and digits (see below) and the tool's widgets</td></tr>
  </tbody></table>
  <h2>How DBX participates in battle presentation</h2>
  <p>The battle engine (named “kiribato” in the files' own comments) opens <code>zdbx.cmp</code> when a battle starts and reads its tables by name. Global tables select class, weapon, effect, scenery, and camera resources; per-asset files then tune how those resources attach and play. DBX is configuration, not the model geometry or animation curves themselves.</p>
  <h2>How a combatant's battle model is chosen</h2>
  <ol>
    <li><strong><code>zdbx/jobList.dbx</code></strong> gives the model code. The engine tries the unit's animation ID (<code>AID_MAGE_TO mgm2</code>, Tormod's), then its class plus character (<code>JID_ARCHER PID_LOFA=arc2</code>, Rolf's; the code is cut to four characters), then its class alone (<code>JID_FIGHTER fig1</code>). ${badge("confirmed","engine + in game")}</li>
    <li><strong><code>zu/&lt;code&gt;.dbx</code></strong> (the model table) names the model inside the packs and, for every weapon and action, the animation to play (<code>ax_攻撃1 fig1_at1_ax</code>: the first axe attack).</li>
    <li>The packs are <code>zu/&lt;code&gt;/&lt;code&gt;_&lt;weapon&gt;.pak</code> (a <code>.cmp</code> of the same name would be tried first).</li>
    <li><strong><code>zu/&lt;code&gt;_prm.dbx</code></strong> (the parameter table) starts with <code>texnum</code> and that many texture lines. The texture is picked by the unit's animation ID, then its character, then its army (<code>自軍</code> player, <code>敵軍</code> enemy, <code>中立</code> other, <code>味方</code> ally), falling back to the model code; the file is <code>zu/&lt;code&gt;/&lt;name&gt;.tpl</code>. Tuning keys follow: move speed (<code>移動速度</code>), range (<code>間合い</code>), five jump variants of the attacks, flying type (<code>飛行系</code>), flying away after the finishing blow, run count (<code>走り回数</code>), knockback on damage (<code>ダメージ後退</code>), three animation blend speeds and a large-model flag (<code>大型</code>). ${badge("confirmed","engine")}</li>
  </ol>
  <p>A new battle model can be added without replacing one: a copied model folder under a new code, its two tables, and one job-list line. In the Prologue, Boyd was given <code>zu/bol2</code> (a copy of <code>fig1</code> with a recoloured texture) through the line <code>JID_FIGHTER PID_BOLE_MAP1=bol2</code>; the game drew it in battle while every other fighter kept <code>fig1</code>. ${badge("confirmed","in game")}</p>
  <h2>Important master tables</h2>
  <ul><li><code>jobList.dbx</code> maps each <code>JID_</code> class to its battle-model code and contains character- and animation-ID-specific overrides.</li><li><code>weaponList.dbx</code> lists weapons in item-table order.</li><li><code>skill.dbx</code> links Japanese skill names with effect triggers.</li><li><code>effectList.dbx</code> catalogs spell, skill, status, environmental, and UI effects.</li><li><code>camera.dbx</code> defines the default battle-camera rig.</li><li><code>bgList.dbx</code> maps battle-scenery identifiers to locations: the Prologue (<code>MAP01</code>) fights in front of <code>zbg/map01_woods</code>, a separate 3D scene rather than the map terrain. ${badge("confirmed","confirmed in game")}</li><li><code>param.dbx</code> contains global battle timing, fade, and camera parameters.</li></ul>
  <h2>Weapon, scenery, camera and unit-parameter tables</h2>
  <p>These tables are short and fully read; every field is listed. The meanings of the numeric codes are read off which files use them; the engine code that consumes them is not traced further.</p>
  <ul>
    <li><strong><code>xwp/&lt;NAME&gt;.dbx</code></strong> has a <code>Model</code> block (<code>name</code>, <code>folder</code>, <code>model</code>; tomes have none) and a <code>Weapon</code> block: <code>show</code> (always 1), <code>kind</code>, <code>missile</code>, optional <code>effectId</code> (an <code>EID_</code> effect played with the weapon) and <code>damageEffId</code> (an <code>EID_..._WP</code> effect on the target). <code>kind</code>: 0 sword, 1 lance, 2 axe, 3 bow, 4 tome (no model), 5 knife, 6 thrown spear, 7 thrown axe or sword, 8 wave blade (Rune and Sonic swords), 9 arrow, 10 beast claw, 11 dragon breath. <code>missile</code>: 0 melee, 1 flies as a projectile, 2 special wave.</li>
    <li><strong><code>zbg/&lt;scenery&gt;/param.dbx</code></strong> has one <code>Param</code> block: <code>name</code>, <code>roomFlag</code> (1 for indoor sceneries), <code>footEffect</code> and <code>footSound</code> (0 none, 1 dirt, 2 water, 3 snow, 4 grass; the sound follows the same order). Ships, bridges and floors use 0; rivers, seas and swamps use 2; Daein's snowy sceneries use 3.</li>
    <li><strong><code>zdbx/camera.dbx</code></strong> has one <code>Camera</code> block per rig: <code>cam0</code> (scene camera), <code>cam1</code> (free orbit camera), <code>camCharaL0</code> and <code>camCharaR0</code> (follow an actor: <code>entityClass Actor</code>, then <code>charaAtk</code>, <code>charaDef</code>, <code>charaSup</code> in the order to try), <code>camCharaL1</code> and <code>camCharaR1</code> (follow a weapon: <code>weapon0</code> to <code>weapon2</code>, with a <code>speed</code>). Fields are <code>pos</code>, <code>rot</code> (degrees), <code>dist</code>, <code>offs</code> (look-at offset), <code>dest</code>, <code>attract</code>, <code>eyeCenter</code> and <code>enable</code>. Vanilla has a typo on <code>cam1</code>: <code>rot -2.-2, 180.0, 0.0</code>.</li>
    <li><strong><code>xcam/&lt;name&gt;.dbx</code></strong> is one <code>CameraAnime</code> block: <code>name</code>, <code>caption</code> (Japanese description), optional <code>folder</code>, <code>camera</code> (the rig it moves), <code>num</code>, then <code>num</code> keyframes each written as <code>pos</code>, <code>rot</code>, <code>dist</code>, <code>time</code>. <code>time</code> is the keyframe's duration in engine units (0 cuts straight to it); the unit is not measured.</li>
    <li><strong><code>zu/&lt;code&gt;_prm.dbx</code></strong> tuning keys follow the texture lines: floats <code>移動速度</code> (move speed, 0.15 to 1.0), <code>間合い</code> (attack range, 10 to 22), <code>ルートスケール</code> (root scale), <code>ダメージ後退</code> (knockback, 0.1 or 1.0); whole numbers <code>走り回数</code> (run count) and the blend speeds <code>補間速度</code>, <code>待機補間速度</code>, <code>移動補間速度</code> (10 to 30); and flags that are either <code>1</code> or absent: <code>ジャンプ攻撃</code>, <code>ジャンプ攻撃２</code>, <code>ジャンプ必殺</code>, <code>ジャンプ止め</code>, <code>ジャンプ奥義</code> (jumping attack variants), <code>飛行系</code> (flying), <code>大型</code> (large), <code>止め飛び去り</code> (flies away on the finishing blow).</li>
  </ul>
  <h2>The battle screen's layout</h2>
  <p><code>zdbx/battle.dbx</code> lays out everything drawn over a battle scene, as widget blocks: <code>Layer</code> (<code>Window</code>, <code>Caption</code>, the two name plates, <code>Exp</code>), <code>Texture</code> (a cell of an image in <code>ztex/</code>), <code>Picture</code>, <code>Caption</code> (text), <code>Number</code>, <code>Gauge</code> and <code>Rect</code>. Each block has a <code>name</code>, a <code>layer</code>, <code>show</code> and a <code>pos</code> on a 640×480 screen. The two HP windows come from <code>ztex/btlwin.tpl</code> (a 600×224 sheet of window frames and gauge bars). The bars are the gauges <code>GaugeL</code> and <code>GaugeR</code>, each paired with its HP number (<code>numName</code>), and HP digits come from <code>ztex/number.tpl</code>. The names and weapon names are captions the game fills in at the start of the fight. The left side is always the attacker and the right side the defender. ${badge("confirmed","engine")}</p>
  <p>The layout still holds a stat panel from development: a <code>ParamWin</code> picture and six <code>Number</code> widgets, <code>NumAtkL/R</code>, <code>NumHitL/R</code> and <code>NumCritL/R</code>, between the two HP windows, all with <code>show 0</code>. The game still writes each fighter's attack, hit and critical rate into them at the start of every battle. They can't simply be switched on: their digit texture <code>num1</code> (10×20 cells at row 28 of <code>number.tpl</code>) is outside the shipped 200×32 image, which only has the large HP digits, and the region <code>ParamPlate</code> points at in <code>btlwin.tpl</code> now holds other window art. ${badge("confirmed","engine + files")}</p>
  <p>The archive, its catalog tables and all of the tables above are understood. Not decoded: the units of speed, range, blend and camera time values, the layout files of <code>ztool/</code>, and the use of most <code>ztex/</code> textures besides the battle windows and digits.</p>
  `
},

posing: {
  ns:"system", title:"Skeleton Posing & Skinning", dek:"How skeleton, animation curves, and weighted mesh vertices combine into a moving model",
  infobox:{ type:"3D system", status:"confirmed", fields:[
    ["Skeleton",`${wl("model-formats",".g")}`],["Animation",`${wl("model-formats",".ga")}`],["Mesh",`${wl("model-formats",".gs")}`]
  ]},
  categories:["Graphics","Animation"],
  body:`
  <p>A moving battle model combines three data sets: a <code>.g</code> skeleton holding each bone's transform values, <code>.ga</code> curves that overwrite some of those values over time, and a <code>.gs</code> mesh whose vertices carry bone indices and weights.</p>
  <h2>How one vertex reaches its animated position</h2>
  <p>Each frame, every bone the animation drives gets a fresh local matrix from its values; the others keep their seed matrix. World matrices are chained from the root down, and a vertex is drawn through its bone's world matrix times the bone's skinning matrix. ${badge("confirmed","confirmed")}</p>
  <h2>Animation</h2>
  <p>At a requested frame, each curve's value is interpolated linearly between its neighboring keys and written into the bone's value block. The bone's matrix is then built Maya-style: translation, a rotation about the bone's rotate pivot (Euler angles applied X, then Y, then Z), and a scale about its scale pivot. Because the pivot is the joint's position, a character's limbs turn about their joints while their vertices stay stored in model space. ${badge("confirmed","confirmed")}</p>
  <p>The chained seed matrices are not the poses battle bodies are normally drawn in: battle animation clips rebuild the driven locals each frame from curve values. The seed matrix matters for bones the clip does not drive and for static single-bone geometry.</p>
  <h2>How the engine builds bone matrices</h2>
  <p>Each frame the engine walks the skeleton tree (first child, then next sibling) and chains every bone's local matrix onto its parent's, giving one world matrix per bone. A draw call that follows a single bone loads that bone's world matrix; a draw call with a bone subset loads, for each of its up to 10 bones, the world matrix multiplied by the bone's stored skinning matrix into one of the GameCube's 10 hardware matrix slots, and each vertex names its slot. Blended vertices are instead skinned on the CPU from the same matrices. ${badge("confirmed","confirmed")}</p>
  <h2>Skinning</h2>
  <p>For each mesh vertex, the game transforms the stored position by every influencing bone and blends the results using the stored weights; normals use the rotational part of the same transforms. ${badge("confirmed","confirmed")}</p>
  <p>Blending happens on the CPU and uses the same matrices as the hardware path: a vertex weighted to bones <em>b</em><sub>i</sub> is drawn at <code>Σ w<sub>i</sub> · world[b<sub>i</sub>] × skin_matrix[b<sub>i</sub>] × vertex</code>, with at most four bones and weights in 256ths. The result is stored at the fixed-point scale of the mesh's blended-vertex buffer, so an animation that carries a model far from its origin (battle clips with root motion move vertices up to about five times the body's rest size) needs a coarser scale. ${badge("confirmed","confirmed")}</p>
  <p>Character rigs mostly use identity skinning matrices and store body vertices in model space, with bone pivots placed at the joints. Static models are different: a single-bone shape stores vertices in that bone's local space, so its apparent world placement comes from the bone chain. Multi-matrix shapes draw through <code>world[bone] × skin_matrix[bone] × vertex</code>; on nearly all character classes this keeps triangles rigid under animation, with a few dragon variants as the known exceptions.</p>
  `
},

characters: {
  ns:"system", title:"Characters", dek:"How identity, class, chapter placement, and mutable state combine into a unit",
  infobox:{ type:"Game system", status:"strong", fields:[
    ["Record count","340"],["Byte format","<code>FE8Data.bin</code> §0x30"],
    ["Notable open question","<code>Support System</code>"]
  ]},
  categories:["Balance","Cast"],
  body:`
  <p>A character is the persistent identity behind a unit: Ike remains Ike when his class changes, when a chapter gives him different equipment, or when his HP changes during battle. The game represents those layers separately. The character record supplies identity and personal tendencies; the class supplies shared capabilities; deployment data describes one chapter appearance; runtime state records what is currently happening to that unit.</p>
  <h2>The four layers of a unit</h2>
  <table><thead><tr><th>Layer</th><th>Examples</th><th>Lifetime</th></tr></thead><tbody><tr><td><strong>Character</strong></td><td>Name identity, portrait, personal growths, personal skills</td><td>Shared wherever that character appears</td></tr><tr><td><strong>Class</strong></td><td>Movement, weapon ranks, stat caps, innate skills, model family</td><td>Shared by all units of that class</td></tr><tr><td><strong>Deployment</strong></td><td>Chapter inventory, starting tile, AI, bonus skill</td><td>One chapter or reinforcement group</td></tr><tr><td><strong>Runtime unit</strong></td><td>Current HP, current stats, statuses, equipped item, action state</td><td>The active battle/save state</td></tr></tbody></table>
  <div class="callout"><p class="callout-t">Do not confuse a character with a runtime unit</p><p><code>PID_IKE</code> identifies Ike's database entry. The Ike currently standing on a map is a mutable runtime unit built from that entry, a class, deployment data, and saved progression. Editing a character's starting data does not mean every mutable value in an existing save is recalculated from scratch.</p></div>
  <h2>Example — how Ike becomes a chapter unit</h2>
  <ol><li>The character table resolves <code>PID_IKE</code>, <code>FID_IKE</code>, and starting class <code>JID_RANGER</code>.</li><li>The Ranger ${wl("classes","class record")} contributes movement, weapon access, caps, innate traits, and a battle-model family.</li><li>A chapter's ${wl("dispo-format","deployment record")} names <code>PID_IKE</code> and supplies that appearance's level, army, inventory, stat bonuses, position, and optional bonus skills.</li><li>The engine creates a runtime unit carrying current HP, gained levels, temporary modifiers, status, and action state.</li><li>Combat getters combine runtime values with character and class data when the game needs an effective stat.</li></ol>
  <h2>What the character record contributes</h2>
  <p>Each character is one 0x54-byte record in ${wl("fe8data")}. It ties together a character identifier (<code>PID_</code>), a name key (<code>MPID_</code>), portrait identifier (<code>FID_</code>), initial class (<code>JID_</code>), an ${wl("support-system","affinity")}, personal weapon ranks, up to three personal skills, two animation identifiers, a ${wl("biorhythm")} pattern and phase, a recruitment order, a starting transform gauge, starting level, build, weight, eight personal stat bonuses, eight growth rates, and eight fixed-growth starting values. Every eight-stat block uses <strong>HP, Str, Mag, Skl, Spd, Lck, Def, Res</strong> order.</p>
  <p>The personal stat block is added to class-derived limits by native stat getters. Growth values are the character-specific rates used when progression tests whether each stat increases on level-up. Class data remains separate, allowing two characters in the same class to have different growths and personal bonuses.</p>
  <h2>How growth is tested at level-up</h2>
  <p>Whether those growth rates are used directly, or something else entirely, depends on one global game-state flag that can be toggled on for an entire playthrough. In the default mode, each of the eight stats is rolled independently against its own stored growth percentage — a genuinely random pass/fail check per stat, per level. An alternate fixed-growth mode instead gives every stat its own hidden accumulator: each level adds a fixed amount to that accumulator (a slightly larger amount under one specific runtime condition), and a stat only actually increases once its accumulator crosses a full point. Fixed growth trades randomness for predictability — the same characters gain the same stats at the same levels every time — without changing the stored growth rates themselves, which both modes read from the same character data.</p>
  <h2>Identity links</h2>
  <ul><li><code>PID_</code> is the stable person/character identity used by deployment and scripts.</li><li><code>FID_</code> selects portrait resources from <code>Face/</code>.</li><li><code>JID_</code> selects the initial ${wl("classes","class")}.</li><li><code>SID_</code> pointers grant personal ${wl("skills","skills or traits")}.</li><li>Animation identifiers and class/model tables help select the battle appearance described by ${wl("combat-animation")}.</li><li>Which army a unit currently belongs to is tracked separately at runtime — see ${wl("armies-allegiance")}.</li></ul>
  <p>The eight bytes after the growth rates are the starting values of the fixed-growth accumulators: a unit begins with them when it is deployed, and the fixed mode adds to them from there. ${badge("confirmed","engine")}</p>
  <h2>Personal weapon ranks</h2>
  <p>A character record carries its own nine-character weapon-rank string, in the same format as the class one (Ike <code>D--------</code>, Titania <code>-CA------</code>): the ranks the unit starts with. ${badge("confirmed","engine")}</p>
  <h2>Reference and open questions</h2>
  <p>The exact field offsets belong in ${wl("fe8data","the format article")}; this page explains their role in the unit model. The record also holds a recruitment order, which the unit lists use as their default sort (Ike 1, Titania 2, Oscar 3&hellip;), and a laguz's starting transform gauge; one word is always empty and never read. ${badge("confirmed","engine")} Generic enemy identities also require a dedicated explanation because many deployments combine reusable character templates with class and AI data rather than a unique story character.</p>
  `
},

classes: {
  ns:"system", title:"Classes", dek:"The shared rules that give a unit movement, weapon access, caps, traits, and a battle model",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Record count","115"],["Byte format","<code>FE8Data.bin</code> §0x6FC4"],
    ["Promotion bonus","Movement +1, HP cap 40→60 (confirmed)"]
  ]},
  categories:["Balance"],
  body:`
  <p>A class supplies the abilities shared by a kind of unit. Two characters in the same class may have different personal growths and skills, but they inherit the same movement rules, weapon access, stat caps, class traits, and model family. Changing class therefore changes what a character can do without changing who that character is.</p>
  <h2>What a class contributes</h2>
  <table><thead><tr><th>Capability</th><th>Effect</th></tr></thead><tbody><tr><td>Movement</td><td>How far the unit can travel and which movement rules apply</td></tr><tr><td>Weapon ranks</td><td>Which weapon families and rank levels the unit may use</td></tr><tr><td>Base values and caps</td><td>Class contribution to stats and the maximum effective values</td></tr><tr><td>Innate skills</td><td>Up to five traits present on every unit of the class</td></tr><tr><td>Linked class</td><td>Promotion partner or transformation counterpart</td></tr><tr><td>Graphics identity</td><td>Default battle-model and animation family, with possible character overrides</td></tr></tbody></table>
  <div class="callout"><p class="callout-t">Do not confuse class data with character data</p><p>A class does not contain Ike's identity, portrait, personal growth rates, current HP, or chapter inventory. Those come from ${wl("characters","character")}, runtime/save, and ${wl("dispo-format","deployment")} data.</p></div>
  <h2>Example — Ranger to Hero</h2>
  <p>Ike's character definition initially points to <code>JID_RANGER</code>. Ranger supplies his early movement, weapon permissions, caps, innate traits, and battle-model family. At promotion the linked class is <code>JID_HERO</code>. The character remains <code>PID_IKE</code>, while the new class changes shared capabilities and the applicable limits.</p>
  <h2>Promotion and transformation links</h2>
  <p>Each class is a 0x64-byte record in ${wl("fe8data")}. Its linked-class pointer is bidirectional: an unpromoted human class points to its promoted counterpart, and the promoted class points back. Of 115 records, 108 participate in linked same-species pairs. Laguz and related transformation tiers use the same structural relationship, but transformation is not a human promotion and does not imply the same stat changes — see ${wl("laguz-transformation")} for the gauge that governs it.</p>
  <div class="callout">
    <p class="callout-t">Promotion bonuses are record differences</p>
    <p>Across human promotion pairs, movement increases by <strong>+1</strong> and the HP cap changes from <strong>40 to 60</strong>. Laguz, dragon, and bird transformation pairs also gain movement but retain the same HP cap, reflecting the different role of transformation. ${badge("confirmed","confirmed")}</p>
  </div>
  <p>The moment a promotion actually happens, more changes than the class pointer: the unit's class-granted skills swap to the new class's set, level resets to <strong>1</strong> and EXP resets to <strong>0</strong>, any accumulated fixed-growth progress (see ${wl("characters")}) is halved rather than carried over in full, and current HP is clamped back within the new class's range rather than left however it stood before promotion.</p>
  <p>Eligibility has its own ceiling, separate from ordinary leveling: most units simply level up to 20 and stop, but an unpromoted unit at level 10 or higher with a valid promotion partner can instead keep gaining EXP up to a second, higher ceiling reserved for reaching a promotion.</p>
  <h2>Weapon access</h2>
  <p>Every class carries a nine-character <strong>weapon-rank string</strong>, one position per weapon family:</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr></thead><tbody>
    <tr><td>Sword</td><td>Lance</td><td>Axe</td><td>Bow</td><td>Fire</td><td>Thunder</td><td>Wind</td><td>Staff <span style="color:var(--ink-faint)">(weaker)</span></td><td>Light <span style="color:var(--ink-faint)">(weakest)</span></td></tr>
  </tbody></table></div>
  <p>A <code>-</code> forbids that family; E through S express proficiency; <code>*</code> grants use without a fixed rank. For example, Fighter enables only the Axe position, while elemental mage variants enable their corresponding Fire, Thunder, or Wind position.</p>
  <h2>Innate skills and models</h2>
  <p>Up to five class skill pointers grant ${wl("skills","traits")} to every unit of the class. Some are visible abilities; others are internal properties such as transformation or equipment permissions. The class also names a default animation ID — the Ranger's is <code>AID_LORD</code> — which picks the map model of every unit whose character has none, and ${wl("zdbx","jobList.dbx")} picks the battle model by class, with character-specific overrides. ${badge("confirmed","engine + in game")}</p>
  <h2>Other class fields</h2>
  <p>Besides its IDs, a class record points at a description text key and three plain category words (<code>human</code>, <code>armor</code>, <code>fly</code>...) that the game turns into equipment and ability flags. ${badge("strong","engine")}</p>
  <table class="tight"><thead><tr><th>Field</th><th>Effect</th></tr></thead><tbody>
    <tr><td>Innate weapon</td><td>An item on laguz classes (the hawk king's beak). A unit that fights with its natural weapon has its item slots cleared and this weapon equipped; a class without one uses its linked class's ${badge("confirmed","engine")}</td></tr>
    <tr><td>Build and weight</td><td>Added to the character's own build and weight ${badge("confirmed","engine")}</td></tr>
    <tr><td>Skill capacity</td><td>How many capacity points of skills a unit of the class can hold: 0 for citizens, 15&ndash;20 unpromoted, 25 promoted, 40 for the Black Knight and royal laguz ${badge("confirmed","engine")}</td></tr>
    <tr><td>Vision</td><td>How far the unit sees in fog: 3 for most classes, 5 for thieves, assassins and beast laguz. A Torch adds 4 ${badge("confirmed","engine")}</td></tr>
    <tr><td>Growth modifiers</td><td>Eight signed values added to the unit's growth rates, like a held item's (Swordmaster HP &minus;5, Skl +5, Lck +5, Def &minus;5) ${badge("confirmed","engine")}</td></tr>
  </tbody></table>
  <h2>Stats and movement type</h2>
  <p>After the movement byte, a class record holds its movement type — the column of terrain movement costs its units use (see ${wl("fe8data")}) — then eight base stats added to each unit's own, eight caps, and eight class growth rates (the Ranger's HP growth is 90). The game's loader skips the class Luck base and cap. ${badge("confirmed","engine")}</p>
  <h2>Open questions</h2>
  <p>Two class bytes are copied when the game loads but never read: one ranging from 1 to 4 (4 on transformed beasts, dragons and birds), and a movement category (foot, armour, cavalry, pegasus, wyvern, Valkyrie, beast, dragon, bird). Changing them has no effect. Weapon-rank strings may be shared by multiple records, so the pointer relationship matters independently of the visible nine characters.</p>
  `
},

"items-weapons": {
  ns:"system", title:"Items & Weapons", dek:"How an item definition becomes inventory, equipment, combat statistics, and durability",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Record count","189"],["Record size","0x60 bytes, every byte known"],["Byte format","<code>FE8Data.bin</code> §0x9CB4"],
    ["Notable finds","<code>IID_RAGNELL</code>, <code>IID_ALONDITE</code>"]
  ]},
  categories:["Balance","Economy"],
  body:`
  <p>An item definition describes what a weapon or usable object is. A deployment or save places an instance of that item in a unit's inventory, and runtime state tracks mutable values such as remaining durability and whether the item is equipped. Combat then combines the equipped weapon's properties with the unit's effective stats.</p>
  <h2>From item definition to combat</h2>
  <ol><li>An <code>IID_</code> selects a reusable item record in ${wl("fe8data")}.</li><li>${wl("dispo-format","Deployment")} or save data puts an instance in a unit inventory.</li><li>The unit equips one legal weapon according to ${wl("classes","class weapon access")} and any skill restrictions.</li><li>${wl("combat-mechanics","Combat")} reads might, hit, range/type flags, effectiveness, and special weapon behavior.</li><li>After use, runtime durability decreases; reaching zero removes or breaks the instance rather than changing the global item definition.</li></ol>
  <div class="callout"><p class="callout-t">Do not confuse an item record with an inventory instance</p><p><code>IID_IRONSWORD</code> defines the shared Iron Sword properties. The Iron Sword carried by a particular unit has its own remaining durability. Changing the definition affects newly interpreted instances; consuming durability does not rewrite <code>FE8Data.bin</code>.</p></div>
  <h2>Example — Iron, Steel, and Silver swords</h2>
  <p>The numeric fields of each 0x60-byte item record control durability, power, accuracy, weight, and critical rate. The common sword progression shows the trade-offs:</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Field</th><th>Iron</th><th>Steel</th><th>Silver</th><th>Reading</th></tr></thead><tbody>
    <tr><td><code>uses</code></td><td class="num">46</td><td class="num">35</td><td class="num">25</td><td>Durability — descending ${badge("confirmed","")}</td></tr>
    <tr><td><code>might</code></td><td class="num">5</td><td class="num">8</td><td class="num">13</td><td>Power — ascending ${badge("confirmed","")}</td></tr>
    <tr><td><code>hit</code></td><td class="num">90</td><td class="num">75</td><td class="num">80</td><td>Accuracy ${badge("confirmed","")}</td></tr>
    <tr><td><code>weight</code></td><td class="num">7</td><td class="num">12</td><td class="num">11</td><td>Item weight ${badge("confirmed","")}</td></tr>
    <tr><td><code>rank</code></td><td>E</td><td>D</td><td>A</td><td>Letter token, turned into a minimum weapon EXP (E 1, D 31, C 71, B 121, A 181, S 251) ${badge("confirmed","")}</td></tr>
    <tr><td><code>cost</code></td><td class="num">10</td><td class="num">20</td><td class="num">75</td><td>Price per use: shop price = cost &times; uses ${badge("confirmed","")}</td></tr>
  </tbody></table></div>
  <h2>The whole item record</h2>
  <p>Every byte of the record is known. The game's loader reads it field by field into a smaller runtime item; several fields are short <em>token strings</em> the loader compares by name rather than numbers.</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Offset</th><th>Field</th><th>Meaning</th></tr></thead><tbody>
    <tr><td><code>0x00</code>&ndash;<code>0x08</code></td><td>IID, name key, description key</td><td><code>IID_</code>, <code>MIID_</code>, <code>MH_I_</code> labels</td></tr>
    <tr><td><code>0x0C</code></td><td>Weapon type</td><td>Token <code>sword lance axe bow flame thunder wind rod knife fang item acc</code>: the rank trained and who can equip it</td></tr>
    <tr><td><code>0x10</code></td><td>Attack type</td><td>Same tokens; <code>flame thunder wind rod</code> make the attack use Magic against Resistance (the Runesword is <code>sword</code>/<code>rod</code>)</td></tr>
    <tr><td><code>0x14</code></td><td>Rank</td><td>Token <code>E</code>&ndash;<code>S</code>, or <code>N</code>/none</td></tr>
    <tr><td><code>0x18</code>&ndash;<code>0x2C</code></td><td>Six properties</td><td>Tokens such as <code>twice</code> (brave), <code>infinity</code> (unbreakable), <code>poison</code>, <code>crit0</code>, <code>magsw</code>, <code>heroonly</code>, <code>sfxseal</code>; 36 are recognised, unknown ones are ignored</td></tr>
    <tr><td><code>0x30</code>, <code>0x34</code></td><td>Two categories</td><td>What the weapon is effective against: <code>fly</code> on bows and wind, <code>beast</code> on fire, <code>dragon</code> on thunder, <code>armor</code>, <code>knight</code>, <code>alize</code> (laguz)&hellip; and <code>doorbreak</code> on axes</td></tr>
    <tr><td><code>0x38</code>, <code>0x3C</code></td><td>Effects</td><td><code>EID_</code> use/spell effect and weapon effect</td></tr>
    <tr><td><code>0x40</code></td><td>Cost</td><td>16-bit price per use</td></tr>
    <tr><td><code>0x42</code>&ndash;<code>0x48</code></td><td>Uses, might, hit, weight, crit, min range, max range</td><td>Max range 255 = Magic / 2</td></tr>
    <tr><td><code>0x49</code></td><td>Icon</td><td>Item icon number <em>n</em>: cell 96 + <em>n</em> of the 24×24 item sheet in <code>window/icon.tpl</code> (Iron Sword 0, the coin 186). Items may share an icon</td></tr>
    <tr><td><code>0x4A</code></td><td>Weapon EXP</td><td>Weapon experience per use</td></tr>
    <tr><td><code>0x4B</code>&ndash;<code>0x54</code></td><td>Stat bonuses</td><td>Signed HP, Str, Mag, Skl, Spd, Lck, Def, Res, Mov, Con while equipped (Ragnell Def +5); permanent on stat boosters</td></tr>
    <tr><td><code>0x55</code>&ndash;<code>0x5C</code></td><td>Growth modifiers</td><td>Signed growth-rate changes while equipped (Iron Sword Str &minus;5, Skl +5, Spd +5, Res &minus;5)</td></tr>
    <tr><td><code>0x5D</code></td><td>Trail colour</td><td>One of nine attack-trail colours (poison weapons are purple)</td></tr>
    <tr><td><code>0x5E</code>&ndash;<code>0x5F</code></td><td>Padding</td><td>Never read</td></tr>
  </tbody></table></div>
  <h2>How weapon properties enter combat</h2>
  <ul><li><strong>Might</strong> contributes to Attack before defense is subtracted.</li><li><strong>Type</strong> also selects which pair of stats the attack uses at all: most values compare Strength against Defense, while a specific small range of values switches the whole exchange to Magic against Resistance.</li><li><strong>Hit</strong> contributes to the displayed hit rate used by the two-roll hit test.</li><li><strong>Weight</strong> participates in the effective-Speed side of doubling rather than directly scheduling strikes.</li><li><strong>Rank</strong> becomes a minimum weapon EXP that the unit's weapon experience in that type must reach.</li><li><strong>Effectiveness</strong> compares the categories of the equipped weapon and item with the categories of the target's class and can double the weapon's Might (see ${wl("combat-mechanics")}).</li><li><strong>Special flags</strong> can create Brave-style extra strikes or suppress effectiveness.</li></ul>
  <p>The same table includes <code>IID_RAGNELL</code> and <code>IID_ALONDITE</code>, while siege-weapon actions identify placed weapons such as <code>IID_ONAGER</code>. See ${wl("map-actions")} for ballista/Shoot behavior.</p>
  <h2>Forged weapon instances</h2>
  <p>A forged weapon is an ordinary item instance plus a 1-based index into the runtime forge-record pool. The pool has 48 slots, each 0x18 bytes. The record stores a custom name, signed stat-adjustment steps, and the weapon's own attack-trail colour (four RGBA bytes, grey <code>80 80 80 FF</code> by default, picked by the player in the forge menu) used instead of the item's trail colour. While the player edits a forge, the game works on a temporary record; confirming copies it into a free slot and frees the temporary one. A free record has allocation marker 0; an allocated record has marker 1.</p>
  <table><thead><tr><th>Forge field</th><th>Combat interpretation</th></tr></thead><tbody>
    <tr><td>Might step</td><td><code>max(1, base_might + step)</code></td></tr>
    <tr><td>Hit step</td><td><code>max(1, base_hit + 5 * step)</code></td></tr>
    <tr><td>Critical step</td><td><code>max(0, base_critical + 3 * step)</code></td></tr>
    <tr><td>Weight-reduction step</td><td><code>max(1, base_weight - step)</code></td></tr>
  </tbody></table>
  <p>The getters clamp only the lower bound and then return an 8-bit result; they do not perform an additional upper saturation to 255. The normal forge UI may still restrict which step values a player can enter. Applying a forge result replaces the stored four step values rather than adding to any previous adjustment.</p>
  <div class="callout brass">
    <p class="callout-t">Forge inventories are a grid</p>
    <p>Each chapter's ${wl("shop-format","forge section")} is a grid of 5 weapon families by 9 bases (<code>MDV_IRN</code> Iron, <code>MDV_SLM</code> Slim, <code>MDV_STL</code> Steel, <code>MDV_SLV</code> Silver, <code>MDV_HND</code> Thrown, and the four tome elements); each cell names the weapon forged from that base, for example <code>IID_IRONSWORD</code>/<code>MDV_IRN</code>. ${badge("confirmed","confirmed")}</p>
  </div>
  <h2>How a weapon gets its battle model</h2>
  <p>A weapon's 3D model is not referenced by the item record. When a battle starts, the game takes the equipped item's ID without its <code>IID_</code> prefix (<code>IRONSWORD</code>) and opens the table <code>xwp/IRONSWORD.dbx</code> inside ${wl("zdbx","zdbx.cmp")}. The table's <code>Model</code> block names a folder and model (<code>xwp/IRONSWORD</code>, <code>IRONSWORD</code>), and the game loads that pack: <code>xwp/ironsword/ironsword.cmp</code>, holding a skeleton, a mesh and a texture. The table's <code>Weapon</code> block gives the kind (0 sword, 3 bow, 4 magic, 9 arrow) and whether it flies as a missile; a tome's table has only this block and its spell effect. ${badge("confirmed","confirmed")}</p>
  <p>If the table is missing, no weapon is made for the battle. In the shipped game this happens to the Devil Axe, whose model folder exists without a table, and to the four ballistae. A forged weapon's preview in the forge uses <code>xwp/forge/&lt;name&gt;_b.cmp</code> instead; 16 weapons have one. Bows are the only weapons drawn with bending (skinned) geometry, so the string can be drawn back.</p>
  <h2>Where item information lives</h2>
  <table><thead><tr><th>Information</th><th>Location</th></tr></thead><tbody><tr><td>Definition and combat properties</td><td>${wl("fe8data","FE8Data.bin")} item table</td></tr><tr><td>Chapter inventory</td><td>${wl("dispo-format","dispos.cmp")} item slots</td></tr><tr><td>Shop availability</td><td>${wl("shop-format","shop inventory sections")}</td></tr><tr><td>Item icon</td><td><code>window/icon.tpl</code>, first image, cell 96 + icon (see ${wl("graphics-system","Graphics & Images")})</td></tr><tr><td>Battle model</td><td>${wl("zdbx","<code>xwp/&lt;NAME&gt;.dbx</code>")} in <code>zdbx.cmp</code>, which names the pack <code>xwp/&lt;folder&gt;/&lt;model&gt;.cmp</code></td></tr><tr><td>Current durability</td><td>Runtime/save inventory instance</td></tr></tbody></table>
  <h2>Special properties</h2>
  <table><thead><tr><th>Property</th><th>Carried by</th><th>Effect</th></tr></thead><tbody>
    <tr><td><code>sealcrit</code></td><td>Alondite, Ragnell, Gurgurant, Lion's claws, kings' beaks</td><td>Its wielder cannot be critted</td></tr>
    <tr><td><code>weakA</code></td><td>Ragnell, Lion's claws, dragon breaths, kings' beaks</td><td>Can damage the blessed-armour units (see ${wl("combat-mechanics")})</td></tr>
    <tr><td><code>stormsw</code></td><td>Alondite, Ragnell, Gurgurant</td><td>Plays the ranged sword-wave battle animation</td></tr>
    <tr><td><code>flutter</code></td><td>Vortex</td><td>Plays the Vortex animation; treated as a long-range attack in battle</td></tr>
    <tr><td><code>valuable</code></td><td>Unique and legendary weapons, Knight Ring</td><td>Cannot be sold or discarded</td></tr>
    <tr><td><code>JH</code></td><td>Demi Band</td><td>Halves the laguz transformation bonus to Str, Mag, Skl, Spd, Def and Res</td></tr>
    <tr><td><code>noneart</code></td><td>Boots</td><td>No effect found in the executable ${badge("open","open")}</td></tr>
  </tbody></table>
  `
},

skills: {
  ns:"system", title:"Skills", dek:"How units acquire abilities and how map, combat, and movement code apply them",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Record count","98"],["Byte format","<code>FE8Data.bin</code> §0xE398"],["Player-facing (has help text)","57 of 98"]
  ]},
  categories:["Skills","Balance","Combat","Map Actions"],
  body:`
  <p>A skill is an ability or trait attached to a unit. Some skills add a command to the map menu, such as ${wl("skill-steal","Steal")} or ${wl("skill-chant","Chant")}. Others alter combat, such as ${wl("skill-vantage","Vantage")}, ${wl("skill-sol","Sol")}, or ${wl("skill-cancel","Cancel")}. A third group is never shown to the player: the engine uses skill-like flags to mark properties such as being a boss, flying, transforming, or being permitted to equip a weapon type.</p>
  <h2>The life of a skill</h2>
  <div class="callout"><p class="callout-t">Definition → ownership → runtime check → effect</p><p>A record in ${wl("fe8data")} defines a <code>SID_</code>. A character, class, or chapter deployment grants that SID. When a unit is created, its abilities are represented in runtime state. Map-action and combat functions test the relevant skill bit, optionally perform an activation roll, and then change an action, strike, damage result, movement state, or unit property.</p></div>
  <h2>What counts as a skill</h2>
  <table><thead><tr><th>Family</th><th>What it changes</th><th>Examples</th></tr></thead><tbody><tr><td>Combat proc</td><td>Activates during a strike or exchange, usually with a chance</td><td>Sol, Luna, Cancel, Counter</td></tr><tr><td>Passive combat modifier</td><td>Changes a calculation or condition while owned</td><td>Wrath, Resolve, weapon permissions</td></tr><tr><td>Map command</td><td>Makes an action available for a selected unit</td><td>Steal, Chant, Unlock, Shoot</td></tr><tr><td>Movement capability</td><td>Changes where or when the unit can move</td><td>Canto, Pass, flying traits</td></tr><tr><td>Engine trait</td><td>Marks identity or behavior without appearing as a learnable skill</td><td>Boss, female, final boss, ${wl("laguz-transformation","transformed laguz")}</td></tr></tbody></table>
  <p>The table contains 98 records. Fifty-seven have player-facing help keys; the other 41 are internal traits and permissions. Thus “skill record” is an engine category broader than “skill shown on the Skills screen.”</p>
  <p>Internal traits the engine tests by number include: the <strong>boss</strong> flag (37 bosses: an EXP bonus when defeated), the <strong>final boss</strong> flag (Ashnard: no EXP for fighting him), the <strong>laguz class</strong> flag (every laguz class), and <strong>blessed armour</strong> (the Black Knight's class and Ashnard's mounted class: only Ragnell, the Lion's claws, the dragon breaths and the kings' beaks damage them). Some player-facing skills have internal ids that don't match their English names: Parity (<code>SID_FAIRNESS</code>, Lucia and Rikard: no support, terrain or skill bonuses in that unit's battles), Insight (<code>SID_TELEGNOSIS</code>, +20 Hit), Paragon (<code>SID_ELITE</code>), Blossom (<code>SID_FRAC90</code>), Resolve (<code>SID_BLAVE</code>), Colossus (<code>SID_RUMBLE</code>), Mantle (<code>SID_GODDESSBLESS</code>), Lethality (<code>SID_ASSASSINATE</code>), Shove and Smite (<code>SID_TACKLE</code>/<code>SID_TACKLE2</code>), Roar (<code>SID_SNARL</code>), Blessing and Boon (<code>SID_SKYBLESSING</code>/<code>SID_EARTHBLESSING</code>). Charisma gives the units of a commander's group within 3 tiles +5 Hit and +5 Avoid (enemy and other armies only, never the player's); each enemy with Horror within 3 tiles gives −5 Hit and −5 Critical. ${badge("confirmed","confirmed")}</p>
  <h2>How a unit acquires skills</h2>
  <ul><li><strong>Personal:</strong> a ${wl("characters","character record")} contains up to three <code>SID_</code> pointers.</li><li><strong>Class-innate:</strong> a ${wl("classes","class record")} contains up to five traits granted to every unit of that class.</li><li><strong>Chapter-specific:</strong> a ${wl("dispo-format","deployment record")} can grant up to five more skills for that appearance.</li><li><strong>Runtime:</strong> the active unit consolidates these capabilities into state that native map and combat code can query.</li></ul>
  <div class="callout"><p class="callout-t">Do not confuse three different numbers</p><p>The skill's <strong>table index</strong> selects its runtime bit. <code>param0</code> is the skill's <strong>icon number</strong>, 1–46 on the 51 skills that have one. <code>param1</code> is its <strong>capacity cost</strong>. None of them is a second skill ID.</p></div>
  <h2>Example — Sol from definition to healing</h2>
  <ol><li>The skill table defines <code>SID_SUNTRICK</code> at index 47 and links to its display/help keys.</li><li>A character or class grants that SID, so the created unit owns runtime skill bit 47.</li><li>During combat, the relevant path tests bit 47 and applies the shared chance mechanism.</li><li>If Sol activates and the strike deals 12 final damage, the attacker recovers 12 HP, capped at maximum HP.</li></ol>
  <h2>Where each part is stored</h2>
  <table><thead><tr><th>Part</th><th>Location</th></tr></thead><tbody><tr><td>Definition, SID, restrictions, parameters</td><td>${wl("fe8data","<code>FE8Data.bin</code>")} skill table at <code>0xE398</code></td></tr><tr><td>Short and long help keys</td><td>Offsets <code>0x0C</code> and <code>0x10</code> of the 0x28-byte record</td></tr><tr><td>Scroll that teaches it</td><td>Offset <code>0x20</code>: a one-item list (<code>IID_COUNTER</code> for Counter; every class mastery skill names the Occult scroll, <code>IID_ESOTERIC</code>)</td></tr><tr><td>Who may have it</td><td>Offset <code>0x24</code>: a list of classes or characters, <code>0x1C</code> entries long</td></tr><tr><td>Icon</td><td>Offset <code>0x19</code>: cell <em>n</em> − 1 of the second image of <code>window/icon.tpl</code></td></tr><tr><td>Capacity cost</td><td>Offset <code>0x1A</code></td></tr><tr><td>Trigger effect</td><td>Offset <code>0x14</code>: an <code>EID_</code> name</td></tr><tr><td>Displayed help text</td><td><code>system.cmp</code> → pack entry <code>mess/common.m</code>, using keys such as <code>Mess_Help_skill_Counter</code></td></tr><tr><td>Character-granted skills</td><td>Up to three <code>SID_</code> pointers in the character record</td></tr><tr><td>Class-granted skills</td><td>Up to five innate-skill pointers in the class record</td></tr><tr><td>Chapter-specific bonus skills</td><td><code>skill0</code>&ndash;<code>skill4</code> in a ${wl("dispo-format","deployment record")}</td></tr></tbody></table>
  <h2>How the game checks a skill</h2>
  <p>Native code passes the unit's runtime skill state and a raw table position to one shared bit-test function. If the bit is absent, the effect path stops. Chance-bearing skills then use the same random-number generator as hit and critical checks; guaranteed traits proceed without that roll. The caller determines <em>when</em> the check occurs: Vantage is checked while arranging exchange order, Cancel before a counterattack is scheduled, Sol after damage is known, and Steal while building the map-action menu.</p>
