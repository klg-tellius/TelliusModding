"disc-layout": {
  ns:"meta", title:"Disc & File Layout", dek:"What's actually inside the disc image, folder by folder",
  infobox:{ type:"Portal", status:"strong", fields:[
    ["Extracted root","<code>files/</code>"],["Folder count (top-level)","~20"],["Everything below","Confirmed by direct extraction"]
  ]},
  categories:["Portal","Structure"],
  body:`
  <p>Pulling the game's own filesystem off the disc produces one flat <code>files/</code> tree — the same shape for both the GameCube original and the Wii sequel's disc, since both extract through the same tool. Nothing under it is compressed at the filesystem level; individual files inside it use their own container formats (most commonly ${wl("lz10","LZ10")} compression wrapping a ${wl("pack-archive","pack archive")}).</p>
  <h2>How to navigate from path to mechanic</h2><p>Use the top-level folder to identify the asset family, peel off any compression and archive layers, then follow the payload article to the system that consumes it. The filesystem organizes resources; it does not itself define chapter, combat, or media behavior.</p>
  <h2>Example</h2><p><code>zmap/bmap01/map.cmp</code> means chapter-map family, LZ10 wrapper, pack archive, then <code>map.bin</code> plus models. <code>FE8Data.bin</code> sits directly under <code>files/</code> and needs no wrapper removal before its global tables are read.</p>
  <table><thead><tr><th>Path</th><th>What's there</th></tr></thead><tbody>
    <tr><td><code>Mess/</code></td><td>${wl("message-format","Chapter dialogue")} — one <code>cNN.m</code> file per chapter, plus a shared <code>common.m</code> for skill/menu help text</td></tr>
    <tr><td><code>Scripts/</code></td><td>${wl("event-script","Compiled event bytecode")} — one <code>CNN.cmb</code> per chapter</td></tr>
    <tr><td><code>zmap/bmapNN/</code></td><td>Per-chapter ${wl("map-format","terrain and placement data")} (<code>map.cmp</code>) and ${wl("dispo-format","unit deployment")} (<code>dispos.cmp</code>)</td></tr>
    <tr><td><code>shop/</code></td><td>${wl("shop-format","Per-difficulty shop inventories")} — armory, vendor, and forge stock for each chapter number</td></tr>
    <tr><td><code>ymu/&lt;class&gt;/</code></td><td>Per-class map model: ${wl("model-formats","skeleton, mesh, and animation clips")} — one folder per playable/enemy class</td></tr>
    <tr><td><code>zbg/&lt;name&gt;/</code></td><td>Battle scenery model sets (static 3D backdrops used in combat scenes)</td></tr>
    <tr><td><code>s/</code></td><td>Flat background images (${wl("tpl-texture","TPL")}) shown behind dialogue and menu scenes</td></tr>
    <tr><td><code>Face/</code></td><td>Character portraits (${wl("tpl-texture","TPL")}, LZ10-compressed), several variants per character</td></tr>
    <tr><td><code>illust/</code>, <code>ending/</code></td><td>Full-screen CG illustration art and ending-sequence art</td></tr>
    <tr><td><code>window/</code>, <code>etc/</code>, <code>gmap/</code></td><td>UI chrome, miscellaneous graphics, and the world-map screen's own art — plus <code>window/</code>'s <code>RectBases.bin</code>/<code>RectDesc.bin</code>/<code>RectUnitList.bin</code> UI-layout tables (${wl("labeled-section","Labeled Section Format")})</td></tr>
    <tr><td><code>zu/&lt;code&gt;/</code></td><td>Battle models: one uncompressed ${wl("model-formats","mesh, skeleton and animation")} pack per weapon type, plus texture variants. The <code>zu/</code> tables inside <code>zdbx.cmp</code> name their animations and textures and hold their tuning</td></tr>
    <tr><td><code>Sound/</code></td><td>${wl("stm-format","Music tracks")} (<code>.stm</code>), ${wl("gcfesnd","<code>gcfesnd.bin</code>")}, and ${wl("musyx","MusyX sample resources")}</td></tr>
    <tr><td><code>Movie/</code></td><td>${wl("thp-format","Cutscene video")} (<code>.thp</code>)</td></tr>
    <tr><td><code>Fonts/</code></td><td>${wl("font-format","The five bitmap fonts")} (<code>.gcf</code>, and the compressed <code>system.cms</code>)</td></tr>
    <tr><td><code>FE8Data.bin</code></td><td>${wl("fe8data","Characters, classes, items, and skills")} — one uncompressed file, no container layer</td></tr>
    <tr><td><code>FE8Anim.bin</code></td><td>${wl("fe8anim","The map-model registry")} tying each animation ID to its folder, weapon type, per-army textures and actions</td></tr>
    <tr><td><code>FE8Effect.bin</code></td><td>${wl("fe8effect","The visual-effect registry")} for spell and skill particle effects</td></tr>
    <tr><td><code>system.cmp</code></td><td>Loaded at boot: the common message text (skill and menu help) plus copies of <code>FE8Data.bin</code>, <code>FE8Anim.bin</code>, <code>FE8Effect.bin</code> and 13 other loose files. The game's file lookup searches loaded archives before the disc, so these copies are the ones it reads ${badge("strong","engine")}</td></tr>
    <tr><td>${wl("zdbx","<code>zdbx.cmp</code>")}</td><td>The battle engine's text tables: the class-to-model job list and hundreds of plain-text parameter files for class models, weapons, scenery, and camera scripts</td></tr>
    <tr><td>${wl("sound-room","<code>soundroom.bin</code>")}</td><td>The Sound Room's picture list: which full-screen illustrations it cycles through behind the track menu, and where each sits on screen</td></tr>
    <tr><td><code>tut_data.bin</code> / <code>tut_data_en.bin</code></td><td>The ${wl("tutorial-browser","tutorial/glossary browser")} and tutorial-popup system's per-chapter trigger and topic tables</td></tr>
    <tr><td><code>client.bin</code></td><td>Mostly high-entropy data with a couple of disc-identifier strings — not a moddable content file</td></tr>
  </tbody></table>
  <p>Two whole-game tables sit alongside these per-folder assets: ${wl("rect-format","<code>s/rect.bin</code>")}, the table of full-screen image resources, and ${wl("cp-data-format","<code>cp_data.bin</code>")}, the computer player's data (AI scripts, movement weights, heal thresholds, thief steal list), unrelated to character supports.</p>
  `
},

/* ------------------------------------------------------------------ NEW: MAPS SYSTEM */

"maps-system": {
  ns:"system", title:"Maps", dek:"How one chapter's battlefield is assembled from terrain, placed 3D scenery, and unit deployment",
  infobox:{ type:"Game system", status:"strong", fields:[
    ["Terrain & props","<code>map.cmp</code> → <code>map.bin</code>"],["Unit deployment","<code>dispos.cmp</code>, separate per difficulty"],
    ["Coordinate systems",`Two, related but distinct — see ${wl("map-grid","this page")}`]
  ]},
  categories:["Structure","Graphics"],
  body:`
  <p>A chapter's battlefield is built from two files that never touch each other directly but are laid out in the same physical space: ${wl("map-format","<code>map.cmp</code>")} describes the terrain and every piece of scenery placed on it, and ${wl("dispo-format","<code>dispos.cmp</code>")} describes which units are standing where when the chapter begins. Both live in the same <code>zmap/bmapNN/</code> folder, one per chapter (or per battle-map phase, for chapters with more than one).</p>
  <div class="callout"><p class="callout-t">Mental model: stage, tiles, and actors</p><p>The map archive builds the <strong>stage</strong>: geometry, props, elevation, light, fog, and invisible markers. Deployment places the <strong>actors</strong> on the tactical tile grid. Event scripting then changes that state over time. A unit at tile (8, 5) is not a 3D prop instance at object coordinates (8, 5); the two systems merely render into the same scene.</p></div>
  <h2>What's inside map.cmp</h2>
  <p>Decompressing <code>map.cmp</code> doesn't give terrain data directly — it gives a ${wl("pack-archive","pack archive")} bundling <code>map.bin</code> alongside that chapter's own 3D model files (terrain mesh, water plane, and any decorative props like trees or flower beds). <code>map.bin</code> itself is a set of named sections:</p>
  <ul>
    <li><strong>Capacity</strong> — the map's grid dimensions (<code>x_size</code>/<code>y_size</code>) and a handful of other structural counts.</li>
    <li><strong>Objects</strong> (<code>mapbuilddesc</code>) — one record per distinct placeable thing: the terrain itself, a water plane, decorative props, and invisible logic-only markers with no visual model at all. See ${wl("map-objects")}.</li>
    <li><strong>Instances</strong> (<code>mapbuildinst</code>) — one record per actual placement of an object into the world, with its own position and rotation. The same object can be placed more than once. See ${wl("map-objects")} and ${wl("map-grid")}.</li>
    <li><strong>Panels</strong> (<code>uniquepanel</code> / <code>uniquepanelBase</code> / <code>uniquepanelRoof</code>) — per-tile corner elevation data: ground+object together, ground alone, and building roofs separately, which is what lets a unit standing on a rooftop read as physically higher than one on the ground beneath it.</li>
    <li><strong>Lighting, fog, and ambient grid settings</strong> — single-record sections controlling the scene's overall look. A map's fog section, when present, stores whether fog is active, which rendering mode it uses, a screen-space offset, and an RGB tint; a map with no fog section simply leaves fog off.</li>
  </ul>
  <p>Two further systems build on this same map data: ${wl("terrain-texture-rendering")} explains how a terrain material's textures actually blend on screen, and ${wl("weather")} covers optional ambient weather effects layered over the scene.</p>
  <h2>What's inside dispos.cmp</h2>
  <p>A separate ${wl("pack-archive","pack archive")} holding four files: <code>dispos_c.bin</code>, whose groups appear on every difficulty, and <code>dispos_n/h/m.bin</code>, one of which the script picks by difficulty. Each is a list of named unit groups; a record names a character or generic enemy, their class, level, army, inventory, stat bonuses, spawn tile and the tile they walk to, and — for enemy units — their AI behavior for attacking, moving, and healing. See ${wl("dispo-format")} for the full field layout and ${wl("characters")}/${wl("classes")} for what those IDs resolve to.</p>
  <h2>Two coordinate systems, not one</h2>
  <p>Positioning something on a map turns out to mean two different things depending on what's being positioned. ${wl("map-objects","Placing a 3D object")} (the terrain mesh, a tree, a water plane) uses one transform; ${wl("map-grid","the tactical grid")} a player actually moves units on uses a different, simpler one that happens to share the same base tile size. Both are covered in full, with their confidence levels clearly separated, on ${wl("map-grid")}.</p>
  <h2>Worked example: placing a soldier beside a tree</h2>
  <p>The tree is defined once as a map object and placed by an instance record using the scenery transform. The soldier is defined by a deployment record using tactical tile coordinates. Their visual proximity is the result of both coordinate systems resolving into the same world; there is no pointer from the soldier to the tree. Movement and occupancy rules apply to the soldier's tile, while the tree's footprint and flags describe scenery.</p>
  <p style="color:var(--ink-muted);font-size:13px">The tactical camera itself rotates in fixed steps rather than spinning freely — each step is clamped to a set angle range and plays its own confirming sound cue, rather than exposing free continuous rotation.</p>
  `
},

/* ------------------------------------------------------------------ NEW: MAP OBJECTS & PLACEMENT */

"map-objects": {
  ns:"system", title:"Map Objects & Placement", dek:"What can be placed on a map, and the formula that puts it in the right spot",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Object record","<code>mapbuilddesc</code>"],["Placement record","<code>mapbuildinst</code>"],
    ["Transform","Native map-object placement formula"]
  ]},
  categories:["Graphics","Structure"],
  body:`
  <p>A map object is reusable scenery or an invisible marker; an instance is one placement of that object in the chapter's 3D world. Keeping definition and placement separate lets one model appear many times with different positions and rotations.</p>
  <h2>How definition and placement cooperate</h2><p>Read the object description to learn model, footprint, and flags, then read each instance that refers to it to obtain position, angle, and height. Rendering combines those values with the map's terrain anchor and scale.</p>
  <h2>Objects — what can be placed</h2>
  <p>Every distinct "thing" a chapter's map can contain is one <code>mapbuilddesc</code> record: a filename (or none, for an invisible marker), the model's bounding box (its minimum and maximum corners in world units — the second triple is the maximum corner, not a size), and a set of flag bits. Two of those flags are confirmed with zero exceptions across every real chapter map in the game:</p>
  <ul>
    <li><strong>Is this the map's own base terrain or water plane?</strong> — every object with this flag set is literally named after its own map (e.g. <code>bmap07</code>, <code>bmap07_water0</code>). A chapter typically has one or two of these.</li>
    <li><strong>Is this object animated?</strong> — when set, the map loader gives the object its <code>.ga</code> ${wl("model-formats","animation file")} and plays it like a unit's animation (a moving water plane, a flickering candle, a collapsing house). ${badge("confirmed","engine + files")}</li>
  </ul>
  <p>A third flag field is a 3-bit <strong>battle-goal type</strong>, carried by invisible, non-rendering marker objects rather than visible scenery — see ${wl("objectives")} for what those markers represent.</p>
  <h2>Instances — where they actually go</h2>
  <p>An object only appears in the world once something places it: a <code>mapbuildinst</code> record, giving a tile-grid position (<code>x</code>, <code>y</code>), a rotation angle, the rectangle of tiles the object covers once rotated, and a packed value that turns out to encode vertical position. A single object can have several instances — the same tree model planted a dozen times across a forest, for example.</p>
  <p>The game reads that rectangle only for roofs, houses, doors and rocks, on maps that switch the test on: a unit standing inside one is marked, most plausibly as being under the roof, and the game never picks such a tile when it looks for a free place to put a unit. ${badge("confirmed","engine")}</p>
  <p>For quarter turns the covered rectangle follows one rule: an object <em>w</em> tiles wide and <em>d</em> deep (its maximum corner divided by 5, rounded, at least 1) covers <em>w</em>&times;<em>d</em> tiles from its position at angle 0, and the rectangle swings around the placed tile for 90&deg;, 180&deg; and 270&deg;; the rule reproduces 95% of the game's own placements, the rest being mostly wave effects set at free angles. ${badge("strong","files")} Vanilla props sit at the terrain surface of their tile centre.</p>
  <p>New objects work like the game's own: a prop model added to a chapter's archive with its object record, then placed by new instance records, drew textured, rotated and standing on the ground in the Prologue. A prop does not change how its tiles play — the tiles' ${wl("fe8data","terrain types")} do. ${badge("confirmed","in game")}</p>
  <p>Every model of a chapter map — terrain, water and props — takes its images from one shared ${wl("tpl-texture","TPL")} file in the map archive, <code>texpack.tpl</code>, by image number. Every vanilla map uses each image of its file, and nothing else in the archive refers to the numbers: an image can be removed as long as every model's numbers are shifted with it, and the map draws unchanged. ${badge("confirmed","in game")}</p>
  <p>The native world-space placement formula is:</p>
  <p style="font-family:var(--mono, monospace); background:var(--surface-2); padding:10px 14px; border-radius:6px; font-size:12.5px;">world = Translate(position) · Scale(map_scale) · Translate(+pivot) · Rotate(angle) · Translate(−pivot)</p>
  <p>Two details make this less obvious than it looks. First, an object rotates around the <strong>center of its own 5-unit-wide tile cell</strong>, not around its raw placement origin — the pivot term above. Second, a placed object's terrain isn't rendered at the origin the way you'd expect: a terrain mesh's own raw geometry sits in a corner-anchored box starting at <code>(0, 0)</code>, while every other object's position is computed in a space centered on wherever the terrain's <em>own instance</em> says the terrain should sit. The fix is symmetric: every non-terrain object gets shifted by the exact negative of the terrain's own placement offset, compensating for the terrain being drawn unshifted. In every real chapter checked, this puts every ordinary prop inside the terrain's own physical footprint, with zero exceptions.</p>
  <p>This placement math is independent of, and should not be confused with, the tactical grid a player actually moves units on — see ${wl("map-grid")}.</p>
  `
},

/* ------------------------------------------------------------------ NEW: MAP GRID / COORDINATES */

"map-grid": {
  ns:"system", title:"Coordinate Systems & Grids", dek:"Scenery placement and unit movement use the same tile numbers, with different world formulas",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Shared constant","5.0 world units per tile"],["Placement grid","Confirmed"],["Tactical grid","Confirmed in game"]
  ]},
  categories:["Structure"],
  body:`
  <p>Scenery placement and the tactical grid number their tiles the same way — tile <code>(x, y)</code> of an object instance is tile <code>(x, y)</code> of the cursor, the deployment data and the map's per-tile height and terrain records — but they turn tile numbers into world positions with different formulas. In the Prologue, props placed at columns 4 and 6 appeared one and three tiles right of a unit standing at column 3. ${badge("confirmed","in game")}</p>
  <h2>How to choose the correct grid</h2>
  <p>If the subject is a unit, cursor, movement range, or deployment coordinate, use the tactical grid. If it is terrain, a tree, water, an invisible marker, or another model instance, use the placement transform. Convert to world coordinates only at the rendering boundary.</p>
  <h2>The placement grid (confirmed)</h2>
  <p>Used to position 3D scenery — see ${wl("map-objects")} for the full formula. Its origin is wherever the map's own terrain instance places the terrain, not <code>(0, 0)</code>; every other object's coordinates are relative to that anchor. Each tile is 5.0 world units, and an object rotates around the center of its own tile cell rather than its raw corner.</p>
  <h2>The tactical grid</h2>
  <p>This is the grid used by the player's cursor and units in battle. Its native tile-to-world conversion uses the same confirmed <code>5.0</code>-unit tile constant as scenery placement but applies a simpler formula:</p>
  <p style="font-family:var(--mono, monospace); background:var(--surface-2); padding:10px 14px; border-radius:6px; font-size:12.5px;">world = 5.0 × tile_index × map_scale</p>
  <p>No pivot and no rotation are applied to tactical tiles. For rendering on the raw terrain mesh, tile <code>0,0</code> is anchored to the terrain placement origin: in checked maps, <code>mapextra</code>'s first two bytes equal the negation of the base terrain instance's <code>x/y</code> placement. For example, Prologue stores terrain instance <code>(-22, -20)</code> and <code>mapextra</code> bytes <code>(22, 20)</code>, so tactical tile <code>(0,0)</code> draws at placement coordinate <code>(0,0)</code>, not at the raw mesh's own top-left corner.</p>
  <p>The full tactical data grid is <code>[0, x_size] × [0, y_size]</code> from <code>mapcapacity</code>. Its inner usable range is inset by <code>mapextra.grid_buffer</code>, below.</p>
  <h2>The inset margin</h2>
  <p>A separate, fully confirmed byte in the map's own extra-data section defines a playable-area margin around the tactical grid's edge: usable tiles run from that margin value up to <code>size − margin</code> on each axis, not from <code>0</code> to <code>size</code> outright — a real border of unplayable tiles around every map.</p>
  `
},

/* ------------------------------------------------------------------ NEW: TERRAIN TEXTURE RENDERING */

"terrain-texture-rendering": {
  ns:"system", title:"Terrain Texture Blending", dek:"Why a terrain material's extra textures need a runtime callback to ever appear at all",
  infobox:{ type:"Game system", status:"strong", fields:[
    ["Default path","One texture per material (modulated by light color)"],["Multi-texture path","Runtime callback, registered by material name"],
    ["Used by","Base terrain, walls, some props"]
  ]},
  categories:["Graphics","Structure"],
  body:`
  <p>A map's ${wl("map-format","terrain model")} can list several textures on one material, but listing them is not enough to make them all appear. Ordinary static rendering only ever binds the first texture on a material — anything beyond that requires the map system to register a callback for that specific material by name when its chapter loads, entirely separately from anything stored in the model file itself.</p>
  <h2>The default path: one texture, modulated</h2>
  <p>Without a callback, a material's draw is about as simple as GameCube-era rendering gets: bind the first listed texture, and multiply it by the vertex/light color. This is the standard "texture times lighting" look used across most props and scenery that don't need special treatment.</p>
  <h2>The callback path: blending two more textures in</h2>
  <p>For terrain that needs a richer surface — a road cutting across grass, for instance — the map system can attach up to two extra rendering steps to a named material at load time:</p>
  <ol>
    <li><strong>A dual-sample blend.</strong> The material's own first texture is sampled a second time, through the model's second UV set instead of its first, and the two samples are blended together by a grey mask: the image stored right after the first texture, laid over the map from above (see below). Black keeps the first sample, white the second — and the second shows whatever part of the image the second UV set points at there: on the Prologue the dirt path along its roads, the flower meadow and rocks elsewhere. This is how one texture image can represent two different surface looks (grass and dirt path, for instance) that blend smoothly instead of tiling as one flat image.</li>
    <li><strong>A final overlay multiply.</strong> Whatever the material's <em>last</em> listed texture is gets multiplied over the blended result, also laid over the map from above. For terrain, this is typically used as a soft light/shadow layer rather than a distinct visible surface.</li>
  </ol>
  <p>An optional third step can multiply in the moving cloud-shadow overlay described in ${wl("weather")}, when the chapter's weather calls for it.</p>
  <div class="callout"><p class="callout-t">Two textures can look like one, and one texture can look like several</p><p>Because the dual-sample step reuses the material's own first texture through a second UV set, a terrain material listing three texture slots doesn't necessarily mean three distinct images — it can mean one shared image sampled two different ways, plus one true overlay image.</p></div>
  <h2>Where the on-the-fly textures come from</h2>
  <p>Both images are stored in the map's texture file; what the game computes is where they fall. Their top-down texture coordinates come from a handful of per-map values — two panel-offset bytes, a half-width and half-height, and a projection-extent value, all in the map's extra-data section — combined with the base terrain's placement. For the mask the offsets cancel out: it always covers 640 × 640 units, 128 tiles at four pixels each, from the terrain's corner. On the Prologue the mask is a 512 × 512 greyscale image and the atlas a 512 × 1024 image whose top half the first UV set uses. ${badge("confirmed","engine + files")}</p>
  <h2>Worked example: one formula, four different maps</h2>
  <p>The same projection formula, fed each map's own panel-offset, half-size, and extent values, produces a differently-scaled but structurally identical pair of blend/overlay textures for each map — confirmed across four separate chapter terrains built from the same base formula, each with its own offset and scale numbers rather than a shared hardcoded projection.</p>
  <h2>Not every special material behavior is texture blending</h2>
  <p>The same per-material callback mechanism also covers effects that have nothing to do with adding textures. A placed object such as a moving water/wave prop can carry a shape flag that switches its blend mode from ordinary opaque drawing to an additive blend: under that mode, a texture's black pixels contribute nothing to the final image and effectively vanish, while its lighter pixels add brightness on top of whatever is already drawn beneath. This is how a wave texture with genuinely solid black regions in its own source image can still read on screen as translucent white foam rather than as a black rectangle.</p>
  <h2>Which materials get which step</h2>
  <p>The dual-sample blend is attached by name, to materials called <code>map_base</code> or <code>map_wall</code>; <code>map_water</code> gets its own multi-pass step. The final overlay multiply is attached without a name, to every material of the terrain models. So a terrain material with any other name still has its last listed texture multiplied over it: a Prologue terrain rebuilt with its own material name and an all-white last texture drew its first texture unchanged. ${badge("confirmed","engine + in game")}</p>
  <p style="color:var(--ink-muted);font-size:13px">Open: full pixel-for-pixel parity — exact texture filtering, draw ordering against other scene elements, and ambient/material color interaction — is not yet completely mapped. The blend structure and both projection formulas above are.</p>
  `
},

/* ------------------------------------------------------------------ NEW: WEATHER */

weather: {
  ns:"system", title:"Weather", dek:"One controller process per map, dispatching to a different child effect by weather id",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Trigger","The map's own stored weather id, re-checked on load"],
    ["Effects","Rain (2 intensities), snow/blizzard, sandstorm, moving water, a shared overlay"]
  ]},
  categories:["Graphics","Structure"],
  body:`
  <p>A chapter map can carry ambient weather, implemented as one small parent process that reads the map's stored weather id and starts whichever concrete effect that id maps to. Loading a map — including a mid-chapter map change — re-checks the id and swaps effects if it changed, rather than baking the choice in once at chapter start.</p>
  <h2>Dispatch table</h2>
  <table><thead><tr><th>Weather id</th><th>Effect</th></tr></thead><tbody>
    <tr><td>Rain (light)</td><td>Falling-rain particle effect at reduced intensity</td></tr>
    <tr><td>Rain (heavy)</td><td>The same rain effect at higher intensity</td></tr>
    <tr><td>Snow / blizzard</td><td>A separate snow/blizzard particle effect</td></tr>
    <tr><td>Sandstorm</td><td>A dedicated sandstorm effect</td></tr>
    <tr><td>Water / waves</td><td>A moving-water effect layered over the terrain</td></tr>
    <tr><td>Shared overlay</td><td>A moving cloud-shadow overlay, reused by two separate weather ids rather than each getting a dedicated effect of its own</td></tr>
  </tbody></table>
  <p>The rain effect's two intensities are the same underlying effect started with a different opacity value, not two different implementations — a general pattern for this system: distinct <em>ids</em> don't always imply distinct <em>effects</em>.</p>
  <h2>The sky in battle</h2>
  <p>The map's weather id also picks the sky of the battle scenes, from a list in ${wl("fe8data")}: clear sky, clouds, night, sunset, sandstorm or mountain sky. ${badge("confirmed","engine")}</p>
  <h2>Relationship to terrain rendering</h2>
  <p>The shared moving-overlay effect is the same visual resource as the optional third overlay step described in ${wl("terrain-texture-rendering")} — weather and terrain rendering share this one moving-cloud-shadow texture rather than each maintaining its own copy.</p>
  <h2>Example</h2>
  <p>A chapter flagged with the heavy-rain id starts the rain effect at its higher intensity automatically when its map loads; a save resumed mid-chapter on the same map performs the same check and reaches the same result, so the effect is a property of the map's stored data rather than a one-time scripted event.</p>
  `
},

/* ------------------------------------------------------------------ NEW: OBJECTIVES */

objectives: {
  ns:"system", title:"Objectives", dek:"How a chapter knows it's been won or lost",
  infobox:{ type:"Game system", status:"strong", fields:[
    ["Win/lose flags","<code>gf_complete</code> / <code>gf_gameover</code>"],["Set by",`${wl("events-scripting","Event script triggers")}`],["Goal markers","3-bit type field, invisible map objects"]
  ]},
  categories:["Structure"],
  body:`
  <p>Two layers combine to decide when a chapter ends and how: a pair of engine-level flags that actually end the chapter, and a per-chapter set of invisible marker objects that describe what condition the chapter is built around.</p>
  <h2>How an objective becomes completion</h2>
  <p>Map data describes objective-related locations or markers, gameplay changes unit and map state, script triggers test the relevant condition, and the successful event sets <code>gf_complete</code> or <code>gf_gameover</code>. The flag—not the marker or displayed objective text—is the final chapter-ending signal.</p>
  <h2>The flags that end a chapter</h2>
  <p>${wl("event-script","Event script")} functions can be one of two specific trigger types whose sole parameter resolves, with zero exceptions across every real script checked, to one of two literal engine flags: <code>gf_complete</code> (the chapter is won) and <code>gf_gameover</code> (the chapter is lost). Setting one of these is the actual mechanism that ends a chapter — everything else in a chapter's script exists to decide <em>when</em> to do that.</p>
  <h2>Battle-goal markers</h2>
  <p>Separately, a chapter's own ${wl("map-objects","map data")} can include invisible, non-rendering objects carrying a confirmed 3-bit "battle goal" type field. These markers are consistently named after their own condition — recognizable real objective types recur across dozens of chapters sharing the same bit pattern, with names like <code>defense_01</code>, <code>attainment_01</code>, <code>secession_01</code>, and <code>visit_01</code> turning up on markers using exactly that objective's own type value. This is a real, structurally confirmed 3-bit enum — not a guess from a single chapter's data — though the exact player-facing meaning of each of its 8 possible values isn't independently confirmed beyond what the marker's own name implies. ${badge("strong","strong evidence")}</p>
  <h2>Objective text</h2>
  <p>The goal and defeat lines shown to the player come from the chapter's record in ${wl("fe8data")}: four text slots (the goal, an unused slot, the defeat condition and a second goal line), with separate goal texts for Hard and Maniac where they differ — a longer turn limit, for instance. Easy uses the Normal texts. ${badge("confirmed","engine")}</p>
  <h2>Trial map grades</h2>
  <p>A trial map is graded A to E on three counts, each against four limits stored in its chapter record: the turns taken, the units lost, and the enemies killed. Each unit counts its kills on the current map (reset when it is deployed); the game sums them over the player's army, and more kills give a better grade. The final grade averages the three. ${badge("confirmed","engine")}</p>
  <h2>How they connect</h2>
  <p>A chapter's script is what actually reads the game state and fires <code>gf_complete</code>/<code>gf_gameover</code> — commonly gated by ${wl("events-scripting","turn/phase triggers")} (a defend-for-N-turns condition) or by a specific unit's state (a rout condition, checked per-enemy). The precise script-level check that reads a battle-goal marker's own state, connecting the marker to the flag it presumably drives, has not itself been isolated — the marker's role is inferred from its name and its consistent recurrence, not from tracing the exact code path that consumes it. ${badge("open","open")}</p>
  `
},

/* ------------------------------------------------------------------ NEW: EVENTS & SCRIPTING (system) */

"events-scripting": {
  ns:"system", title:"Events & Scripting", dek:"How a chapter's logic is actually structured — functions the engine calls reactively, not a linear script",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Unit","One function per trigger condition"],["Format article",`${wl("event-script","Event Script")}`],["Common calls","Fade, BGMPlay, MoviePlay, ChapterMoviePlay"],
    ["Runtime","Native stack-machine interpreter"]
  ]},
  categories:["Structure"],
  body:`
  <p>A chapter's ${wl("event-script","compiled script")} is not a single linear sequence — it's a set of independent functions, each one gated by its own <strong>trigger</strong>: a condition under which the engine calls that specific function. Nothing in the file itself calls these functions in order; the engine evaluates each function's trigger continuously and runs the function's body when it fires.</p>
  <div class="callout"><p class="callout-t">Mental model: trigger → function → engine call → changed game state</p><p>A trigger answers <em>when</em>. Its bytecode function answers <em>what sequence to perform</em>. Native engine calls perform operations outside the bytecode machine, such as starting music or a movie. The resulting flags, spawned units, dialogue, or chapter state can make later triggers eligible.</p></div>
  <h2>Kinds of trigger</h2>
  <p>Every function carries a trigger type plus a small number of parameters specific to that type. Several are confirmed by resolving a function's own parameters back through the script's own label pool:</p>
  <ul>
    <li><strong>Turn/phase</strong> — fires at the start of a specific turn number, on a specific phase (player or enemy). A "turn number" of 0 with no phase restriction fires on every turn.</li>
    <li><strong>Character-pair</strong> — fires on an interaction between two specific characters, referenced directly by their <code>PID_</code> character-ID label rather than a raw index.</li>
    <li><strong>A separate character-ID family</strong> — at least one trigger type resolves its character reference through an <code>MPID_</code>-prefixed label instead of the usual <code>PID_</code> family, seen nowhere else in this archive.</li>
    <li><strong>Zone/position</strong> — some trigger types resolve their parameter to an auto-generated debug name encoding the trigger's own map-zone coordinates, rather than a fixed label — evidence the trigger fires when a unit enters a specific map area.</li>
    <li><strong>Chapter start/end</strong> — the two trigger types covered on ${wl("objectives")}, whose parameter is always the literal flag <code>gf_complete</code> or <code>gf_gameover</code>.</li>
  </ul>
  <h2>externCall — reaching outside the script</h2>
  <p>A function's body is bytecode operating on the script's own local state, plus <code>externCall</code> — the mechanism for invoking engine-level functionality the script can't do on its own. Every real <code>externCall</code> target seen takes a name and a small number of arguments, resolved the same label-pool way as everything else:</p>
  <ul>
    <li><code>Fade</code> — a screen transition.</li>
    <li><code>BGMPlay("BGM_EVT_...")</code> — start a music track, by symbolic name (see ${wl("music-system")} for how that name resolves to a track).</li>
    <li><code>MoviePlay("Movie/....thp")</code> — play a cutscene, by literal file path (see ${wl("cutscenes")}).</li>
    <li><code>ChapterMoviePlay(N)</code> — play the current chapter's own opening cutscene, by chapter number.</li>
  </ul>
  <p>Labels throughout the scripting system follow informal but consistent prefix conventions that make an operand's role identifiable at a glance: <code>PID_</code>/<code>JID_</code> for characters and classes, <code>SID_</code> for skills, <code>IID_</code> for items, <code>gf_</code> for engine flags, <code>BGM_</code>/<code>SFX_</code> for audio cues.</p>
  <p>Naming an <code>externCall</code> target that doesn't exist isn't fatal — the engine silently pushes <code>0</code> and continues rather than crashing. ${badge("confirmed","confirmed")}</p>

  <h2>Flags</h2>
  <p>Scripts remember state through named on/off flags — a table of 96 shared by every script, some lasting one chapter and some the whole playthrough, all written into save files. See ${wl("event-flags")}.</p>

  <h2>Native handler registry</h2>
  <p><code>externCall</code> targets are registered by name at runtime. The core registration primitive stores a handler name, a native function pointer, and an argument count, then the bytecode interpreter resolves calls through that registry. Registration is spread across several hubs: general extern calls, unit and battle-map calls, event-arrow calls, map-scene calls, chapter-objective calls, and battle-map scene handlers.</p>
  <p>The engine registers <strong>406</strong> native functions this way into a table with room for 416, each with a fixed argument count, and every <code>externCall</code> in the 43 vanilla scripts passes exactly that many arguments. ${badge("confirmed","confirmed")} Named script functions join the same table when their script loads: <code>startup.cmb</code> contributes 89 helpers (<code>UnitCheckLiveByPID</code>, <code>MindGetItem</code>, <code>DisposSetMode</code>, …) that every chapter calls exactly like natives.</p>
  <p>Two names the vanilla scripts call are registered nowhere, so they always return 0: <code>NormalOnly</code> (so the Normal-only deployment branch of <code>startup.cmb</code>'s <code>DisposSetMode</code> family never runs) and <code>Easy</code> (one check in the Prologue, <code>Normal() || Easy()</code> — harmless, since <code>Normal</code> already answers true on Easy). ${badge("confirmed","confirmed")}</p>
  <p>Handler targets are identified by their registration names. Examples include <code>MapUpdate</code>, <code>DialogResult</code>, <code>BGMPlay</code>, <code>SFXPlay</code>, <code>MoviePlay</code>, <code>UnitAddItem</code>, <code>UnitClassChange</code>, <code>BMSetMoney</code>, <code>EventArrowAppend</code>, <code>DoorOpen</code>, <code>RoofOpen</code>, <code>UnitMovePos</code>, <code>Dispos</code>, <code>AchieveSet</code>, <code>PlayerDeadCheck</code>, <code>EnemyDeadCheck</code>, <code>PlayerEscapeCheck</code>, and <code>ShooterBulletCheck</code>. A handler name means "this native function is registered for that script-callable name"; it does not by itself fully decode every argument and side effect of the handler body.</p>

  <h2>Worked example: a turn-start scene</h2>
  <p>A function with a turn/phase trigger becomes eligible at the requested turn boundary. Its bytecode can fade the screen, invoke <code>BGMPlay</code> with a symbolic cue, request dialogue from the chapter's message data, and update a flag. A second function can use that flag or a later unit interaction as its own condition. The functions are related through game state, not because one follows the other physically in the file.</p>
  <h2>Do not confuse the three kinds of name</h2>
  <p>A function name identifies script code; a label such as <code>PID_IKE</code> identifies game data; an <code>externCall</code> target such as <code>BGMPlay</code> identifies native functionality. All are stored as strings, but the interpreter resolves them in different namespaces and uses them for different purposes.</p>

  <h2>Loaded scripts live in one global chain, not one per chapter</h2>
  <p>Every compiled script file the engine has currently loaded — the current chapter's, plus any shared/system-wide ones — sits as a node in one global linked list, not scoped to "whichever chapter is active." Loading a script appends it to the end of that list; each node also gets its own header fields relocated from stored file offsets into real addresses, and every one of its named functions is registered immediately into the same global name-lookup table <code>externCall</code>/<code>localCall</code> read from. A script can be put to sleep rather than freed — its functions are unregistered from that lookup table (so its names briefly stop resolving) while the module itself stays loaded in memory, and a separate call re-registers every sleeping script's functions again all at once. Only the most-recently-loaded script can ever be freed outright — there's no way to free an arbitrary one by name.</p>
  <p>Looking up an event by name searches the current script's own function list first, then — if not found there — falls through to the next script in the global chain. This is very likely the actual mechanism behind content that has to stay reachable no matter which chapter is currently active (a shared base/system dialogue pool, for instance): it's simply another script sitting in the same chain, not a special case. ${badge("confirmed","confirmed")}</p>

  <h2>Trigger dispatcher details</h2>
  <p>The native trigger dispatcher now lines up with the documented trigger table. Type 13 handles support-conversation events. Type 14 handles base conversations, including runnable-state checks, event counts, message-label lookup, star counts, and the info/seen flag used to suppress repeats. Type 5 handles unseen location/action events; type 8 handles talks; type 9 handles battle-start events; type 10/11 handle death events; type 15 handles unit selection; type 7 handles after-action events; type 4 handles zone entry; type 1/2 test goal flags; and type 3/6 handle phase events.</p>
  <p>The seen/flag set is used in two ways. For goal events, the dispatcher starts the chapter-complete or game-over event only after the relevant <code>gf_complete</code> or <code>gf_gameover</code> flag is already set. For talk, location, battle, and base-conversation style events, the same set suppresses events that have already fired.</p>
  <h2>Base conversation list</h2>
  <p>Base conversations are also surfaced through a real menu/list path. The base-conversation list screen scans runnable type-14 events, builds visible rows, draws the row name, seen-state marker, divider, and star count, then resolves the selected list node back to the event index and display name before opening a confirmation dialog or starting the selected event. The list UI is therefore not a static table of menu text; it is a view over runnable event records and their info flags.</p>

  <h2>A few confirmed interpreter quirks</h2>
  <ul>
    <li>An assignment instruction leaves its written value sitting on the evaluation stack afterward, rather than fully consuming it — ordinary compiler-generated "assignment as an expression" behavior.</li>
    <li>The bytecode's four conditional-branch instructions form two complementary pairs (branch-if-nonzero / branch-if-zero, each with a "keep the value on the stack" variant) — exactly the primitives a compiler needs for short-circuit <code>&amp;&amp;</code>/<code>||</code> as well as plain <code>if</code> branches. One of the four's own name doesn't match what it actually checks.</li>
    <li>A function can invoke a genuine native engine function directly, not just more script code — a function's own header marks which kind it is, and <code>externCall</code>/<code>localCall</code> reach either transparently through the same syntax.</li>
    <li>Every call — native or script — leaves exactly one value on the stack, and every function ends with an implicit <code>return 0</code>. A call used as a statement is followed by an explicit <code>pop</code>.</li>
    <li>A function's arguments occupy the first slots of its frame and its local variables the next ones; the interpreter zeroes the locals on entry.</li>
  </ul>

  <h2>Global variables</h2>
  <p>Besides its own locals, a script can use <strong>32 global words</strong>, numbered 0&ndash;31 and shared by every loaded script: slot 3 is the same word whichever chapter reads it. A script's header declares how many slots it needs (the highest slot it uses plus one); the engine keeps a running total, and a script that would push it past 32 is loaded without any of its functions being registered. ${badge("confirmed","confirmed")}</p>
  <p>The table is created once at power-on and never cleared: an unwritten slot holds leftover memory, not zero. It is not part of a save either, so a global is only dependable between a write and a later read in the same play session. The chapter scripts use globals exactly like that — a unit's death or selection stores tile coordinates that the following after-action event reads — and keep anything lasting in ${wl("event-flags","event flags")} instead. ${badge("confirmed","confirmed")}</p>
  `
},

/* ------------------------------------------------------------------ NEW: TUTORIAL BROWSER */

"event-flags": {
  ns:"system", title:"Event Flags", dek:"The 96 named on/off switches that let chapter scripts remember what has already happened",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Capacity","96 flags"],["Script calls","<code>regist</code>, <code>global</code>, <code>set</code>, <code>clr</code>, <code>get</code>"],
    ["Saved as","12 bytes in <code>BMST</code>"],["Related",`${wl("events-scripting")}, ${wl("save-format")}`]
  ]},
  categories:["Scripting","Save Data"],
  body:`
  <p>Chapter scripts have no general memory. When a script needs to know whether something has already happened — a village visited, a boss conversation seen, a character dead — it uses a <strong>flag</strong>: one named bit in a single table of 96 that the whole game shares.</p>
  <div class="callout"><p class="callout-t">The whole table</p><p>Each of the 96 slots holds a name, a hash of that name, and one bit. A script registers a name to claim a slot, then turns its bit on (<code>set</code>), off (<code>clr</code>) or reads it (<code>get</code>). A name that was never registered is simply ignored: <code>set</code> does nothing and <code>get</code> answers 0.</p></div>
  <h2>Two kinds of flag</h2>
  <p>Flags differ only in how they are registered. ${badge("confirmed","confirmed")}</p>
  <table><thead><tr><th></th><th>Global flags</th><th>Chapter flags</th></tr></thead><tbody>
    <tr><td>Registered by</td><td><code>global(name)</code>, once at power-on</td><td><code>regist(name)</code> in the chapter's <code>Startup</code></td></tr>
    <tr><td>Slots</td><td>From slot 0 upward</td><td>From slot 95 downward</td></tr>
    <tr><td>Lifetime</td><td>The whole playthrough</td><td>One chapter</td></tr>
    <tr><td>Examples</td><td>A character died, a recruitment condition, the Black Knight defeated</td><td>A chest opened, a boss conversation seen, a reinforcement wave triggered</td></tr>
  </tbody></table>
  <p>At power-on the engine registers eight flags of its own — <code>gf_canceled</code>, <code>gf_gameover</code>, <code>gf_complete</code>, three reserved ones, and <code>gf_triA</code>/<code>gf_triB</code>, which make each triangle-attack message appear only once — and then <code>startup.cmb</code> registers 22 story flags, filling slots 0–29.</p>
  <h2>What happens at a chapter start</h2>
  <ol>
    <li>Starting from slot 95, the engine erases names until it reaches an empty slot, removing the previous chapter's flags.</li>
    <li>Every slot without a name has its bit cleared. Global flags keep their names and therefore their values.</li>
    <li><code>gf_gameover</code> and <code>gf_complete</code> are turned off.</li>
    <li>The new chapter's <code>Startup</code> registers its flags from slot 95 downward, always in the same order. Vanilla chapters register up to 58.</li>
  </ol>
  <p>Because the erasure stops at the first empty slot, the table must never be completely full. If it were, the next chapter start would also erase every global flag.</p>
  <h2>Flags as one-time switches for events</h2>
  <p>Talk, battle and base-conversation events carry a label, and that label is a flag name. The engine skips the event while that flag is on; the event's own script turns it on after the conversation. A boss's pre-battle line therefore plays once even though the trigger condition is met at every encounter. ${badge("confirmed","confirmed")}</p>
  <h2>How flags are saved</h2>
  <p>Every save block stores the 96 bits as 12 bytes inside its ${wl("save-format","BMST")} chunk — bit <em>i</em> is byte <em>i</em> ÷ 8, bit <em>i</em> mod 8, least significant first. The names are not saved. Loading a save runs the same registrations again, so each slot gets back its name, and then restores the bits. A flag's identity in a save is therefore its slot number, which depends only on the order in which the scripts register their names. ${badge("confirmed","confirmed")}</p>
  <h2>The story flags</h2>
  <table><thead><tr><th>Slot</th><th>Name</th><th>Meaning</th></tr></thead><tbody>
    <tr><td>8–13</td><td><code>G_シノン死亡</code> … <code>G_リュシオン死亡</code></td><td>Shinon, Gatrie, Marcia, Lethe, Mordecai, Reyson died</td></tr>
    <tr><td>14</td><td><code>G_ＭＡＰ１２で漆黒とアイク戦闘</code></td><td>Ike fought the Black Knight on map 12</td></tr>
    <tr><td>15, 16</td><td><code>G_ヤナフ死亡</code>, <code>G_ウルキ死亡</code></td><td>Janaff, Ulki died</td></tr>
    <tr><td>17</td><td><code>G_情報３兄弟</code></td><td>Info conversation about three brothers</td></tr>
    <tr><td>18, 19, 22</td><td><code>G_リザーブド</code></td><td>Reserved, never used</td></tr>
    <tr><td>20</td><td><code>G_Map20の情報会話３</code></td><td>Map 20, third info conversation</td></tr>
    <tr><td>21</td><td><code>G_ティバーン死亡</code></td><td>Tibarn died</td></tr>
    <tr><td>23</td><td><code>G_Ｍａｐ４マーシャ会話</code></td><td>Map 4 Marcia conversation</td></tr>
    <tr><td>24</td><td><code>G_フォルカ仲間</code></td><td>Volke recruited</td></tr>
    <tr><td>25</td><td><code>G_Map31ネサラ使用</code></td><td>Naesala used on map 31</td></tr>
    <tr><td>26</td><td><code>G_ジル仲間条件</code></td><td>Jill's recruitment condition met</td></tr>
    <tr><td>27</td><td><code>G_漆黒の騎士倒した</code></td><td>Black Knight defeated</td></tr>
    <tr><td>28</td><td><code>G_クリミア忠臣イベント</code></td><td>Crimean retainers event</td></tr>
    <tr><td>29</td><td><code>DBG_最初からやってる</code></td><td>Development marker, "playing from the start"</td></tr>
  </tbody></table>
  <h2>Room for more</h2>
  <p>With 30 global flags, a chapter has 65 slots of its own before the table is full. The busiest chapter uses 58, so every vanilla chapter leaves at least 7 slots free. New chapter flags belong at the end of <code>Startup</code> so that older saves keep their slot meanings, and new story flags at the end of <code>startup.cmb</code>'s global list, each one taking a slot away from every chapter. ${badge("strong","strong")}</p>
  `
},

"tutorial-browser": {
  ns:"system", title:"Tutorial Browser", dek:"The grouped glossary/tutorial list backed by TUT_CHAPTER, TUT_CATEGORY, TUT_INITIAL, and TUT_DATA",
  infobox:{ type:"Game system", status:"strong", fields:[
    ["Data source","<code>tut_data.bin</code> / <code>tut_data_en.bin</code>"],["Record stride","24 bytes"],
    ["List focus","Groups or entries"],["Grouping modes","3"]
  ]},
  categories:["Structure","UI"],
  body:`
  <p>The tutorial browser is a grouped list interface for tutorial/glossary topics. It is initialized from four named sections: <code>TUT_CHAPTER</code>, <code>TUT_CATEGORY</code>, <code>TUT_INITIAL</code>, and <code>TUT_DATA</code>. The first three are label sections used by the browser; <code>TUT_DATA</code> begins with a count and then a table of 24-byte topic records.</p>
  <h2>Runtime browser state</h2>
  <table><thead><tr><th>Offset</th><th>Role</th></tr></thead><tbody>
    <tr><td><code>+0x30</code></td><td>Grouping mode, values 0/1/2</td></tr>
    <tr><td><code>+0x31</code></td><td>Focus: 0 for group list, 1 for entry list</td></tr>
    <tr><td><code>+0x32</code></td><td>Current group index</td></tr>
    <tr><td><code>+0x33</code></td><td>Current entry index</td></tr>
    <tr><td><code>+0x36/+0x38/+0x3A</code></td><td>Current scroll position, target, and step</td></tr>
    <tr><td><code>+0x44/+0x48/+0x4C</code></td><td>Pointers to chapter/category/initial label sections</td></tr>
    <tr><td><code>+0x50</code></td><td>Topic/list count</td></tr>
    <tr><td><code>+0x54/+0x58</code></td><td>List sentinel links; nodes use <code>+4</code> for next and <code>+8</code> for topic entry</td></tr>
    <tr><td><code>+0x5C/+0x60</code></td><td>Scrollbar and caption object pointers</td></tr>
  </tbody></table>
  <h2>Grouping behavior</h2>
  <p>The three grouping modes compare different bytes in each 24-byte tutorial record: mode 0 uses record byte <code>+2</code>, mode 1 uses <code>+1</code>, and mode 2 uses <code>+4</code>. The group counter counts runs of consecutive equal keys in the current sorted/listed order, not global distinct values across the whole table. Rebuild routines insert group-header records into the visible list.</p>
  <p>The exact mapping from the three grouping modes to the visible chapter/category/initial labels is still not fully closed. The initializer proves all three label sections are owned by this browser, but the renderer must be traced further before naming each mode with complete confidence.</p>
  <h2>Input and ownership</h2>
  <p>The tutorial-browser input handler dispatches differently depending on whether the group list or entry list has focus. In group-focus mode it updates the grouped-list cursor and shows the associated tutorial hint. In entry-focus mode it updates the entry cursor. This pins the grouped-list widget to the tutorial browser rather than to the inventory or shop systems.</p>
  `
},

biorhythm: {
  ns:"system", title:"Biorhythm", dek:"A fully-functioning cyclical stat mechanic that computes correctly on every stat check and has never once changed a stat's value",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Affects","Str, Mag, Def, Res"],["Cycle length","30 resolved battles, per unit"],
    ["Actual effect on any stat","None — see below"]
  ]},
  categories:["Balance"],
  body:`
  <p>Path of Radiance computes a genuine, correctly-cycling Biorhythm value — the wave-shaped stat fluctuation more commonly associated with this game's sequel and earlier series entries — every single time it evaluates one of four core stats. It has never once changed the value of any of them in the retail game.</p>
  <div class="callout"><p class="callout-t">Mental model: an active calculator connected to zero-valued inputs</p><p>The mechanic is not absent or skipped. Battles advance a phase, the phase selects a wave band, status effects can alter the band's strength, and stat getters consult the selected row. The final contribution is nevertheless zero because the getters read row positions whose value is zero in every band.</p></div>
  <h2>How the cycle works</h2>
  <p>Each unit carries its own phase counter, which increments by exactly 1 for <em>both</em> participants every time a battle is resolved — not once per turn. That counter is combined with a fixed per-unit cycle length of 30 and a small per-chapter offset (so units don't all start a chapter synced to the same point in the wave), fed through a real sine function, and bucketed into one of five bands along the wave: two "good" bands, a neutral middle band, and two "bad" bands. A unit's active status effects can double or halve the swing between bands.</p>
  <h2>What each band actually contains</h2>
  <p>Each band returns a fixed row of five values. Across every real band, the row is:</p>
  <table><thead><tr><th>Band</th><th>Row</th></tr></thead><tbody>
    <tr><td>Good (×2)</td><td><code>0, 0, +5, +5, 0</code></td></tr>
    <tr><td>Good</td><td><code>0, 0, +5, +5, 0</code></td></tr>
    <tr><td>Neutral</td><td><code>0, 0, 0, 0, 0</code></td></tr>
    <tr><td>Bad</td><td><code>0, 0, -5, -5, 0</code></td></tr>
    <tr><td>Bad (×2)</td><td><code>0, 0, -5, -5, 0</code></td></tr>
  </tbody></table>
  <p>Strength and Magic both read the row's first position; Defense and Resistance both read the row's second position. Skill and Speed never consult Biorhythm's table at all. The two positions that ever actually swing — the third and fourth — sit unread by every one of the four stats that do check Biorhythm.</p>
  <div class="callout brass">
    <p class="callout-t">Live, but silent</p>
    <p>The phase genuinely advances, the sine wave genuinely runs, the correct band genuinely gets selected and its whole five-value row genuinely gets copied out with any status-effect doubling/halving correctly applied to all five values — and then the one value each stat actually reads out of that row is always exactly zero, in every band, every time. ${badge("confirmed","confirmed")}</p>
  </div>
  <h2>Worked example</h2>
  <p>Suppose a unit reaches a “Good” band. The selected row is <code>0, 0, +5, +5, 0</code>. Strength and Magic both request position 0, receiving 0; Defense and Resistance request position 1, also receiving 0. The visible +5 entries are real data but are not read by those four stat calculations, while Skill and Speed do not query this table. The unit's displayed combat values therefore remain unchanged.</p>
  <h2>What remains separate</h2>
  <p>This page describes the runtime stat path. It does not establish whether unused row positions were intended for Hit, Avoid, or another abandoned consumer, and it should not be used to infer Radiant Dawn's implemented biorhythm behavior.</p>
  `
},

"developer-debug-tools": {
  ns:"system", title:"Developer & Debug Tools", dek:"A full set of internal testing menus and helpers, built into the shipped disc but never reachable through normal play",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Root menus retained","3, each a complete submenu tree"],["Reachable in normal play","No"],
    ["First menu's categories","6 (System, Game, Event, Visualize, Display, Sound)"],
    ["Comparable precedent",`See ${wl("biorhythm")} for another fully-functional, unused system`]
  ]},
  categories:["Structure"],
  body:`
  <p>The shipped disc's executable retains a substantial internal testing and debugging layer that ordinary play never reaches: three complete developer-menu trees, plus a scattering of standalone debug helpers wired into normal systems like the tactical map and the portrait renderer. None of this is corrupted or vestigial code — every piece described here is complete, functional, and would run correctly if invoked.</p>
  <h2>Three named root menus</h2>
  <p>Three separate top-level debug menus exist as complete, working menu trees, each built and registered when the game starts up rather than assembled on demand:</p>
  <table><thead><tr><th>Menu</th><th>Covers</th></tr></thead><tbody>
    <tr><td>First root menu</td><td>The largest of the three, covering six full categories — System, Game state, Event, Visualize, Display, and Sound testing — plus memory-card file operations. Fully mapped; see below.</td></tr>
    <tr><td>Second root menu</td><td>Base/storage and tutorial-system testing: filling the party's shared storage with a stock item, testing the base-visit flow and its pre-visit report screen, forcing a specific reinforcement group, unlocking every tutorial message in the game at once, and a small text-rendering test tool (see below)</td></tr>
    <tr><td>Third root menu</td><td>Dialog-system testing: standalone two-option and three-option dialog boxes, a location-name display test, a tutorial-dialog test, and a flag that force-enables every "extra" scenario flag at once</td></tr>
  </tbody></table>
  <h2>One shared list, viewed through different windows</h2>
  <p>The first menu's six categories are not six independent lists of entries. Underneath, a single flat list of menu records exists once; each category — and several sub-menus one level deeper, such as opening a specific unit's stat editor — simply points at a different starting position and length within that same list, the same way scrolling a long list to different starting points shows different but overlapping windows onto it. Two categories can genuinely show some of the exact same rows. This is confirmed directly: the row shown for "Game settings," for instance, does not lead to any settings of its own — it opens the same window that happens to also contain the entire System category underneath it.</p>
  <h2>The first menu's six categories</h2>
  <table><thead><tr><th>Category</th><th>Real content</th></tr></thead><tbody>
    <tr><td>System</td><td>A memory-usage report, an event/chapter turn-boundary log dump, a support-pair ("Bond") list dump, a full army-roster dump, a convoy-reset action, a tool that identifies whatever building sits under the debug cursor and opens a submenu for it, a toggle for the game's Random-vs-Fixed growth-mode setting, and a counter tied to a multiple-playthrough/postgame-content slot list</td></tr>
    <tr><td>Game</td><td>Live status readouts (chapter, turn count, gold, a separate "event points" counter, difficulty rank), a convoy-size readout, a building-status readout, and the entry point into the per-unit stat editor described below</td></tr>
    <tr><td>Event</td><td>A skill/flag browser that can grant or remove any of the game's skills and status flags on the selected unit; a two-axis tool that warps the selected unit to any tile by resolving the destination tile object directly; and an editor for a small per-unit flag array tied to event conditions</td></tr>
    <tr><td>Visualize</td><td>A paginated map-marker toggle tool, 16 markers per page, with a real page-index/page-count display — this is the one category confirmed to have its own genuine scrolling state rather than just reusing another category's window</td></tr>
    <tr><td>Display</td><td>Ten independent on/off overlay toggles for renderer debug views: a process-tree view, a performance readout, a 2D-primitive overlay, a GPU performance readout, an in-game debug-info overlay, a broadcast-safe-area guide frame, a sound-test overlay, a "battle off" toggle, a visualizer for scenes where skipping is disallowed, plus toggles for the camera implementation, a debug console overlay, and a guide-window overlay</td></tr>
  </tbody></table>
  <h2>A complete per-unit stat editor</h2>
  <p>Selecting a unit from the Game category opens a real, fully wired stat editor for that unit, reachable through several differently-labeled rows that all converge on the same tool: it directly reads and writes level (1&ndash;20), experience (0&ndash;99), transformation gauge, several other capped byte fields, and one unclamped field that changes every turn (see ${wl("biorhythm")}). A separate row computes each stat's remaining "growth doping" headroom by comparing the unit's current stat against a stored cap. Another row is a genuine support-rank editor, raising or lowering the stored rank between the selected unit and a chosen partner. A further, unlabeled row cycles a small per-unit state value through three settings — its exact effect (most likely a deployment or roster status) is not confirmed.</p>
  <h2>A working battle previewer</h2>
  <p>A separate development menu entry starts a full battle previewer: a self-contained process that can display attacker/defender/support combat roles, actions, outcomes, and skill/effect names outside of an actual battle sequence — evidently built as a tool for checking combat presentation without having to trigger a real battle.</p>
  <h2>Testing text width</h2>
  <p>The second root menu's small text-rendering test tool displays the same short sentence three times, each with one word drawn at a different width (<code>#X3A</code> squeezed, <code>#X46</code> stretched, and unchanged) — a test of the horizontal text scale described in ${wl("message-format","the dialogue format")}. Selecting any of the three rows only displays the sample text; none of them has any further effect.</p>
  <h2>Standalone debug helpers outside the menu system</h2>
  <p>Beyond the three menu trees, several debug-only helpers are wired directly into normal gameplay systems:</p>
  <ul>
    <li>A tactical-map debug input handler that can select units, center the camera, and mark/unmark enemies on demand — reading the same debug-input state the menus use, but hooked directly into the ordinary map-input loop rather than gated behind a menu.</li>
    <li>A parallel debug harness built into the portrait rendering system, capable of spawning and stepping through a portrait's fade, slide, and zoom animations independently of any actual dialogue scene calling for them.</li>
    <li>A function that dumps the complete contents of every ${wl("armies-allegiance","army list")} at once — every unit's slot, position, state, and name, grouped by army — clearly meant as a debugging aid for the allegiance system rather than anything a player would ever see.</li>
    <li>Script-level calls that can directly read or write a unit's fields and push/pop entire unit rosters, exposed the same way ordinary script commands are, but intended for test scripts rather than chapter content.</li>
  </ul>
  <h2>Why they stay hidden</h2>
  <p>Two separate, dormant switches keep the menus out of normal play, and neither is a missing piece of code. The map pause menu walks a zero-terminated list of root menus; the list holds the ordinary pause menu first and then a zero, so the walk stops before it reaches the four developer roots stored behind it. Moving the roots in front of the zero shows all of them. Separately, the start-up process that launches the game controller runs the production title screen, while a complete development title screen (build information, memory-card import and export, the battle previewer, chapter and difficulty selection, and a "Production version" entry that continues to the normal file menu) sits in the executable with nothing pointing at it. ${badge("confirmed","engine")}</p>
  <h2>Overlay switches</h2>
  <p>The Display category's overlays are plain flag bytes read by the main loop every frame: process tree, performance meter, GPU performance meter, in-game debug information, safe-frame guide, sound-test overlay, 2D-primitive overlay, battle-display off and skip-block visualisation. They start at zero and nothing but the menu sets them. ${badge("confirmed","engine")}</p>
  <p style="color:var(--ink-muted);font-size:13px">Open: none of the menu labels that read like they should show a real item, skill, weapon-rank, or status-condition list actually lead to one anywhere in this build — each stat is instead edited one field at a time through the shared editor above, and whether a separate list ever existed is unresolved. ${badge("open","open")} A handful of individual byte-sized unit fields, and the exact effect of the unlabeled per-unit state toggle mentioned above, are also unresolved.</p>
  `
},
