  <p>Twenty-two records carry a restriction list naming the classes or characters the skill belongs to: Sol the paladins, Valkyrie and Titania; Luna halberdiers and generals; Astra swordmasters; Lethality assassins; Deadeye snipers; Colossus warriors and berserkers; Stun falcon knights and dragonmasters; Roar beast laguz; Aether Ike's Hero classes; and single characters for the personal skills (Ulki, Janaff, Tanith, Sothe, Lehran). Fifty-one records carry three parameter bytes. <code>param0</code> is the icon: the Skills screen draws icon <em>n</em> from the <em>n</em>-th 32×32 cell of the skill icon sheet (see ${wl("graphics-system","Graphics & Images")}), and the nonzero values are exactly 1–46. A skill whose icon is 0 has none and never appears in the list of skills a unit can learn. <code>param1</code> is the capacity cost: the same screen prints it and greys the skill out when it exceeds the class's skill capacity minus what the unit's skills already use (Paragon 15, Counter 10, Nihil 5). <code>param2</code> is 1 on exactly the 42 skills a scroll teaches; the game never reads it. ${badge("confirmed","icon and capacity")}</p>
  <p>Twenty-three skills also name the visual effect played when they trigger: Sol plays <code>EID_SP_SUN</code>, Counter <code>EID_COUNTER</code>, Vantage <code>EID_MACHIBUSE</code> (“ambush”), and the triangle attack <code>EID_TRIATTACK</code>. ${badge("confirmed","confirmed")}</p>
  <h2>Special family — Chant</h2>
  <p>The eight records after base <code>SID_CHANT</code> correspond to HP, Strength, Magic, Skill, Speed, Luck, Defense, and Resistance. They are not granted directly and contain no separate stat field; their consecutive table positions encode the selected stat. See ${wl("skill-chant")}.</p>
  <div class="callout">
    <p class="callout-t">Skills with a mapped native effect</p>
    <p>These table positions have a corresponding effect in native combat code:</p>
    <table class="tight"><thead><tr><th>Skill</th><th>Real effect</th></tr></thead><tbody>
      <tr><td>${wl("skill-sol","Sol")}</td><td>Self-heal equal to the damage just dealt, applied at the very end of the damage pipeline</td></tr>
      <tr><td>${wl("skill-luna","Luna")}</td><td>Halves the target's effective Defense/Resistance directly inside the damage formula</td></tr>
      <tr><td>Astra</td><td>(effect not independently traced beyond the strike-count/damage pipeline it hooks into)</td></tr>
      <tr><td>${wl("skill-aether","Aether")}</td><td>Combines Sol's and Luna's effects in one activation</td></tr>
      <tr><td>${wl("skill-counter","Counter")}</td><td>Checked on the defending unit and can grant a bonus retaliation strike</td></tr>
      <tr><td>${wl("skill-corrosion","Corrosion")}</td><td>Reduces the target's equipped weapon durability</td></tr>
      <tr><td>${wl("skill-cancel","Cancel")}</td><td>Skips the defender's counter-attack step</td></tr>
      <tr><td>${wl("skill-miracle","Pray")}</td><td>On an otherwise lethal hit, reduces damage to a survivable amount</td></tr>
      <tr><td>${wl("skill-wing-guard","Wing Guard")}</td><td>Zeroes incoming damage on its confirmed block path</td></tr>
      <tr><td>${wl("skill-vantage","Vantage")}</td><td>Reverses the normal attacker-then-defender exchange order</td></tr>
      <tr><td>Wrath</td><td>(bit position confirmed; specific effect not independently traced)</td></tr>
      <tr><td>Snipe</td><td>(bit position confirmed; specific effect not independently traced)</td></tr>
    </table>
    <p style="margin-top:8px">Goddess's Blessing reaches the same full-damage-block result as Wing Guard without calling the percentage-roll function, making that protection guaranteed on its native path. ${badge("confirmed","confirmed")}</p>
  </div>
  <h2>Detailed skill articles</h2>
  <p>${wl("skill-sol")} · ${wl("skill-luna")} · ${wl("skill-aether")} · ${wl("skill-counter")} · ${wl("skill-corrosion")} · ${wl("skill-cancel")} · ${wl("skill-miracle")} · ${wl("skill-wing-guard")} · ${wl("skill-vantage")} · ${wl("skill-steal")} · ${wl("skill-chant")} · ${wl("skill-canto")}</p>
  <h2>Open questions</h2>
  <p>Several player-facing skills have known identities and parameters but no fully mapped native effect. Activation chances are documented per skill where known.</p>
  `
},

"skill-sol": {
  ns:"system", title:"Sol", dek:"How a successful strike becomes healing for its attacker",
  infobox:{ type:"Skill", status:"confirmed", fields:[["Internal ID","<code>SID_SUNTRICK</code>"],["Table index","47 (<code>0x2F</code>)"],["Parameters","<code>(9, 20, 1)</code>"]] }, categories:["Skills","Combat"],
  body:`
  <p>Sol is a combat skill that heals its user when an attack deals damage. The healing is based on the strike's final damage—not the attacker's displayed Attack, weapon might, or damage before defense.</p>
  <h2>Example</h2>
  <p>A unit has 14 of 30 HP. Its Sol strike deals 12 damage after Defense, effectiveness, critical, and other modifiers have been resolved. Sol attempts to restore 12 HP, leaving the unit at 26 HP. If the unit had started at 25 HP, the same strike would stop at the 30-HP maximum.</p>
  <div class="callout"><p class="callout-t">Zero damage means zero healing</p><p>Because healing follows damage actually dealt, a strike reduced to zero does not produce healing from the attack's earlier raw power.</p></div>
  <h2>When Sol is checked</h2>
  <ol><li>The combat exchange creates a strike for the attacker.</li><li>The attacker must own Sol in runtime skill state.</li><li>The chance-bearing skill path performs its activation test.</li><li>The normal hit and damage pipeline determines how much HP the target loses.</li><li>At the end of the damage path, that final loss becomes healing for the attacker, capped by maximum HP.</li></ol>
  <h2>How the game represents Sol</h2>
  <table><thead><tr><th>Part</th><th>Representation</th></tr></thead><tbody><tr><td>Definition</td><td>${wl("fe8data","FE8Data.bin")} skill record 47, restricted to the paladins, Valkyrie and Titania and taught by the Occult scroll</td></tr><tr><td>Internal identity</td><td><code>SID_SUNTRICK</code> (“Sun”)</td></tr><tr><td>Runtime ownership</td><td>Skill bit 47 in the combatant's consolidated skill state</td></tr><tr><td>Parameters</td><td>Icon 9, capacity cost 20 (<code>param2=1</code>: taught by a scroll)</td></tr><tr><td>Name/help keys</td><td>The skill record points to message keys resolved in <code>system.cmp/mess/common.m</code></td></tr><tr><td>Icon</td><td>Skill icon 9: the ninth 32×32 cell of <code>window/icon.tpl</code>'s skill sheet</td></tr><tr><td>Trigger effect</td><td><code>EID_SP_SUN</code></td></tr></tbody></table>
  <h2>Relationships and edge cases</h2>
  <p>${wl("skill-aether","Aether")} reuses Sol's healing behavior while also applying ${wl("skill-luna","Luna")}'s defensive reduction. Sol does not itself create an extra strike, guarantee a hit, or change attack order; those decisions belong to the wider ${wl("combat-mechanics","combat pipeline")}.</p>
  <h2>Open questions</h2>
  <p>The stored 20 is Sol's capacity cost, not its chance. How the game computes Sol's activation chance (and any Skill-stat contribution) has not been documented completely.</p>
  `
},

"skill-luna": {
  ns:"system", title:"Luna", dek:"A chance-based combat skill that halves the target's effective defense",
  infobox:{ type:"Skill", status:"confirmed", fields:[["Internal ID","<code>SID_MOONTRICK</code>"],["Table index","48 (<code>0x30</code>)"],["Parameters","<code>(10, 20, 1)</code>"]] }, categories:["Skills","Combat"],
  body:`<p>Luna is a chance-based offensive skill that weakens the defensive value used for one attack. It changes an input to the damage formula rather than multiplying the finished damage.</p><h2>How it works</h2><p>The attacker must own Luna in consolidated runtime skill state. The shared proc mechanism tests its activation; on success, physical damage uses half the target's effective Defense and magical damage uses half effective Resistance before subtraction from Attack.</p><h2>Example</h2><p>Against 16 effective Defense, an attack value of 24 normally produces 8 damage. Luna changes the defensive term to 8, producing 16 damage before any later caps or strike effects. It does not simply double the original 8 damage—even though this particular example reaches the same number.</p><h2>Definition and ownership</h2><p>Luna is <code>SID_MOONTRICK</code>, table index 48, with parameters <code>(10, 20, 1)</code>. Its restriction list names the Halberdier classes and the General. See ${wl("skills")} for how definitions become personal, class, or deployment-granted runtime skills.</p><h2>Relationships and limits</h2><p>${wl("skill-aether","Aether")} combines Luna's defense treatment with ${wl("skill-sol","Sol")} healing. Its stored 20 is its capacity cost; how its activation chance is computed remains open.</p>`
},

"skill-aether": {
  ns:"system", title:"Aether", dek:"A combined activation that applies the game's Sol and Luna behaviors",
  infobox:{ type:"Skill", status:"strong", fields:[["Internal ID","<code>SID_SUNMOON</code>"],["Table index","76 (<code>0x4C</code>)"],["Name structure","Sun + Moon"]] }, categories:["Skills","Combat"],
  body:`<p>Aether is a combined combat skill: its mechanical identity is the union of ${wl("skill-luna","Luna's")} defensive reduction and ${wl("skill-sol","Sol's")} healing from damage dealt.</p><h2>Mental model</h2><p>Treat Aether as an orchestrator of two existing effects, not as an unrelated formula that happens to resemble them. Luna changes the defensive input used for damage; Sol receives the resulting final HP loss and restores that amount to the attacker, capped by maximum HP.</p><h2>Example</h2><p>An attacker at 10/30 HP has 24 Attack against 16 Defense. The Luna portion reduces the defensive term to 8, allowing 16 damage. If that damage is actually dealt, the Sol portion restores 16 HP and leaves the attacker at 26/30. A miss or zero-damage result cannot supply healing.</p><h2>Definition and presentation</h2><p>The internal ID is <code>SID_SUNMOON</code> at table index 76; the name literally joins the internal Sun and Moon names. Its restriction list names Ike's two Hero classes, <code>JID_HERO</code> and <code>JID_HERO_G</code>. The multiple-blow visual presentation belongs to ${wl("combat-animation")}; animation should not be mistaken for the authoritative effect calculation.</p><h2>Open questions</h2><p>The exact activation-chance derivation and every animation-state transition are not fully mapped.</p>`
},

"skill-counter": {
  ns:"system", title:"Counter", dek:"A defender-side proc that can add a retaliation strike",
  infobox:{ type:"Skill", status:"confirmed", fields:[["Internal ID","<code>SID_COUNTER</code>"],["Table index","55 (<code>0x37</code>)"],["Parameters","<code>(20, 10, 1)</code>"]] }, categories:["Skills","Combat"],
  body:`<p>Counter is a defender-side proc that can schedule an additional retaliation strike. It is neither the ordinary weapon-range counterattack nor a Speed-based follow-up.</p><h2>How it enters combat</h2><p>The defender must own Counter in runtime skill state. If its chance test succeeds and the attacker lacks the dedicated immunity flag, the exchange builder inserts another defender strike. Once inserted, that strike uses ordinary Hit, Critical, damage, effectiveness, and durability rules.</p><h2>Example</h2><p>If an attacker initiates at valid counter range, the defender may already receive the normal counterattack. Counter can add a separate retaliation on top of that schedule; it does not merely make the normal counter more accurate or powerful.</p><h2>Definition and text</h2><p>Counter is <code>SID_COUNTER</code>, index 55, parameters <code>(20, 10, 1)</code>. Its name and tooltip keys resolve through <code>system.cmp/mess/common.m</code>. The exact probability formula remains open; see ${wl("skills")}.</p>`
},

"skill-corrosion": {
  ns:"system", title:"Corrosion", dek:"A combat proc that damages the opponent's equipped weapon",
  infobox:{ type:"Skill", status:"confirmed", fields:[["Internal ID","<code>SID_WEAPONDESTROY</code>"],["Table index","52 (<code>0x34</code>)"],["Parameters","<code>(16, 10, 1)</code>"]] }, categories:["Skills","Combat","Weapons"],
  body:`<p>Corrosion attacks equipment durability instead of directly changing the target's HP. On activation it damages the opponent's currently equipped weapon in addition to the weapon's ordinary use consumption.</p><h2>Lifecycle of the effect</h2><p>The attacker owns Corrosion, combat resolves its proc, the effect locates the defender's runtime equipped-item instance, and that instance loses uses. The global ${wl("items-weapons","item definition")} supplies the weapon type and maximum-use context, while the inventory instance supplies the current durability that can actually change.</p><h2>Example</h2><p>A defender carrying a 30-use weapon at 12 uses can lose extra uses to Corrosion even though that defender did not initiate an attack. This loss is separate from any one-use cost charged when the weapon itself strikes.</p><h2>Definition and limits</h2><p>Corrosion is <code>SID_WEAPONDESTROY</code>, index 52, parameters <code>(16, 10, 1)</code>, taught by its own scroll and carrying no restriction list. The existence, target, and durability mutation are confirmed; the exact amount formula is not yet completely documented.</p>`
},

"skill-cancel": {
  ns:"system", title:"Cancel", dek:"A combat proc that prevents the defender's counterattack",
  infobox:{ type:"Skill", status:"confirmed", fields:[["Internal ID","<code>SID_DEFENCE</code>"],["Table index","44 (<code>0x2C</code>)"],["Parameters","<code>(4, 10, 1)</code>"]] }, categories:["Skills","Combat"],
  body:`<p>Cancel is an attacker-side proc that removes the defender's ordinary counterattack from the combat schedule. It prevents a strike from being created; it does not block damage from a strike that already exists.</p><h2>Example</h2><p>An attacker engages an enemy at a range where both weapons can respond. Normally the schedule begins attacker strike, then defender counter. If Cancel activates, the counter step is skipped. Speed follow-ups and other independently added strikes still follow their own rules.</p><h2>Where it acts</h2><p>The skill check occurs while ${wl("combat-mechanics","the exchange builder")} is deciding order and quantity, before Hit, Critical, and damage are rolled for the removed counter.</p><h2>Definition and limits</h2><p>Cancel is <code>SID_DEFENCE</code>, index 44, parameters <code>(4, 10, 1)</code>. The scheduling effect is confirmed; the exact stored-parameter-to-probability formula remains open.</p>`
},

"skill-miracle": {
  ns:"system", title:"Miracle / Pray", dek:"A lethal-hit safeguard represented internally as SID_PRAY",
  infobox:{ type:"Skill", status:"confirmed", fields:[["Internal ID","<code>SID_PRAY</code>"],["Table index","46 (<code>0x2E</code>)"],["Parameters","<code>(5, 5, 1)</code>"]] }, categories:["Skills","Combat"],
  body:`<p>Miracle is a lethal-hit safeguard. It is consulted only when an incoming strike would otherwise reduce the defender to zero HP; successful activation changes that result so the defender survives.</p><h2>Example</h2><p>A unit at 7 HP is about to take 12 damage. Without Miracle it reaches zero. If Miracle activates, the lethal result is reduced to a surviving result. A 5-damage hit against the same unit is nonlethal and follows ordinary damage handling without needing Miracle.</p><h2>Do not confuse survival with immunity</h2><p>${wl("skill-wing-guard","Wing Guard")} replaces incoming damage with zero. Miracle instead guards the lethal boundary, so it should not be modeled as universal damage negation.</p><h2>Definition and limits</h2><p>The internal record is <code>SID_PRAY</code>, index 46, parameters <code>(5, 5, 1)</code>, taught by its own scroll and carrying no restriction list. The exact surviving-HP result and final probability formula require further mapping.</p>`
},

"skill-wing-guard": {
  ns:"system", title:"Wing Guard", dek:"A defensive skill whose block path nullifies incoming damage",
  infobox:{ type:"Skill", status:"confirmed", fields:[["Internal ID","<code>SID_WINGSHIELD</code>"],["Table index","45 (<code>0x2D</code>)"],["Parameters","<code>(38, 20, 1)</code>"]] }, categories:["Skills","Combat"],
  body:`<p>Wing Guard is a defensive proc whose successful block replaces an incoming strike's damage with zero. It changes the strike result after the attack exists rather than removing the strike from the schedule.</p><h2>Example</h2><p>If a strike would deal 18 damage and Wing Guard blocks it, the HP loss becomes zero. Hit and attack presentation can still occur; the protected result is the damage value.</p><h2>Related protections</h2><p>${wl("skill-miracle","Miracle")} applies only at the lethal boundary and preserves survival rather than guaranteeing zero damage. <code>SID_GODDESSBLESS</code> reaches an equivalent full-block path without the ordinary percentage-roll call, making it the guaranteed form of this protection.</p><h2>Definition and limits</h2><p>Wing Guard is <code>SID_WINGSHIELD</code>, index 45, parameters <code>(38, 20, 1)</code>, restricted to the hawk laguz classes. Its zero-damage path is confirmed; its exact activation probability is not.</p>`
},

"skill-vantage": {
  ns:"system", title:"Vantage", dek:"A combat-order skill that lets the defender act before the initiator",
  infobox:{ type:"Skill", status:"confirmed", fields:[["Internal ID","<code>SID_AMBUSH</code>"],["Table index","41 (<code>0x29</code>)"],["Parameters","<code>(1, 10, 1)</code>"]] }, categories:["Skills","Combat"],
  body:`<p>Vantage changes who strikes first when its owner is attacked. It reverses the opening order; it does not grant an extra strike by itself.</p><h2>Example</h2><p>Unit A initiates combat against Unit B, who owns Vantage. The ordinary opening order would be A then B. Vantage can make B's response resolve before A's initiating strike. If B defeats A, the later strike may never occur because combat state is re-evaluated after the first result.</p><h2>What remains unchanged</h2><p>After order is selected, Speed follow-ups, Brave strikes, skill-added strikes, Hit, Critical, and damage use their normal ${wl("combat-mechanics","combat-resolution")} rules.</p><h2>Definition and limits</h2><p>Vantage is <code>SID_AMBUSH</code>, index 41, parameters <code>(1, 10, 1)</code>. The ordering effect is confirmed; the complete activation-condition formula is not.</p>`
},

"skill-steal": {
  ns:"system", title:"Steal", dek:"A map-action skill that exposes eligible enemy inventory items as targets",
  infobox:{ type:"Skill", status:"confirmed", fields:[["Internal ID","<code>SID_STEAL</code>"],["Table index","60 (<code>0x3C</code>)"],["Parameters","<code>(35, 0, 0)</code>"]] }, categories:["Skills","Map Actions","Items"],
  body:`<p>Steal is a map command that exposes eligible items in a nearby enemy's inventory. It is selected before combat and therefore belongs to the ${wl("map-actions","map-action system")}, not the combat-proc pipeline.</p><h2>Availability flow</h2><p>The acting unit must own <code>SID_STEAL</code>. The checker scans nearby enemies, examines as many as eight runtime item slots per unit, and tests each item against the stealability table. At least one legal unit/item pair must exist before the menu can register Steal.</p><h2>Example</h2><p>If an adjacent enemy carries three items but only its Vulnerary passes the stealability rule, the action is available with that item as a candidate. An empty inventory or only prohibited items produces no legal Steal target.</p><h2>Shared inventory machinery</h2><p>Taking an item from an ally uses the same underlying target search. Steal broadens the eligible allegiance to enemies and adds stealing restrictions. The definition is table index 60 with parameters <code>(35, 0, 0)</code>.</p>`
},

"skill-chant": {
  ns:"system", title:"Chant", dek:"A nearby-ally command backed by one base skill and eight stat variants",
  infobox:{ type:"Skill family", status:"strong", fields:[["Base ID","<code>SID_CHANT</code> (index 24)"],["Variants","Indices 25–32"],["Base parameters","<code>(13, 20, 1)</code>"]] }, categories:["Skills","Map Actions"],
  body:`<p>Chant is a nearby-ally map command represented by one learnable base skill and eight internal stat variants. Ownership answers whether a unit can Chant; table position identifies which stat-specific effect is being evaluated.</p><h2>Family structure</h2><p><code>SID_CHANT</code> is index 24. Indices 25–32, <code>SID_CHANTHP</code> through <code>SID_CHANTMDEF</code>, correspond to HP, Strength, Magic, Skill, Speed, Luck, Defense, and Resistance—the standard eight-stat order. The variants omit normal help text and parameters because they are implementation members of the family, not independently learned skills.</p><h2>Example</h2><p>A unit owns base Chant and stands near several allies. The action checker pairs compatible stat variants with each nearby target, scores the legal combinations, and registers the highest-priority target/effect. The player-facing command therefore arises from a search over internal variants rather than a direct reference to one variant record.</p><h2>Definition and limits</h2><p>The base parameters are <code>(13, 20, 1)</code>. Character and class records grant the base skill, not the variants. The exact scoring formula and the full mapping from each variant to its applied runtime modifier remain provisional.</p>`
},

"skill-canto": {
  ns:"system", title:"Canto", dek:"A mounted-unit trait that preserves a second movement opportunity after acting",
  infobox:{ type:"Skill / trait", status:"strong", fields:[["Internal ID","<code>SID_TWICE</code>"],["Table index","3"],["Parameters","None"]] }, categories:["Skills","Movement","Map Actions"],
  body:`<p>Canto preserves a second movement opportunity after an eligible mounted unit acts. It is a persistent capability flag, not a percentage-based combat proc.</p><h2>Action lifecycle</h2><p>The unit spends part of its movement, performs an action, and—when Canto is present—returns to movement state with only the remaining allowance. The second route still obeys map bounds, terrain cost, passability, and occupancy.</p><h2>Example</h2><p>A mounted unit with 8 movement spends 5 tiles reaching an enemy and attacks. If the action leaves 3 movement available, Canto can permit up to 3 further movement-cost units; it does not refill the unit to 8 or create another attack action.</p><h2>Definition and limits</h2><p>Canto is represented by <code>SID_TWICE</code> at table index 3 and has no proc parameters. The capability interpretation is strong; the exact map-state transition and every action that preserves or consumes Canto remain to be enumerated.</p>`
},

/* ------------------------------------------------------------------ NEW: ARMIES & ALLEGIANCE */

"armies-allegiance": {
  ns:"system", title:"Armies & Allegiance", dek:"Which side a unit is on isn't a stored label — it's which of eight runtime lists that unit currently belongs to",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Active armies","4 (player, enemy, ally, other)"],["Non-normal states","4 (free pool, reserve, inactive, hidden)"],
    ["Membership test","List identity, not a stored enum"]
  ]},
  categories:["Structure","Combat"],
  body:`
  <p>Every unit slot in the game belongs, at any moment, to exactly one of eight runtime lists. Which list a unit is in is not a side-effect of some other stored value — it <em>is</em> the unit's current allegiance. Moving a unit to a different army means physically relinking it into a different list, not flipping a byte read elsewhere.</p>
  <h2>The four armies a player actually sees</h2>
  <table><thead><tr><th>List</th><th>Meaning</th></tr></thead><tbody>
    <tr><td>Player</td><td>The deployed, player-controlled roster</td></tr>
    <tr><td>Enemy</td><td>Ordinary hostile units</td></tr>
    <tr><td>Ally / orderable</td><td>Shown in a distinct color, and directly commandable through Ike's Order action rather than acting on its own initiative</td></tr>
    <tr><td>Other</td><td>A fourth army — neither player, enemy, nor orderable ally — used for green-flagged neutral or story-scripted units</td></tr>
  </tbody></table>
  <h2>Four more states that aren't "armies" at all</h2>
  <p>Four further list ids exist purely as bookkeeping states rather than battlefield sides: a shared pool holding every currently-unused unit slot, the player's reserve/deployment-select pool before a chapter starts, an inactive/flagged state, and a further hidden/removed state. A unit sitting in one of these is not on the map as any army — it is waiting, benched, or cleared.</p>
  <div class="callout"><p class="callout-t">Mental model: allegiance is where you're linked in, not what you're labeled</p><p>Asking "what army is this unit" is really asking "which list is this unit's node currently part of." Recruiting an enemy into the player's army, or benching a player unit to the reserve pool, is the same underlying operation either way: unlink from the old list, link into the new one.</p></div>
  <h2>Comparing two units' allegiance</h2>
  <p>Combat and AI reduce a pair of lists to one of three relation outcomes rather than comparing raw list identities for every decision: <em>same side</em> (identical list), <em>opposing</em> (either side is the enemy list), or <em>other</em> (any other differing pair, such as ally vs. green). This third case is what lets an orderable ally and a neutral green unit coexist without either automatically reading as the other's enemy.</p>
  <h2>Example — recruiting a unit into the player's army</h2>
  <p>A story event that recruits a unit performs one operation: move that unit's slot from its current list into the player list. Nothing about the unit's stats, inventory, or position changes — only which of the eight lists it's linked into, which is also what the map immediately uses to redraw its color and to decide who controls its turn.</p>
  <h2>Named armies within a side</h2>
  <p>On top of its side, every unit carries an <strong>army name</strong>: one of 30 entries such as Crimean Army, Daein Army, Bandits, Pirates or Greil Mercenaries, listed in ${wl("fe8data")}. A unit gets it from the ${wl("dispo-format","deployment group")} that places it, and a script can change it. The side decides who fights whom; the army name is what the map's army list groups units under. Each army can have a <strong>commander</strong>, the unit its deployment record marks as such (Ike on the player side, each chapter's boss on the enemy side). A commander with Charisma lifts nearby units of its own army. When a script moves a unit to another side, the unit also takes that side's army name.</p>
  <p style="color:var(--ink-muted);font-size:13px">A closely related but distinct per-unit tag marks finer control nuances — precisely which ostensibly same-side units the player can actually issue orders to — and is not yet fully mapped.</p>
  `
},

/* ------------------------------------------------------------------ NEW: LAGUZ TRANSFORMATION */

"laguz-transformation": {
  ns:"system", title:"Laguz Transformation", dek:"A hidden 0–20 gauge that charges in human form and drains in beast form, not a simple timer",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Gauge range","0–20"],["Gain per step (untransformed)","+2"],["Drain per step (transformed)","−1"],["Gain when damaged (untransformed)","+4"],["Change when damaged (transformed)","−3"]
  ]},
  categories:["Balance","Combat"],
  body:`
  <p>Laguz units carry a hidden stat alongside their normal battle stats: a transformation gauge. It behaves like a resource meter rather than a toggle or a countdown — it climbs while the unit is untransformed and drains while transformed, and either end of its range is a meaningful boundary rather than a fixed timer length.</p>
  <h2>Starting value</h2>
  <p>A unit's gauge on deployment comes from its character record: 16 for Giffca, Lethe, Tibarn, Janaff and Naesala, 10 for Ranulf, 5 for Mordecai, Ena, Nasir and Ulki, 0 for everyone else. A class with the always-transformed trait starts at the full 20 instead, and ${wl("dispo-format","deployment records")} carry a starting-gauge field of their own. ${badge("confirmed","engine")}</p>
  <h2>The gauge step</h2>
  <p>While untransformed, an eligible unit gains 2 points per step. While transformed, the same unit instead loses 1 point per step. The step runs from the map's action flow, once for the acting unit and once for its target when the action ends, and seen in game after each combat involving a laguz; when it crosses a boundary, the transformation (or reversion) animation plays. The gauge is clamped to its 0–20 range in both directions — a unit at 0 cannot drain further, and one at 20 cannot gain further, which is also the signal used elsewhere to mean "fully charged" or "exhausted."</p>
  <div class="callout"><p class="callout-t">Asymmetric by design</p><p>Draining costs a third of what gaining takes to replace — 10 steps to fully charge from empty, versus 20 steps to fully drain. Transformation is the expensive, temporary state; walking around human is the default.</p></div>
  <h2>When the unit is damaged</h2>
  <p>Taking damage also moves the gauge, through a second routine run by the damage event: an untransformed Laguz gains 4 points, a transformed one loses 3, again clamped to 0–20. A transformed state is simply the presence of the Lycanthrope status flag (skill 9) on the unit; a separate always-beast flag (skill 10) exempts a unit from both routines. ${badge("strong","engine")}</p>
  <h2>Forced full charge</h2>
  <p>One runtime condition can override the stored value entirely and report the gauge as permanently full regardless of what's actually stored — a way to grant unlimited transformation to a specific unit or state without changing the normal accounting for every other laguz.</p>
  <p style="color:var(--ink-muted);font-size:13px">Open: whether a turn change also runs the step has not been checked in game with an ordinary laguz.</p>
  `
},

"combat-mechanics": {
  ns:"system", title:"Combat Resolution", dek:"How an exchange of blows and its experience award are calculated",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Double-attack threshold","Effective Speed +4"],["Hit system","Two rolls averaged (\"True Hit\")"],
    ["Crit system","One roll; damage ×3"],["Battle EXP cap","100 per award"]
  ]},
  categories:["Balance","Combat"],
  body:`
  <p>A battle between two units is a sequence of <strong>exchanges</strong>, and each exchange can itself contain more than one <strong>strike</strong> — two separate places extra hits can come from, confirmed to sit in structurally distinct parts of the combat pipeline rather than one conflated mechanism.</p>
  <div class="callout"><p class="callout-t">Mental model: order, quantity, then outcome</p><p>Combat answers three questions in order: <strong>who acts next</strong> (exchange order and counters), <strong>how many strikes that action contains</strong> (ordinary, Brave, or skill-added strikes), and <strong>what each strike does</strong> (hit, critical, effectiveness, damage, and post-hit effects). Keeping those layers separate prevents “double attack,” “Brave,” and “critical” from being treated as versions of the same mechanic.</p></div>
  <h2>Exchanges — how many times the two units trade</h2>
  <p>A skill/flag check can reverse the normal order before anything else happens — the shape of a Vantage-style "counter before being hit" effect. Otherwise the attacker strikes, then the defender counters if still able. After that base pair, two <em>independent</em> checks each compare the two units' effective Speed (the same weight-adjusted value ${wl("combat-animation","combat forecasting")} uses, not raw Speed) — if either side's is at least <strong>4</strong> higher than their opponent's, that side gets a whole additional exchange. This is the game's Speed-based double attack, confirmed at exactly the series' well-known +4 threshold, and it can trigger for either side independently.</p>
  <h2>Strikes — how many hits land within one exchange</h2>
  <p>A single exchange starts at one strike. A flag on the attacker's own <strong>equipped weapon</strong> can unconditionally double it — a Brave weapon's signature behavior, entirely independent of Speed. On top of whatever the weapon already granted, a proc skill can add further strikes via the same skill-check mechanism described below — a Brave weapon and a proc skill genuinely stack within the same exchange rather than being alternate paths.</p>
  <h2>Hit, miss, and critical — the "True Hit" system</h2>
  <p>A strike's outcome is decided by two separate rolls of the same random-number generator (a three-word chained shift-register generator, XORed against the requested percentage): the <strong>Hit</strong> roll advances the generator <em>twice</em> and averages the two results before comparing against the attacker's Hit-rate forecast stat, while the <strong>Critical</strong> roll uses a single roll compared against the Crit-rate forecast stat. Averaging two rolls for Hit but using one for Crit is exactly the series' well-known "True Hit" design — hit rates cluster more tightly around their displayed value than a flat single roll would, while crit rates stay a flat percentage. A confirmed critical hit applies a flat <strong>×3</strong> damage multiplier.</p>
  <p>The Japanese release has no class-level critical bonus at all; in the other releases crit rate can also receive a flat class-level bonus: a specific class trait adds a flat <strong>+15</strong> to Crit in the same forecast step that applies the ordinary Skill-based term, on top of any other active bonus. Separately, an unrelated weapon-side flag can force Crit to <strong>0</strong> outright for that weapon, overriding every other bonus in play.</p>
  <h2>Proc skills — the actual check</h2>
  <p>See ${wl("skills")} for the mechanism (a per-actor bitmask checked by raw table position, rolled against the same shared RNG) and for which specific skills have a confirmed real effect once they trigger.</p>
  <h2>Weapon effectiveness — bonus damage against certain enemy types</h2>
  <p>Before any of that, the equipped weapon's own type value already decided which pair of stats is even being compared: most weapon types weigh Strength against the target's Defense, but a specific small range of type values switches the whole calculation to Magic against Resistance instead.</p>
  <p>Before computing base Attack, the game runs a dedicated effectiveness check. The attacker's "effective against" mask is the combination of its equipped weapon's and its equipped item's category words; it is tested against the categories of the defender's <em>class</em>. If the two share a bit, the weapon's Might is doubled — the mechanism behind every effectiveness pairing in the game (bows vs. flying units, Fire vs. beast-type laguz, and so on). Two categories work differently: <code>boss</code> is effective against any unit carrying the boss flag and <code>final</code> against the final boss, whatever their class; no vanilla weapon has either. ${badge("confirmed","confirmed")}</p>
  <h2>Hit, Critical and Attack overrides</h2>
  <ul>
    <li>Deadeye doubles the final Hit; Gamble halves the final Hit and doubles the final Critical.</li>
    <li>Attacking a unit under a status condition makes the final Hit 100.</li>
    <li>A unit wielding Alondite, Ragnell, Gurgurant, the Lion's claws or the kings' beaks cannot be critted (property <code>sealcrit</code>).</li>
    <li>The Black Knight and Ashnard on Rajaion wear blessed armour (an internal skill flag on their classes): any weapon without the <code>weakA</code> property — Ragnell, the Lion's claws, the dragon breaths, the kings' beaks — has its Attack set to 0 against them, and Counter does not reflect damage onto them.</li>
  </ul>
  <p>On disk, a weapon names its targets with two category words in its ${wl("items-weapons","item record")} (<code>fly</code>, <code>beast</code>, <code>dragon</code>, <code>armor</code>, <code>knight</code>, <code>alize</code>&hellip;), the same words a class uses to describe itself. The <em>Full Guard</em> property removes every effectiveness bonus against its holder; two more properties remove only the anti-flier or only the anti-laguz bonus.</p>
  <h2>Battle experience — two level comparisons, then modifiers</h2>
  <p>Battle EXP is assembled from two components. The first is a halved level-difference term with a minimum of 1. The second adds difficulty, promoted-level, boss, and thief adjustments with a minimum of 0. The game uses two related definitions of effective level: the base term treats a promoted unit as <code>level + 20</code>, while the extra term uses <code>level + 20 + promotionBase[difficulty]</code>.</p>
  <pre><code>base = max(1, (levelConstant[difficulty]
               + defeatedBaseLevel - winnerBaseLevel + 1) / 2)

extra = max(0, modeBonus[difficulty]
                + defeatedPromotedLevel - winnerPromotedLevel
                + bossBonus(defeated) + thiefBonus(defeated))

raw EXP = base + extra</code></pre>
  <p>Three gates come first: fighting the final boss gives no EXP; a unit that never did damage in the exchange gets exactly 1; and the <code>extra</code> term only counts when the opponent died. Boss and thief properties are tested independently, so their bonuses can stack on the same defeated unit. After the raw award is calculated, the Elite skill doubles it and the Frac90 skill reduces it to 70%, preserving a minimum of 1. The same adjustment is applied to growth rates at level-up (see ${wl("level-up-growth")}). The award is capped at 100 and is also constrained by a separate helper that considers current level, current EXP, promotion eligibility, and party state.</p>
  <div class="callout"><p class="callout-t">Mental model: <code>GameData</code> supplies constants, native code supplies the formula</p><p>Seven difficulty-indexed rows are read through a named runtime resource. They hold the mode bonus, level constant, promotion-base bonus, boss bonus, thief bonus, transformed/Laguz growth bonus, and the Berserker/Sniper/Swordmaster critical bonus. The transformed/Laguz row is consumed by a linked-class stat-growth routine, not by the battle-EXP calculator.</p></div>

  <h2>After the numbers: presentation is a separate step</h2>
  <p>Once damage and any experience award are fully calculated, the game hands off to a separate, scheduled presentation step — the EXP bar animation, boss or player-death consequences, any post-battle dialogue, and victory recognition all run there rather than inline with the combat calculation itself. This separation is why a battle's numerical outcome and its on-screen consequences are handled as two distinct stages rather than one.</p>
  <h2>Worked exchange</h2>
  <p>An attacker with 14 effective Speed fights a defender with 9. The +5 advantage clears the +4 threshold, so the attacker receives a second exchange if both units survive. If the attacker uses a Brave weapon, each attacker exchange contains two strikes: two before the counter and two in the follow-up, for as many as four attacker strikes. Each strike still rolls Hit separately, then Critical if it hits; Brave does not guarantee four successful hits and the Speed advantage does not multiply critical damage.</p>
  `
},

"level-up-growth": {
  ns:"system", title:"Level-Up Growth", dek:"How a level-up turns growth rates into stat gains: a random roll per stat, or fixed accumulation",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Modes","Random (a roll per stat) or Fixed (accumulated growth)"],["Chosen","Per save, a flag in the party record"],
    ["Fixed threshold","100 (90 with the Frac90 skill)"],["Stats","HP, Strength, Magic, Skill, Speed, Luck, Defense, Resistance"]
  ]},
  categories:["Balance","Characters"],
  body:`
  <p>Every character has eight growth rates (in percent), set in the ${wl("fe8data","character record")} and optionally added to by the unit's linked class. A level-up converts them into stat gains in one of two ways, selected by one flag stored in the save's party record. ${badge("confirmed","engine")}</p>
  <h2>Random growth</h2>
  <p>For each stat the game takes the rate, awards 1 point for every full 100% it contains, then rolls the remainder once against the shared random-number generator for one more point. A unit with the Frac90 skill gets a second chance at that roll. The gains are written to eight pending bytes on the unit and then trimmed against the stat caps of the unit and its class before the level-up screen shows them.</p>
  <h2>Fixed growth</h2>
  <p>Each stat keeps a hidden counter. A level-up adds the growth rate to it; whenever the counter reaches the threshold (100) the stat gains a point and the threshold is subtracted. Units with the Frac90 skill use a threshold of 90 instead. A 40% growth therefore pays a point at levels 3, 5 and 8 and so on, with no randomness. The counters are halved when a unit promotes.</p>
  <div class="callout"><p class="callout-t">Which mode is in force</p><p>The flag is set when a playthrough starts and read through a single accessor used by both level-up paths and the debug menu; the debug menu has an entry that flips it.</p></div>
  <h2>Skills that touch it</h2>
  <p>The same helper that scales battle EXP scales growth rates for Elite (doubled) and Frac90 (70%), with an upper limit of 100 on the result.</p>
  <p>See ${wl("combat-mechanics")} for the EXP side of the same adjustment.</p>
  `
},

"map-actions": {
  ns:"system", title:"Map Actions", dek:"The player's command menu, the enemy AI's action checkers, and the action ids both hand to one executor",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Player commands","32 menu-entry classes"],["AI checkers","~38, through one shared register call"],
    ["Executor","One switch on the action id"]
  ]},
  categories:["Structure","Combat"],
  body:`
  <p>A map action is identified by a small number, the <em>action id</em>. Two different front ends produce it. The player's command menu is a list of menu entries, one class per command; the enemy and NPC AI uses separate checker functions. Both store the chosen id, its target and its tile in the same pending-action slots, and one executor then runs it. ${badge("confirmed","confirmed")}</p>

  <h2>The player's command menu</h2>
  <p>Each command (Attack, Staff, Rescue&hellip;) is a small class with four methods: its label (an <code>MMM_</code> message key), its help text (an <code>MH_</code> key), an availability test and an execute method. When the menu opens, every entry's availability test decides whether it is shown; choosing it stores its action id. The full list:</p>
  <table><thead><tr><th>Command</th><th>Label key</th><th>Action id</th><th>Notes</th></tr></thead><tbody>
    <tr><td>Wait</td><td><code>MMM_TAIKI</code></td><td class="num">1</td><td>always available</td></tr>
    <tr><td>Items</td><td><code>MMM_ITEM</code></td><td class="num">2</td><td>opens the item sub-menu (Use, Equip, Unequip, Trade, Drop)</td></tr>
    <tr><td>Use (item)</td><td><code>MMM_IUSE</code></td><td class="num">4</td><td></td></tr>
    <tr><td>Trade</td><td><code>MMM_ITRADE</code></td><td class="num">6</td><td><code>0x28</code> when chosen from the item sub-menu</td></tr>
    <tr><td>Talk</td><td><code>MMM_TALK</code></td><td class="num">7</td><td></td></tr>
    <tr><td>Visit</td><td><code>MMM_VISIT</code></td><td class="num">9</td><td></td></tr>
    <tr><td>Door / Chest</td><td><code>MMM_DOOR</code> / <code>MMM_TBOX</code></td><td class="num">11 / 12</td><td>one shared class with two labels</td></tr>
    <tr><td>Seize</td><td><code>MMM_CONQ</code></td><td class="num">13</td><td></td></tr>
    <tr><td>Escape</td><td><code>MMM_ESC</code></td><td class="num">14</td><td></td></tr>
    <tr><td>Attack</td><td><code>MMM_ATTACK</code></td><td class="num">15</td><td></td></tr>
    <tr><td>Staff</td><td><code>MMM_ROD</code></td><td class="num">16</td><td></td></tr>
    <tr><td>Steal</td><td><code>MMM_STEAL</code></td><td class="num">17</td><td></td></tr>
    <tr><td>Chant</td><td><code>MMM_CHANT</code></td><td class="num">18 / 43</td><td></td></tr>
    <tr><td>Shove / Smite</td><td><code>MMM_TACKLE1</code> / <code>MMM_TACKLE2</code></td><td class="num">19 / 20</td><td>push an adjacent unit 1 or 2 tiles</td></tr>
    <tr><td>Gamble</td><td><code>MMM_GAMBLE</code></td><td class="num">21</td><td></td></tr>
    <tr><td>Rescue</td><td><code>MMM_RESCUE</code> (<code>MMM_RESCUEP</code> "Savior")</td><td class="num">25</td><td></td></tr>
    <tr><td>Drop</td><td><code>MMM_DROPOFF</code></td><td class="num">26</td><td></td></tr>
    <tr><td>Give / Take</td><td><code>MMM_CSEND</code> / <code>MMM_CRECV</code></td><td class="num">27 / 28</td><td>the transfer happens in the menu; the executor does nothing</td></tr>
    <tr><td>Vortex</td><td><code>MMM_FLUTTER</code></td><td class="num">29</td><td>an attack with the Vortex as weapon</td></tr>
    <tr><td>Roar</td><td><code>M咆哮</code></td><td class="num">30</td><td>"Paralyze an enemy unit", once per map</td></tr>
    <tr><td>Reinforce</td><td><code>MMM_ZOEN</code></td><td class="num">32</td><td>deploys a named reinforcement group</td></tr>
    <tr><td>Sky Boon</td><td><code>M天</code></td><td class="num">33</td><td>the Heal effect over a range (Blessing skill)</td></tr>
    <tr><td>Earth Bounty</td><td><code>M地</code></td><td class="num">34</td><td>the Restore effect with an earth-blast animation (Boon skill)</td></tr>
    <tr><td>Break</td><td><code>MMM_DBR</code></td><td class="num">39</td><td>attack breakable terrain</td></tr>
    <tr><td>Arrive</td><td><code>MMM_ARR</code></td><td class="num">41</td><td></td></tr>
    <tr><td>Ballista</td><td><code>MMM_SH</code></td><td class="num">42 / 49</td><td>two siege-weapon variants</td></tr>
    <tr><td>Order / Direct</td><td><code>MMM_ORDER</code> / <code>MMM_DEMAND</code></td><td class="num">50 / 51</td><td>army orders (follow, safety, move&hellip;)</td></tr>
  </tbody></table>
  <p>A further label, <code>M落石</code> ("Push"), sits among these keys; which command class uses it is not traced. ${badge("open","open")}</p>

  <h2>Rules the executor applies</h2>
  <ul>
    <li><strong>Shove and Smite</strong> push the target 1 or 2 tiles away. A target with a specific defensive trait rolls its Strength as a percentage to resist, and fliers are not pushed. A unit pushed onto a pit falls.</li>
    <li><strong>Drop</strong> next to an enemy hidden in fog becomes an ambush: the "!" encounter mark and sound play instead.</li>
    <li><strong>Door and Chest</strong> use the chosen key item; a thief opening a lock without one runs the Chest Key's effect.</li>
    <li><strong>Break</strong> runs a combat preview against the breakable terrain's own HP.</li>
  </ul>

  <h2>The AI's checkers</h2>
  <p>Enemy and NPC units don't use the menu. About forty checker functions each answer "can this unit do X here", and every one that succeeds calls the same small register function, which stores the action id, its target and tile and sets an "action found" flag. The ${wl("cp-data-format","AI scripts")} call these checkers. Notable ones:</p>
  <table><thead><tr><th>Checker</th><th>What it does</th></tr></thead><tbody>
    <tr><td>Chant</td><td>Pairs each Chant variant the unit knows with its own validator, scores nearby allies and registers the best one.</td></tr>
    <tr><td>Steal</td><td>Scans nearby enemy inventories against the AI's steal list.</td></tr>
    <tr><td>Unlock (thieves)</td><td>Walks to the nearest door or chest, or opens one next to it (actions 11 / 12).</td></tr>
    <tr><td>Door Key / Chest Key</td><td>Only for units deployed with the matching ${wl("dispo-format","deployment flag")} (<code>0x10</code> doors, <code>0x20</code> chests).</td></tr>
    <tr><td>Holy Water / Torch</td><td>Always answer no: the AI never uses these items.</td></tr>
    <tr><td>Wait</td><td>Registers the unit's own tile.</td></tr>
  </tbody></table>
  <p style="color:var(--ink-muted);font-size:13px">Which units count as allies or enemies for these checks is decided by the army-relation system — see ${wl("armies-allegiance")}.</p>
  `
},

"economy": {
  ns:"system", title:"Economy", dek:"Gold, shops, and forging — how the game tracks and spends the party's money",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Gold field","Party struct, one field"],["Hard cap","9,999,999"],
    ["Also tracked","Cumulative earned / spent, separately"]
  ]},
  categories:["Economy"],
  body:`
  <p>The party's current gold lives as a single field on the game's central party-data struct. Changing it is never a plain overwrite: the function that sets a new amount also adjusts two further running totals — cumulative gold ever earned, and cumulative gold ever spent — by however much the requested change actually moved the total up or down, before finally clamping the new balance to a hard cap of <strong>9,999,999</strong>. ${badge("confirmed","confirmed")}</p>
  <p style="color:var(--ink-muted);font-size:13px">Neither running total has a confirmed reader yet — plausibly feeds an end-of-game statistics or ranking screen, but that hasn't been traced.</p>
  <h2>Example: earning and spending</h2>
  <p>If the party gains 1,000 gold, current gold and cumulative earned gold rise by 1,000 unless the current balance hits the cap first. Spending 300 then lowers current gold and raises cumulative spent by 300; it does not erase the earned total.</p>
  <h2>Shops and forging</h2>
  <p>Gold is spent through ${wl("shop-format","per-chapter shop inventories")}: an armory, a vendor, and a forge. The forge is a genuine weapon-upgrading mechanic — its stock is a grid of weapon families by base weapon (see ${wl("items-weapons")} for how a forged weapon's stats are adjusted). Only one weapon can be forged per chapter: a flag in the party data is set when the forged weapon is delivered, the base menu's Forge entry is unavailable while it is set, and it clears when the chapter ends. The flag is saved. ${badge("confirmed","confirmed")}</p>
  <h2>Convoy</h2>
  <p>Beyond what a unit personally carries, the party has one shared storage array — the convoy — holding up to <strong>200</strong> items independently of any unit's own inventory. A shop purchase can be sent straight to the convoy instead of to a unit on the field, without needing to route through anyone's personal inventory first.</p>
  <p>Convoy access itself is chapter-gated: it is unavailable during the game's early chapters, and becomes available again from partway through the game onward, plus during the base/preparation screens that sit outside normal chapter numbering.</p>
  <p>A forged weapon goes either to the unit or, when the convoy is available, into the convoy.</p>
  `
},

chapters: {
  ns:"system", title:"Chapters", dek:"How a story chapter is actually assembled from four independent files, and how the game moves from one to the next",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Files per chapter","4, sharing one number"],["File numbering vs. in-game number","Off by one (Prologue = slot 01)"],
    ["Progression (N to N+1)","<code>current chapter + 1</code>, in native code"],
    ["Script entry points","<code>Startup</code>, <code>Opening0</code>&ndash;<code>2</code>, <code>Opening18_2</code>&ndash;<code>4</code>"]
  ]},
  categories:["Structure"],
  body:`
  <p>A story chapter is not one file — it is four independent files that happen to share the same two-digit number, each owned by a different system:</p>
  <div class="callout"><p class="callout-t">Mental model: one chapter number, four cooperating systems</p><p>The number is the rendezvous point. Dialogue supplies words, the event script supplies decisions and timing, deployment supplies actors and inventories, and the map supplies physical space. The playable chapter emerges only when the engine loads these parts together.</p></div>
  <table><thead><tr><th>File</th><th>Holds</th></tr></thead><tbody>
    <tr><td>${wl("message-format","<code>Mess/cNN.m</code>")}</td><td>Every line of dialogue and narration for the chapter</td></tr>
    <tr><td>${wl("event-script","<code>Scripts/CNN.cmb</code>")}</td><td>The compiled logic that sets the chapter up, fires cutscenes, and checks win/lose conditions</td></tr>
    <tr><td>${wl("dispo-format","<code>zmap/bmapNN/dispos.cmp</code>")}</td><td>Which units spawn, as what class, carrying what, with what AI — separately for each difficulty</td></tr>
    <tr><td>${wl("map-format","<code>zmap/bmapNN/map.cmp</code>")}</td><td>The terrain those units spawn onto, plus every placed 3D prop</td></tr>
  </table>
  <h2>The chapter record</h2>
  <p>A table in ${wl("fe8data")} (<code>ChapterData</code>) ties the four files together: one record per chapter, found by its chapter number. The record names the map folder (<code>bmap01</code>, loaded as <code>zmap/bmap01</code>), the script (<code>Scripts/C01.cmb</code>) and the message file (<code>mess/C01.m</code>). ${badge("confirmed","engine")}</p>
  <table class="tight"><thead><tr><th>The record also holds</th><th>Used for</th></tr></thead><tbody>
    <tr><td>The map music</td><td>Played with the map</td></tr>
    <tr><td>Four objective texts, with Hard and Maniac replacements</td><td>The goal and defeat lines of the ${wl("objectives","objective window")}</td></tr>
    <tr><td>Two background images</td><td>The preparation screens and the default conversation background</td></tr>
    <tr><td>A scene map and sky</td><td>The class-change scene</td></tr>
    <tr><td>Four bonus levels, one per difficulty</td><td>Added to the level of auto-levelled enemies (0, 0, 2 and 2 on story chapters, capped at 20)</td></tr>
    <tr><td>Twelve grade limits</td><td>Trial maps only: turns, losses and kills for grades A&ndash;D</td></tr>
  </tbody></table>
  <p>The table holds 44 records: the 32 story chapters, three alternate early chapters, three tutorials and six trial maps. Its title key (<code>MCT01</code>&hellip;) is the chapter title the game prints. ${badge("confirmed","engine")}</p>
  <div class="callout">
    <p class="callout-t">The chapter number in these filenames is not the number shown to the player</p>
    <p>File-slot numbering runs exactly one behind the in-game display: slot <code>01</code> holds the Prologue. Its saved roster is Ike, Mist, Boyd, and Greil, while displayed Chapter 1 uses slot <code>02</code>, Chapter 2 uses slot <code>03</code>, and so on. ${badge("confirmed","confirmed")}</p>
  </div>
  <div class="callout">
    <p class="callout-t">Progression lives entirely in the executable, not in any chapter's own data</p>
    <p>No script or table names the next chapter. The game keeps one byte, the current chapter number; when a chapter is won it adds 1 to it, and the new number selects its chapter record. ${badge("confirmed","engine")}</p>
  </div>
  <h2>How a chapter runs</h2>
  <p>A fixed sequence in the executable runs every chapter. The chapter's event script only supplies functions with agreed names, and a missing function simply skips its step: ${badge("confirmed","engine")}</p>
  <ol>
    <li><strong>Load.</strong> The record for the current number is found; its map, script and message file load. A number with no record crashes the game.</li>
    <li><strong>Setup.</strong> The objective texts are copied from the record, the victory and defeat flags are cleared, and the script's <code>Startup</code> function places the first units and registers the chapter's flags.</li>
    <li><strong>Intro.</strong> <code>Opening0</code> plays the opening scenes.</li>
    <li><strong>Base</strong>, only if the script has <code>Opening1</code>. From Chapter 9 on, a report of the previous chapter comes first; then the base menu; then <code>Opening1</code>.</li>
    <li><strong>Preparations</strong>, only if the script has <code>Opening2</code>: the preparations screen, then <code>Opening2</code>.</li>
    <li><strong>Battle</strong>, until the script sets the victory flag <code>gf_complete</code> or the defeat flag <code>gf_gameover</code>.</li>
    <li><strong>After a victory.</strong> The clear record is shown, the chapter's turn count and play time are logged, the number goes up by 1 and the save menu opens. Then step 1 runs again.</li>
  </ol>
  <p>This is why the Prologue and Chapters 1&ndash;2 have neither base nor preparations (their scripts only define <code>Opening0</code>), Chapters 3&ndash;7 have preparations but no base, and later chapters have both.</p>
  <table class="tight"><thead><tr><th>Special case</th><th>What happens</th></tr></thead><tbody>
    <tr><td>Chapter 27</td><td>Two numbers (slots 28 and 29) for one chapter on two maps. No save menu between them, and the second half's script only has an intro.</td></tr>
    <tr><td>Chapter 17</td><td>One number, four battles. The script ends each of the first three with <code>Complete18(part)</code> instead of a victory: the number stays the same, the save menu opens, and <code>Opening18_2</code>, <code>_3</code> or <code>_4</code> sets up the next battle, loading another map when needed.</td></tr>
    <tr><td>After the Endgame</td><td>Number 32 means the game is cleared: the Endgame map is reloaded for the final scene, the ending plays, the clear is recorded per difficulty in the system data, and the title screen returns.</td></tr>
    <tr><td>Saves</td><td>A save stores the chapter number and a resume point: the base, preparations, the start of the chapter (the save made after a victory), part 2&ndash;4 of Chapter 17, or a suspended battle (see ${wl("save-format")}).</td></tr>
  </tbody></table>
  <h2>Adding chapters</h2>
  <p>Slots 0&ndash;31 are all used by the story, 32 means &ldquo;game cleared&rdquo;, and the save code treats every number from 32 up as a trial map, so a new story chapter cannot simply be appended after the Endgame. ${badge("confirmed","engine")}</p>
  <ul>
    <li><strong>Replacing</strong> a chapter needs data only: point its record at other files, or edit the files it names.</li>
    <li><strong>Adding battles inside a chapter</strong> can reuse the Chapter 17 mechanism in any chapter's script, up to three extra battles per number. A Prologue whose script ends its battle this way opens the save menu and plays a second battle on the Chapter 1 map before Chapter 1 begins, and a save made in that menu reloads into the second battle. Likewise, giving the Prologue an <code>Opening2</code> function makes its preparations screen appear. ${badge("confirmed","in game")}</li>
    <li><strong>Inserting a new number</strong> means renumbering every later record and changing the executable wherever it tests a chapter number: the Chapter 27 pair, the ending, the save limit, the report from Chapter 9 on, the convoy unlock, the phase music and the per-chapter shops.</li>
  </ul>
  <p>Within one chapter the four files are largely independent in content but coordinated in effect: the script's ${wl("events-scripting","phase and turn triggers")} decide when dialogue plays and which units act, dispo's deployment records decide who is actually on the field for the script to act on, and the map file's terrain and ${wl("map-grid","grid")} decide where any of that can physically happen. A chapter with more than one battle-map phase — a mid-chapter reinforcement wave, for instance — gets its own suffixed map, <code>bmap06</code> then <code>bmap06_2</code>, sharing the same script and dialogue file as the primary phase.</p>
  <h2>Worked example: a turn-three reinforcement</h2>
  <p>The event script owns the “turn 3, enemy phase” condition. When it fires, it refers to units that the chapter's deployment data defines, places them at tactical-grid coordinates valid for the current map, and may display lines stored in the chapter message file. Editing only the dialogue changes what is said; editing only deployment changes who appears and what they carry; editing only the trigger changes when the same reinforcement sequence runs.</p>
  <h2>What a chapter does not own</h2>
  <p>Character base definitions, class capabilities, item definitions, and skill definitions remain global in ${wl("fe8data")}. A chapter selects and overrides those definitions; it does not duplicate them. Campaign progression is also not a fifth chapter-data file: native code advances the current chapter number after completion.</p>
  <h2>Playthrough number</h2>
  <p>A new game records how many different games have already been cleared on the memory card, plus one. On the first playthrough the 17 class rings marked in deployment records (such as Oscar's Knight Ring and Hibuchi's Thief Ring) are not given; from the second on they appear and drop. From the second playthrough, holding A also speeds up map unit movement. Each game gets an id when it starts, and a clear is recorded once per id, so clearing again from a later save of the same game doesn't count twice. Scripts read the same number with <code>SysGetRound</code>. ${badge("confirmed","confirmed")}</p>
  <h2>Difficulty</h2>
  <p>One difficulty setting — Easy, Normal, Hard, or Maniac, defaulting to Hard — is chosen once at the start of a playthrough and persists across every chapter transition rather than being stored or re-derived per chapter. Difficulty-indexed lookups spread throughout the game read this same value by name: it selects among the ${wl("combat-mechanics","EXP, growth, and critical-bonus constants")} used in combat, which per-chapter shop stock is available, and a handful of map-only effects only active on the harder settings.</p>
  `
},

"support-system": {
  ns:"system", title:"Support System", dek:"Relationship progression, persistent ranks, affinity bonuses, and the boundaries of the current specification",
  infobox:{ type:"Game system", status:"open", fields:[
    ["Bonus table","Not found"],["Growth-block lead","<code>Characters</code> §support_growth"],["Ruled out","<code>cp_data.bin</code>"]
  ]},
  categories:["Balance","Open questions"],
  body:`
  <p>Supports are persistent relationships whose rank can grant battle modifiers when the paired characters meet the game's proximity and availability rules. The archive can describe the likely character-side growth data and the boundaries of the system, but not yet the final affinity bonus table.</p>
  <h2>How the system is expected to divide responsibility</h2><p>Character definitions provide relationship-growth inputs, save data must preserve accumulated relationship state and ranks, and combat-stat code applies bonuses derived from rank and elemental affinity. These are separate layers; an eight-byte character block cannot by itself contain every partner, rank, and runtime bonus.</p>
  <h2>Example</h2><p>If two characters gain enough relationship progress to increase rank, the save must retain that rank. During battle, the system can then combine the rank with each character's affinity to produce applicable bonuses. The exact numerical affinity table and proximity consumer remain open, so no values should be inferred from the candidate growth block alone.</p>
  <div class="callout">
    <p class="callout-t">A real, plausible lead</p>
    <p>${wl("characters","Every character record's")} second 8-value block, immediately after confirmed growths, is overwhelmingly quantized to multiples of 5 and is independently labeled <code>supportgrowth</code> by another format description. This supports a growth-related interpretation but does not establish its runtime consumer. ${badge("strong","strong evidence")}</p>
  </div>
  <div class="callout warn">
    <p class="callout-t">Data that belongs to another system</p>
    <p><code>cp_data.bin</code> is not support data: it is the computer player's data &mdash; AI scripts, movement-scoring weights, heal thresholds and the thief steal list. See ${wl("cp-data-format","cp_data.bin")}. ${badge("open","ruled out")}</p>
  </div>
  <h2>Confirmed: rank thresholds and progress</h2>
  <p>Independent of the unresolved bonus table, the progression mechanics themselves are fully confirmed. Each unit can hold at most <strong>5</strong> concurrent supports; a sixth partner simply cannot begin building rank until one of the existing five is somehow freed. Each support pairing stores its own C/B/A progress thresholds, and a unit's current rank with that partner is just a comparison of accumulated progress against those threshold values. Progress itself increases by a flat <strong>+1</strong> for each qualifying conversation and is capped one point above the A threshold, so continuing to trigger a maxed-out support's conversations cannot overflow or wrap its stored progress.</p>
  <p>The Hit/Avoid/Critical values per support rank are not identified. Because bonuses scale by elemental affinity rather than by a unique character pair, the missing representation is expected to be affinity-indexed (Fire, Wind, Thunder, Light, Dark, Earth, Water, Heaven), not a table keyed by character labels.</p>
  <p>Confirming whether <code>support_growth</code> drives accumulation requires correlating the field with changing relationship state at runtime.</p>
  `
},

"music-system": {
  ns:"system", title:"Music System", dek:"How the game decides which track to play, by name, through a generic engine-wide lookup mechanism",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Trigger mechanism","Symbolic name (<code>externCall</code>)"],
    ["Lookup mechanism","Global string-hash table, engine-wide"],
    ["Name→track table","<code>Sound/gcfesnd.bin</code>"],["Format article","<code>STM & DSP-ADPCM</code>"]
  ]},
  categories:["Audio"],
  body:`
  <p>Chapter ${wl("event-script","event scripts")} trigger music by a <em>symbolic name</em>, never a raw track index — confirmed by parsing all 43 real chapter scripts: <code>externCall(BGMPlay, "BGM_EVT_IKE1")</code> and siblings, 76 distinct <code>BGM_*</code> names in use across the game.</p>
  <h2>How a script request becomes playback</h2><p>The script supplies a <code>BGM_*</code> cue, native code hashes the name into a global runtime registry, the resolved entry points at a record inside <code>Sound/gcfesnd.bin</code>, and MusyX starts the streamed track that record names. Symbolic identity is therefore separate from the <code>.stm</code> filename and codec.</p>
  <div class="callout">
    <p class="callout-t">A single generic hash table backs every named lookup in the engine, not just music</p>
    <p>The name is resolved through one general-purpose string→pointer hash table (509 buckets, chained, double-hashed) that the engine reuses for far more than music — the same mechanism backs ${wl("events-scripting","externCall dispatch")} itself, scene names, and other named resources throughout the game. The function that actually plays a track calls this lookup directly with the literal name string — <code>PlayBGM(slot, "BGM_MAP_WIN1", volume, loop)</code> — the same shape confirmed for scene lookups elsewhere in the engine. ${badge("confirmed","confirmed")}</p>
  </div>
  <h2>The name→track table</h2>
  <p><code>Sound/gcfesnd.bin</code> is a proprietary, game-specific resource database sitting alongside the real MusyX sound-engine files: it holds all 142 <code>BGM_*</code> cue names, ~1,150 <code>SFX_*</code> cue names, and all 80 real ${wl("stm-format","<code>.stm</code>")} filenames as plain strings. Its first 111 records are the <code>BGM_*</code> cues themselves, each a fixed 12-byte entry: the cue's own name, a one-byte "has a real track" flag alongside a per-cue volume-like value, and the target <code>.stm</code> path (minus its extension). At boot, every one of these records is registered by name into the same engine-wide hash table an <code>externCall(BGMPlay, ...)</code> looks up — closing the loop between a script's symbolic cue and the actual stream MusyX plays. 31 of the 76 script-referenced names match a real track exactly under simple normalization; the other 45 have naming drift a plain convention can't resolve.</p>
  <p>Of those 111 built-in cues, <strong>24 are unused</strong> in the retail game: registered names (<code>BGM_DUMMY_69</code> through <code>_74</code>, several unused <code>BGM_OPENING*</code>/<code>BGM_PRO0*</code>/<code>BGM_COLOSSEUM_*</code> slots, and a few unused event stingers) that all share one placeholder path with no backing file anywhere on the disc. They resolve by name exactly like any real cue; they simply have nothing to actually stream if ever triggered unmodified.</p>
  <h2>Four BGM channels, crossfaded by name</h2>
  <p>Starting a new track doesn't simply cut off whatever was playing. The engine tracks up to <strong>four simultaneous BGM channels</strong> at once, each an independent playback slot. Stopping or changing a track works by name, not by slot number: given a cue name, the engine hashes it the same way as above, then checks each of the four channels' own currently-playing name (hashed the same way) to find which one, if any, is already playing that exact cue — then either cuts it immediately or runs a real per-frame volume fade-out over a caller-specified duration (every observed case fades over 100–500&nbsp;ms).</p>
  <p>This four-channel design is what makes layered battle music possible: <code>BGM_PHASE_PL1</code>/<code>PL2</code> (a player-phase variant) and <code>BGM_PHASE_CP1</code>/<code>CP2</code> (its CPU/enemy-phase counterpart) are faded against each other through this exact mechanism as control passes between phases, rather than being spliced into one track file or hard-cut at the phase boundary.</p>
  <div class="callout brass">
    <p class="callout-t">The built-in table already carries spare cue slots</p>
    <p>Because 24 registered cue names already exist with no backing file, pointing one at a real <code>.stm</code> path (and flipping its "has a real track" byte) makes that name resolve to a real stream exactly the way any retail cue does — without growing the table itself, as long as each repointed slot gets its own path string rather than sharing the original placeholder with the other 23. ${badge("confirmed","confirmed")}</p>
  </div>
  <h2>The Sound Room</h2>
  <p>The extras menu's Sound Room plays from a fixed table of 64 <code>BGM_</code> names in the executable, through the same name lookup as any other cue. The illustrations behind its menu are a separate slideshow listed in ${wl("sound-room")}. ${badge("confirmed","confirmed")}</p>
  <p style="color:var(--ink-muted);font-size:13px">Contrast with ${wl("cutscenes")}, where a video is instead referenced by a literal path string with no hash lookup or intermediate table at all — a mechanically simpler, if less flexible, solution to the same "trigger a media asset by name" problem.</p>
  `
},

"combat-animation": {
  ns:"system", title:"Combat & Battle Animation", dek:"How a class, a weapon, and a character combine into the animation actually shown in battle",
  infobox:{ type:"Game system", status:"strong", fields:[
    ["Selects between","508 named animations"],["Selects via","<code>FE8Anim.bin</code>"],
    ["Plays","<code>.g / .gs / .ga</code> model data"],["Overlays","<code>FE8Effect.bin</code> spell/skill effects"]
  ]},
  categories:["Graphics","Animation"],
  body:`
  <p>A map-model animation is a pipeline across four formats. ${wl("classes","A class")} selects the <code>ymu/&lt;class&gt;/</code> folder holding its map model's ${wl("model-formats","skeleton, mesh, and animation clips")}. ${wl("fe8anim","FE8Anim.bin")} names each <code>.ga</code> clip and tags it with a weapon type, using the same category enum as the class's weapon-rank string.</p>
  <h2>Map models and battle models</h2><p>This registry drives the <strong>map models</strong> (<code>ymu/</code>): the units seen on the map and the combat played there. The battle scene uses a separate, detailed <strong>battle model</strong> from <code>zu/&lt;code&gt;/</code>, chosen through <code>jobList.dbx</code> by animation ID, character or class (see ${wl("zdbx","ZDBX & DBX")}). Its animations sit in one pack per weapon type and are named by action and weapon — <code>fig1_at1_ax.ga</code> (first axe attack), <code>_at2_</code> (second attack), <code>_cr1_</code>/<code>_cr2_</code> (criticals), <code>_dog_</code> (dodge), <code>_dam_</code> (damage), <code>_ded_</code> (death), plus combined clips such as <code>_cr1_ax_dog</code>. ${badge("confirmed","confirmed in game")} See ${wl("model-formats","model formats")}.</p>
  <h2>How the visible battle is assembled</h2><p>Class chooses the model family, weapon context chooses a compatible animation category, character tags may select an override, the <code>.ga</code> clip poses the model, and <code>EID_</code> chains add spell or skill visuals. Combat mechanics separately decide hits and damage.</p>
  <h2>Example</h2><p>A Knight using a sword resolves a sword-compatible <code>AID_</code> into the Knight folder, loads its skeleton and mesh, and plays the selected clip. If the unit has a character-tagged override, that clip can change pose without changing the unit's class stats or weapon definition.</p>
  <p>A subset of animations are further overridden per <em>character</em>, not just per class: a 2-letter tag embedded in the animation's own name (<code>AID_KNIGHT_KE_N</code> for Kieran) lets a specific named unit get a custom weapon-holding pose distinct from the rest of their class. This is the mechanism behind, for instance, a named Knight-class character visibly carrying their weapon differently from a generic Knight enemy.</p>
  <p>Spell and skill effects layer on top of a unit's own animation via ${wl("fe8effect","FE8Effect.bin")}'s <code>EID_</code> registry — a tiered spell like Fire4 doesn't just play one effect, it chains through up to three stages before landing on its final visual, each stage a separate registry entry.</p>
  <p>Weapon trails and attachment points depend on anchor bones in the class rig. Every character rig supplies <code>_s1_</code> and <code>_s2_</code>; weapon-specific pairs appear only on classes that need them, such as sword, spear, hand-axe, axe, bow, javelin, and effect anchors. Hand anchors are named separately with <code>r_hand</code> and <code>l_hand</code>. How the visible weapon model is attached to those hand anchors is still not fully traced.</p>
  <div class="callout">
    <p class="callout-t">What's actually confirmed vs. inferred</p>
    <p>The name→folder→weapon-type chain is confirmed with zero exceptions (508/508 records). The character-tag override mechanism is strong circumstantial evidence, not fully closed. Which specific animation clip plays for which in-battle action (attack vs. critical vs. dodge) is determined by the <code>.ga</code> filenames themselves (<code>atk1_bw.ga</code>, <code>dead_n.ga</code>, ...) rather than a further lookup table — read as self-describing by convention, not independently verified against engine code.</p>
  </div>
  `
},

cutscenes: {
  ns:"system", title:"Cutscenes", dek:"How the game decides which video to play — a literal path string, simpler than music's name→table lookup",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Trigger mechanism","Literal path string, or plain chapter number"],
    ["Format article","<code>THP</code>"],["New videos wireable","Yes"]
  ]},
  categories:["Video"],
  body:`
  <p>Where ${wl("music-system","music")} resolves a name through a shared hash table and an intermediate record, cutscene selection has no indirection at all. Chapter ${wl("event-script","scripts")} trigger a cutscene two ways, both confirmed by parsing all 43 real scripts: <code>externCall(MoviePlay, "Movie/s06_M.thp")</code> — the literal path string sits right in the script's own bytecode — and <code>externCall(ChapterMoviePlay, N)</code>, a plain numeric literal for the recurring chapter-opening cutscene, one call per chapter.</p>
  <h2>How a cutscene reaches the decoder</h2><p>An event trigger runs bytecode, <code>MoviePlay</code> supplies a literal filesystem path, the disc filesystem returns that THP resource, and the movie player advances its linked video/audio frames. <code>ChapterMoviePlay</code> performs chapter-based selection before entering the same playback domain.</p>
  <h2>Example</h2><p><code>MoviePlay("Movie/s06_M.thp")</code> directly identifies the asset. Replacing that string changes the requested movie; replacing the THP at the same path changes its contents without changing script logic.</p>
  <p>Two real scripts even branch between an E3-demo path and the normal one this way, selected by an <code>IsE3Version</code> check — a small window into build/debug scaffolding left in the shipped game.</p>
  <div class="callout brass">
    <p class="callout-t">Because it's a literal string, a new cutscene slot is directly addressable</p>
    <p>A <code>MoviePlay</code> call's operand is the plain path string itself, sitting in the script's own string pool — nothing about locating or rewriting the target it points at needs an intermediate name→id table the way ${wl("music-system","music")} does. ${badge("confirmed","confirmed")}</p>
  </div>
  <p>Two mechanically similar "trigger a media asset by name" problems end up solved two different ways: cutscenes by a literal string in plain sight, music by a shared runtime hash table over a table of records in <code>Sound/gcfesnd.bin</code> — both fully addressable, but only one needs no indirection at all.</p>
  `
},
