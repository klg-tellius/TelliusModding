<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>


<title>Tellius Archive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#f2f3ee;
    --surface:#ffffff;
    --surface-2:#e8e9e1;
    --ink:#1a1f1c;
    --ink-muted:#5b6560;
    --ink-faint:#8b948d;
    --rule:#d7d9cf;
    --rule-strong:#bfc3b6;
    --petrol:#1f5c78;
    --petrol-deep:#123c50;
    --petrol-soft:#e2edf1;
    --brass:#8a662c;
    --brass-soft:#f2e7d0;
    --rust:#8a4632;
    --rust-soft:#f3e3dd;
    --moss:#3f6b4a;
    --moss-soft:#e4ede4;
    --shadow: 0 1px 2px rgba(20,25,20,0.05), 0 6px 20px -10px rgba(20,25,20,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#13221a; /* dark: switched to petrol/ink so this stays deliberate below */
      --paper:#151a17;
      --surface:#1c221d;
      --surface-2:#232a23;
      --ink:#e7e9e0;
      --ink-muted:#a3ab9f;
      --ink-faint:#6f766b;
      --rule:#333a32;
      --rule-strong:#454d43;
      --petrol:#7fc0dd;
      --petrol-deep:#bcdfee;
      --petrol-soft:#1b333c;
      --brass:#e0b46c;
      --brass-soft:#3a2f18;
      --rust:#e2a08c;
      --rust-soft:#3a231c;
      --moss:#9dc7a8;
      --moss-soft:#1e2f22;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px -12px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#151a17; --surface:#1c221d; --surface-2:#232a23;
    --ink:#e7e9e0; --ink-muted:#a3ab9f; --ink-faint:#6f766b;
    --rule:#333a32; --rule-strong:#454d43;
    --petrol:#7fc0dd; --petrol-deep:#bcdfee; --petrol-soft:#1b333c;
    --brass:#e0b46c; --brass-soft:#3a2f18;
    --rust:#e2a08c; --rust-soft:#3a231c;
    --moss:#9dc7a8; --moss-soft:#1e2f22;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px -12px rgba(0,0,0,0.6);
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size:16.5px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--petrol-soft); color:var(--ink); }
  code, .mono{ font-family:'JetBrains Mono', ui-monospace, Consolas, monospace; }

  a{ color:var(--petrol); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--petrol); outline-offset:2px; border-radius:2px;
  }
  .wl{ color:var(--petrol); border-bottom:1px solid color-mix(in srgb, var(--petrol) 35%, transparent); }
  .wl:hover{ border-bottom-color:var(--petrol); text-decoration:none; }
  .wl.stub{ color:var(--rust); border-bottom-color:color-mix(in srgb, var(--rust) 35%, transparent); }

  h1,h2,h3,h4{ font-family:'Fraunces', Georgia, serif; font-weight:600; color:var(--ink); text-wrap:balance; }
  h2{ font-size:1.05rem; letter-spacing:0.01em; }

  /* ---------- app shell ---------- */
  .app{ display:grid; grid-template-columns: 268px minmax(0,1fr); min-height:100vh; }
  @media (max-width: 880px){ .app{ grid-template-columns: 1fr; } }

  /* ---------- sidebar ---------- */
  .sidebar{
    border-right:1px solid var(--rule);
    background:var(--surface);
    padding:22px 18px 28px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  @media (max-width: 880px){
    .sidebar{ position:static; height:auto; border-right:none; border-bottom:1px solid var(--rule); }
  }
  .brand{ display:flex; align-items:baseline; gap:9px; margin-bottom:4px; }
  .brand-mark{
    width:11px; height:11px; border-radius:2px;
    background: linear-gradient(135deg, var(--petrol), var(--moss));
    flex:none; margin-bottom:2px;
  }
  .brand-name{ font-family:'Fraunces', serif; font-weight:700; font-size:1.28rem; letter-spacing:0.005em; }
  .brand-tag{ font-size:11.5px; color:var(--ink-faint); margin:0 0 18px; letter-spacing:0.03em; }

  .search-wrap{ position:relative; margin-bottom:18px; }
  .search-wrap input{
    width:100%; padding:8px 10px 8px 30px; border:1px solid var(--rule-strong); border-radius:7px;
    background:var(--paper); color:var(--ink); font-size:13.5px; font-family:inherit;
  }
  .search-wrap input:focus{ outline:2px solid var(--petrol); outline-offset:1px; }
  .search-wrap svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:0.55; }

  .nav-group{ margin-bottom:6px; }
  .nav-label{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.09em; text-transform:uppercase;
    color:var(--ink-faint); padding:12px 8px 6px; display:flex; align-items:center; gap:6px;
  }
  .nav-label .n{ opacity:0.6; }
  .nav-list{ list-style:none; margin:0; padding:0; }
  .nav-list a{
    display:block; padding:6px 8px; border-radius:6px; font-size:14px; color:var(--ink-muted);
    border-left:2px solid transparent;
  }
  .nav-list a:hover{ background:var(--surface-2); color:var(--ink); text-decoration:none; }
  .nav-list a.active{ background:var(--petrol-soft); color:var(--petrol-deep); border-left-color:var(--petrol); font-weight:600; }
  .nav-empty{ font-size:13px; color:var(--ink-faint); padding:6px 8px; }

  .side-foot{ margin-top:20px; padding-top:14px; border-top:1px solid var(--rule); display:flex; flex-direction:column; gap:8px; }
  .side-btn{
    display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-muted);
    background:none; border:1px solid var(--rule-strong); border-radius:7px; padding:7px 10px; cursor:pointer;
    font-family:inherit; text-align:left;
  }
  .side-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .stat-line{ font-size:11.5px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; }

  /* ---------- main / article ---------- */
  main{ min-width:0; padding: 40px 6vw 100px; }
  @media (min-width: 1200px){ main{ padding: 44px 64px 110px; } }
  .article{ max-width: 920px; margin:0 auto; }

  .crumbs{ font-size:12px; color:var(--ink-faint); margin-bottom:10px; font-family:'JetBrains Mono',monospace; letter-spacing:0.02em; }
  .crumbs a{ color:var(--ink-muted); }

  .art-head{ border-bottom:2px solid var(--rule-strong); padding-bottom:14px; margin-bottom:6px; }
  .art-ns{
    display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:8px;
  }
  h1.art-title{ font-size:clamp(1.7rem, 3vw, 2.35rem); margin:0 0 6px; line-height:1.15; }
  .art-dek{ color:var(--ink-muted); font-size:1.04rem; font-style:italic; font-family:'Fraunces', serif; font-weight:500; margin:0; }

  .art-layout{ display:flex; gap:36px; align-items:flex-start; margin-top:22px; }
  @media (max-width: 760px){ .art-layout{ flex-direction:column; } }
  .art-body{ flex:1; min-width:0; max-width:66ch; }
  .art-body p{ margin:0 0 15px; }
  .art-body h2{ margin:34px 0 6px; padding-bottom:6px; border-bottom:1px solid var(--rule); font-size:1.18rem; }
  .art-body h2:first-child{ margin-top:0; }
  .art-body h3{ margin:22px 0 8px; font-size:1.0rem; }
  .art-body ul, .art-body ol{ padding-left:1.25em; margin:0 0 15px; }
  .art-body li{ margin-bottom:6px; }
  .art-body strong{ color:var(--ink); font-weight:600; }
  .art-body blockquote{
    margin:18px 0; padding:2px 0 2px 16px; border-left:3px solid var(--brass); color:var(--ink-muted); font-style:italic;
  }

  .infobox{
    flex:none; width:268px; background:var(--surface); border:1px solid var(--rule); border-radius:10px;
    box-shadow:var(--shadow); overflow:hidden; position:sticky; top:20px;
  }
  @media (max-width: 760px){ .infobox{ position:static; width:100%; } }
  .infobox-head{ background:var(--surface-2); padding:12px 14px; border-bottom:1px solid var(--rule); }
  .infobox-title{ font-family:'Fraunces',serif; font-weight:600; font-size:1.02rem; margin:0 0 3px; }
  .infobox-type{ font-size:11.5px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.05em; }
  .infobox-rows{ padding:4px 0; }
  .ib-row{ display:flex; gap:10px; padding:7px 14px; border-bottom:1px solid var(--rule); font-size:12.5px; }
  .ib-row:last-child{ border-bottom:none; }
  .ib-k{ color:var(--ink-faint); flex:0 0 84px; font-size:11px; letter-spacing:0.02em; text-transform:uppercase; padding-top:1px; }
  .ib-v{ color:var(--ink); flex:1; font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.5; }
  .ib-v a{ font-family:'Source Sans 3',sans-serif; }
  .infobox-status{ padding:12px 14px; border-top:1px solid var(--rule); }

  .toc{ background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:14px 16px; margin:22px 0 26px; display:inline-block; min-width:220px; }
  .toc-title{ font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-faint); margin-bottom:8px; }
  .toc ol{ list-style:none; margin:0; padding:0; counter-reset:toc; }
  .toc li{ counter-increment:toc; margin-bottom:4px; font-size:13px; }
  .toc li::before{ content: counters(toc,".") "  "; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; font-size:11.5px; }
  .toc li a{ color:var(--ink-muted); }
  .toc li a:hover{ color:var(--petrol); }
  .toc li.sub{ margin-left:16px; }

  code{
    background:var(--surface-2); border:1px solid var(--rule); padding:0.1em 0.4em; border-radius:4px;
    font-size:0.87em; color:var(--petrol-deep);
  }
  pre{ background:var(--surface-2); border:1px solid var(--rule); border-radius:8px; padding:12px 14px; overflow-x:auto; font-size:12.5px; }
  pre code{ border:none; background:none; padding:0; }

  .table-wrap{ overflow-x:auto; margin:16px 0; border:1px solid var(--rule); border-radius:9px; }
  table{ border-collapse:collapse; width:100%; font-size:13px; }
  th, td{ text-align:left; padding:8px 12px; border-bottom:1px solid var(--rule); vertical-align:top; }
  th{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-faint); background:var(--surface-2); white-space:nowrap; }
  tr:last-child td{ border-bottom:none; }
  td code{ white-space:nowrap; }
  table.tight td, table.tight th{ padding:6px 10px; }
  td.num, th.num{ font-variant-numeric: tabular-nums; }

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-family:'JetBrains Mono',monospace; font-size:11px;
    padding:2px 8px 2px 7px; border-radius:999px; white-space:nowrap; font-weight:500;
  }
  .badge::before{ content:""; width:6px; height:6px; border-radius:50%; }
  .badge.confirmed{ background:var(--moss-soft); color:var(--moss); }
  .badge.confirmed::before{ background:var(--moss); }
  .badge.strong{ background:var(--brass-soft); color:var(--brass); }
  .badge.strong::before{ background:var(--brass); }
  .badge.plausible{ background:var(--surface-2); color:var(--ink-muted); }
  .badge.plausible::before{ background:var(--ink-faint); }
  .badge.open{ background:var(--rust-soft); color:var(--rust); }
  .badge.open::before{ background:var(--rust); }

  .callout{ border:1px solid var(--rule); border-left:3px solid var(--petrol); background:var(--surface); border-radius:8px; padding:14px 16px; margin:18px 0; box-shadow:var(--shadow); }
  .callout.warn{ border-left-color:var(--rust); }
  .callout.brass{ border-left-color:var(--brass); }
  .callout p:last-child{ margin-bottom:0; }
  .callout-t{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 6px; }

  .see-also{ margin-top:40px; padding-top:18px; border-top:1px solid var(--rule); }
  .see-also h2{ border:none; margin-top:0; }
  .see-also ul{ columns:2; column-gap:28px; }
  @media (max-width:560px){ .see-also ul{ columns:1; } }

  .cats{ margin-top:22px; padding-top:14px; border-top:1px dashed var(--rule); display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .cats .lbl{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em; margin-right:4px; }
  .cat-tag{ font-size:11.5px; background:var(--surface-2); color:var(--ink-muted); padding:3px 9px; border-radius:999px; border:1px solid var(--rule); }

  /* ---------- home / portal ---------- */
  .home-hero{ margin-bottom:8px; }
  .home-hero h1{ font-size:clamp(2.1rem,4vw,2.9rem); margin:0 0 10px; }
  .home-lede{ font-size:1.12rem; color:var(--ink-muted); max-width:62ch; margin:0 0 20px; }
  .confidence-key{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:32px; }
  .portal-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap:16px; margin:20px 0 36px; }
  .portal-card{ background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:16px 18px; box-shadow:var(--shadow); }
  .portal-card h3{ margin:0 0 6px; font-size:1.02rem; }
  .portal-card p{ font-size:13.5px; color:var(--ink-muted); margin:0 0 10px; }
  .portal-card .links{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; }
  .stat-strip{ display:flex; gap:28px; flex-wrap:wrap; margin:26px 0 8px; padding:18px 20px; background:var(--surface); border:1px solid var(--rule); border-radius:10px; }
  .stat{ display:flex; flex-direction:column; }
  .stat b{ font-family:'Fraunces',serif; font-size:1.7rem; font-weight:600; }
  .stat span{ font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em; }

  footer.colophon{ max-width:920px; margin:60px auto 0; padding-top:20px; border-top:1px solid var(--rule); color:var(--ink-faint); font-size:12.5px; line-height:1.7; }
</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark"></span><span class="brand-name">Tellius Archive</span></div>
    <p class="brand-tag">Internal data reference &middot; Path of Radiance</p>

    <div class="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Search articles&hellip;" autocomplete="off">
    </div>

    <nav id="nav"></nav>

    <div class="side-foot">
      <button class="side-btn" id="randomBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>
        Random article
      </button>
      <span class="stat-line" id="artCount"></span>
    </div>
  </aside>

  <main><div id="content" class="article"></div></main>
</div>

<script>
"use strict";

/* ============================== DATA ============================== */

const NS_LABEL = { format: "File Formats", system: "Game Systems", meta: "Meta" };

function badge(kind, text){ return `<span class="badge ${kind}">${text}</span>`; }

/* Plain id -> title lookup, independent of ARTICLES itself, so wl() can be
   called with just an id (no explicit label) from inside ARTICLES' own body
   strings without a temporal-dead-zone self-reference back to ARTICLES. */
const TITLES = {
  main:"Main Page", unexplored:"Open Questions", sources:"Documentation Conventions",
  lz10:"LZ10", "pack-archive":"Pack Archive", "labeled-section":"Labeled Section Format",
  "tpl-texture":"TPL Texture", fe8data:"FE8Data.bin", "dispo-format":"Dispo Format",
  "map-format":"Map File Format", "event-script":"Event Script", "message-format":"Message Format",
  "face-data":"Face Data",
  "shop-format":"Shop Format", "cp-data-format":"cp_data.bin", "stm-format":"STM & DSP-ADPCM", "thp-format":"THP",
  "model-formats":".g / .gs / .ga", fe8anim:"FE8Anim.bin", fe8effect:"FE8Effect.bin",
  "rect-format":"Rect.bin", "sound-room":"soundroom.bin", "iso-fst":"GameCube Disc & FST", "main-dol":"main.dol",
  "save-format":"GameCube Save (.gci)", gcfesnd:"gcfesnd.bin", musyx:"MusyX Audio Resources",
  zdbx:"ZDBX & DBX", posing:"Skeleton Posing & Skinning", "format-coverage":"File Format Index",
  characters:"Characters", classes:"Classes", "items-weapons":"Items & Weapons", skills:"Skills",
  chapters:"Chapters", "support-system":"Support System", "music-system":"Music System",
  "combat-animation":"Combat & Battle Animation", cutscenes:"Cutscenes",
  "disc-layout":"Disc & File Layout", "maps-system":"Maps", "map-objects":"Map Objects & Placement",
  "map-grid":"Coordinate Systems & Grids", objectives:"Objectives", "events-scripting":"Events & Scripting",
  "tutorial-browser":"Tutorial Browser",
  biorhythm:"Biorhythm", "font-format":"Font", "graphics-system":"Graphics & Images", "combat-mechanics":"Combat Resolution",
  "map-actions":"Map Actions", economy:"Economy",
  "skill-sol":"Sol", "skill-luna":"Luna", "skill-aether":"Aether", "skill-counter":"Counter",
  "skill-corrosion":"Corrosion", "skill-cancel":"Cancel", "skill-miracle":"Miracle / Pray",
  "skill-wing-guard":"Wing Guard", "skill-vantage":"Vantage", "skill-steal":"Steal",
  "skill-chant":"Chant", "skill-canto":"Canto",
  "level-up-growth":"Level-Up Growth", "armies-allegiance":"Armies & Allegiance", "laguz-transformation":"Laguz Transformation",
  "terrain-texture-rendering":"Terrain Texture Blending", "weather":"Weather",
  "developer-debug-tools":"Developer & Debug Tools", "event-flags":"Event Flags"
};
function wl(id, label){ return `<a class="wl" href="#/${id}">${label || TITLES[id] || id}</a>`; }

const ARTICLES = {

/* ------------------------------------------------------------------ META */

main: {
  ns:"meta", title:"Main Page", dek:"A field reference to how Fire Emblem: Path of Radiance stores itself",
  infobox:null,
  categories:["Portal"],
  body: `
  <p>The <strong>Tellius Archive</strong> documents, at the byte level, how <em>Fire&nbsp;Emblem: Path of Radiance</em> (GameCube, 2005) stores its data and how the systems built from that data work: how a chapter script decides when a cutscene plays, how a class's promotion bonus is computed, and how a battle animation is selected for a given weapon.</p>
  <p>Two kinds of article make up the archive. <strong>File format</strong> articles describe a container or record layout byte-for-byte — offsets, field widths, what a pointer resolves to. <strong>Game system</strong> articles describe a mechanic in play — classes, skills, chapters, music — and link back down to whichever files implement it. Most systems draw on more than one format at once; most formats serve more than one system.</p>
  <p>Start with ${wl("disc-layout","Disc & File Layout")} for a tour of the extracted game, ${wl("format-coverage","File Format Index")} for a completeness-oriented catalog, or ${wl("sources","Documentation Conventions")} for identifiers, offsets, and confidence labels.</p>

  <div class="confidence-key">
    ${badge("confirmed","Confirmed")} — checked against every real occurrence, zero exceptions
    ${badge("strong","Strong evidence")} — a very high hit rate, or independent corroboration
    ${badge("plausible","Plausible")} — a reasonable reading with no counter-evidence
    ${badge("open","Open question")} — a real, named gap
  </div>

  <div class="stat-strip">
    <div class="stat"><b id="statFormats">&mdash;</b><span>Format articles</span></div>
    <div class="stat"><b id="statSystems">&mdash;</b><span>System articles</span></div>
    <div class="stat"><b>4,422</b><span>.ga files fully decoded</span></div>
    <div class="stat"><b>98</b><span>skill records indexed</span></div>
  </div>

  <h2 style="border:none;margin-top:8px">How to use this archive</h2>
  <p>Begin with the player-facing system you want to understand, follow its links down to the formats that supply data, then return through related-system links to see where those values are consumed. Use the format index instead when starting from an unknown file.</p>
  <h2 style="border:none;margin-top:8px">File formats</h2>
  <div class="portal-grid" id="homeFormats"></div>
  <h2 style="border:none">Game systems</h2>
  <div class="portal-grid" id="homeSystems"></div>

  <div class="callout warn">
    <p class="callout-t">Scope</p>
    <p>Offsets and record sizes in this archive target the <strong>US release of Path of Radiance</strong>. ${wl("unexplored","Radiant Dawn")} shares the engine, but its layouts and mechanics require separate documentation.</p>
  </div>
  `
},

unexplored: {
  ns:"meta", title:"Open Questions", dek:"Known limits in the current description of formats and mechanics",
  infobox:{ type:"Portal", status:"open", fields:[["Scope","File- and mechanic-level gaps"],["Executable","Partially mapped"]] },
  categories:["Portal","Open questions"],
  body:`
  <p>This page records the boundaries of the current game description. An open item means the archive can identify the containing format or subsystem but cannot yet assign a reliable meaning to the listed fields or behavior.</p>

  <h2>What an open question means</h2>
  <p>These entries are boundaries, not invitations to guess. A reader can rely on the documented container, location, and observed structure, but should avoid assigning gameplay meaning beyond the stated confidence. Follow the linked article for the established surrounding model.</p>
  <h2>Payloads not decoded field-by-field</h2>
  <ul>
    <li><code>zbg/</code>'s 3D battle scenery, beyond what ${wl("model-formats",".g/.gs/.ga")} already covers.</li>
    <li>The units of the numeric values in the <code>zdbx.cmp</code> tables (speeds, ranges, camera times); the tables themselves are read (see ${wl("zdbx","ZDBX & DBX")}).</li>
  </ul>

  <h2>Partially described formats</h2>
  <ul>
    <li><code>tut_data.bin</code> / <code>tut_data_en.bin</code> — the same labeled-section container; per-chapter trigger data and the ${wl("tutorial-browser","tutorial browser")} topic/list ownership are identified, but several record fields still need names.</li>
  </ul>

  <h2>Unidentified payload</h2>
  <p><code>client.bin</code> — mostly high-entropy bytes with a couple of disc-identifier strings (<code>AFEJ01</code>, <code>FIREEMBLEM6</code>); more likely save-data structure or region metadata than moddable content.</p>

  <h2>Open mechanical questions</h2>
  <table><thead><tr><th>Question</th><th>Status</th><th>Article</th></tr></thead><tbody>
    <tr><td>What are the actual support-bonus numbers?</td><td>${badge("open","open")}</td><td>${wl("support-system")}</td></tr>
    <tr><td>Exactly what script code reads a battle-goal marker's state?</td><td>${badge("open","open")}</td><td>${wl("objectives")}</td></tr>
    <tr><td>What does the Boots' item property <code>noneart</code> change in play?</td><td>${badge("open","open")}</td><td>${wl("items-weapons")}</td></tr>
    <tr><td>Which battle-event code triggers the hit and damage number, and what do the codes from 1,000 up play?</td><td>${badge("plausible","partial")}</td><td>${wl("model-formats")}</td></tr>
    <tr><td>What is the second, greyscale texture the Prologue scenery's materials point to, and what do shape flags <code>0x8</code> and <code>0x200</code> do?</td><td>${badge("open","open")}</td><td>${wl("model-formats")}</td></tr>
    <tr><td>What do map-model registry bytes <code>0x09</code> and <code>0x0B</code> mean, and which class field supplies the animation ID of a unit whose character has none?</td><td>${badge("open","open")}</td><td>${wl("fe8anim","FE8Anim.bin")}</td></tr>
  </table>

  <h2 id="rd">Radiant Dawn</h2>
  <p>The largest gap of all: nothing in this archive has been checked against Radiant Dawn, the Wii sequel sharing this same engine. Its disc structure looks similar at a glance, but table offsets, record sizes, and whole mechanics could differ in ways nothing here would catch.</p>
  `
},

sources: {
  ns:"meta", title:"Documentation Conventions", dek:"How to read offsets, identifiers, confidence labels, and unresolved fields",
  infobox:{ type:"Reader guide", status:"confirmed", fields:[["Default region","US"],["Byte order","Big-endian"],["Offsets","Hexadecimal unless stated"]] },
  categories:["Portal","Reference"],
  body:`
  <p>Numbers prefixed with <code>0x</code> are hexadecimal. Multi-byte integers in game files are big-endian unless an article explicitly says otherwise. A record-relative offset starts at the beginning of one record; a file-relative offset starts at byte zero of the file; a header-relative pointer must have the documented header base added before it becomes a file position.</p>
  <h2>How to read an address or identifier</h2>
  <p>First identify the base named by the article, then apply the displayed offset in hexadecimal and decode the stated width and byte order. For a symbolic value, use its prefix to determine the target namespace before following the pointer or lookup.</p>
  <h2>Identifier prefixes</h2>
  <table><thead><tr><th>Prefix</th><th>Meaning</th></tr></thead><tbody><tr><td><code>PID_</code></td><td>Character or person</td></tr><tr><td><code>JID_</code></td><td>Class or job</td></tr><tr><td><code>IID_</code></td><td>Item or weapon</td></tr><tr><td><code>SID_</code></td><td>Skill, permission, or unit trait</td></tr><tr><td><code>EID_</code></td><td>Visual effect</td></tr><tr><td><code>BGM_</code>/<code>SFX_</code></td><td>Audio cue</td></tr><tr><td><code>gf_</code></td><td>Global script flag</td></tr></tbody></table>
  <h2>Confidence labels</h2>
  <p>${badge("confirmed","Confirmed")} marks a relationship that behaves consistently across its applicable data or native paths. ${badge("strong","Strong evidence")} marks a stable interpretation with limited remaining ambiguity. ${badge("plausible","Plausible")} marks a useful working interpretation that should not be treated as final. ${badge("open","Open question")} marks a field or behavior whose meaning is not yet established.</p>
  <p>Unknown bytes are left unknown. Their position, width, observed range, and correlations may still be documented without assigning them a speculative name.</p>
  <h2>How the archive stays current</h2>
  <p>Documentation changes with the technical understanding of the game. Confirmed discoveries are added to the relevant system or format article during the same work session; replaced hypotheses are corrected instead of retained as competing descriptions. Focused research notes may preserve additional evidence, but this archive and the canonical game reference carry the current reader-facing conclusion.</p>
  <p>Regional identity is always part of an executable address. NTSC-U <code>GFEE01</code> and PAL <code>GFEP01</code> addresses are not interchangeable: a cross-region match requires an instruction signature, caller relationship, named resource, or observed behavior, followed by verification in the target executable.</p>
  `
},

/* ------------------------------------------------------------------ FORMATS */

lz10: {
  ns:"format", title:"LZ10", dek:"Nintendo's “type 0x10” LZ77 compression scheme",
  infobox:{ type:"Compression algorithm", status:"confirmed", fields:[
    ["Applies to","Any <code>.cmp</code> file"],["Family","LZ77 (Nintendo type 0x10)"],
    ["Standard","Yes — a real, documented Nintendo scheme"],["Output","Raw data, or a <code>Pack Archive</code>"],
    ["Header","Type byte + 24-bit uncompressed size"]
  ]},
  categories:["Compression","Container"],
  body:`
  <p>Any file on the disc ending in <code>.cmp</code> is compressed with Nintendo's LZ77 variant commonly nicknamed <strong>“type 0x10”</strong> after its header byte — a standard, documented Nintendo scheme used across many GBA/GameCube/Wii titles, not specific to this game. Decompressing a <code>.cmp</code> file produces either raw data directly, or — more often in practice — a ${wl("pack-archive","pack archive")} bundling several files together.</p>
  <p>The scheme is a classic sliding-window compressor. The first byte is <code>0x10</code>; the next three bytes store the uncompressed size in little-endian order. The body is divided into groups controlled by a flag byte. A zero flag bit means the next byte is copied literally. A one bit means the next two bytes encode a length of 3–18 bytes and a backward distance of 1–4096 bytes into data already produced.</p>
  <p>Every game resource inside a <code>.cmp</code> wrapper — ${wl("pack-archive")}, ${wl("dispo-format")}, ${wl("map-format")}, portrait files, <code>title.cmp</code>, and <code>system.cmp</code> — passes through this layer first.</p>
  <h2>How to read an LZ10 stream</h2>
  <p>Read the declared output size, then consume each flag byte from its highest bit to its lowest. Literal tokens append one source byte. Back-reference tokens copy from the output already produced and may overlap their own destination, which is how a short pattern expands into a longer run. Stop when the declared output size has been produced; archive boundaries belong to the decompressed payload, not to LZ10.</p>
  <h2>Example and common pitfall</h2>
  <p>If a back-reference says “copy 6 bytes from 3 bytes behind,” the decoder repeats the preceding three-byte pattern twice because copying proceeds one output byte at a time. Do not decode the distance against the compressed input position, and do not assume every decompressed result is a pack archive—portraits can expand directly to TPL data.</p>
  <h2>Known limits</h2><p>The compression format itself is complete. What follows it must be identified from the decompressed payload's magic or expected resource path.</p>
  `
},

"pack-archive": {
  ns:"format", title:"Pack Archive", dek:"A small, purpose-built ZIP-alike with no compression of its own",
  infobox:{ type:"Archive container", status:"confirmed", fields:[
    ["Magic","<code>pack</code> (4 bytes, literal ASCII)"],["Compression","None — handled one layer up by <code>LZ10</code>"],
    ["Alignment","32-byte content padding"],["Used by","<code>Dispo Format</code>, <code>Map Format</code>, <code>.g/.gs/.ga</code> bundles"],
    ["Module","<code>pak.py</code>"]
  ]},
  categories:["Container"],
  body:`
  <p>Many <code>.cmp</code> files, once passed through ${wl("lz10")}, turn out to hold not raw data but a second, small archive format beginning with the literal bytes <code>pack</code>. It holds a table of name/offset/length entries followed by the actual file contents, each entry padded out to a 32-byte boundary — nothing more sophisticated than that; whatever compression already happened one layer up is the only compression involved.</p>
  <p>Three real bundling patterns use it: a chapter's ${wl("dispo-format","deployment data")} packs its four unit files (<code>dispos_c.bin</code>, <code>_n</code>, <code>_h</code>, <code>_m</code>) into one archive; a chapter's ${wl("map-format","map data")} packs <code>map.bin</code> alongside that same chapter's 3D scenery models, traveling together because the map references them by name; and a character or object's ${wl("model-formats","skeleton/mesh/animation trio")} (<code>skeleton.g</code>, <code>body.gs</code>, one <code>.ga</code> per battle animation) packs into a single <code>pack.cmp</code> per class.</p>
  <p>Each directory entry preserves the filename, content offset, and content length. Payload starts are padded to 32-byte boundaries; padding is not part of the recorded file length.</p>
  <h2>How extraction works</h2><p>After LZ10 is removed, verify the <code>pack</code> magic, read the directory, resolve every payload from its recorded offset and length, and ignore alignment bytes between entries. The filename describes the child resource but does not change its format.</p>
  <h2>Worked example</h2><p>For <code>dispos.cmp</code>, LZ10 produces one pack whose entries are the four unit files. Reading a unit group means opening one of them, such as <code>dispos_n.bin</code>, and then parsing that child as ${wl("labeled-section","labeled sections")}; reading the outer archive alone reveals filenames, not units.</p>
  <h2>Do not confuse layers</h2><p>Pack performs grouping, LZ10 performs compression, and the child file supplies semantics. Rebuilding one layer requires updating that layer's lengths and alignments before applying the outer layer again.</p>
  `
},

"labeled-section": {
  ns:"format", title:"Labeled Section Format", dek:"The engine's own general-purpose container for named, string-labeled data",
  infobox:{ type:"Container format", status:"confirmed", fields:[
    ["Header size","0x20 bytes"],["Used by","<code>Dispo Format</code>, <code>Map Format</code>, <code>Shop Format</code>, <code>Rect*.bin</code>, <code>tut_data*.bin</code>"],
    ["Relocation table","Applied by the loader at load time"],["Origin","HAL sysdolphin archive (<code>HSDArc</code>)"],["Module","<code>common.py</code>"]
  ]},
  categories:["Container"],
  body:`
  <p>The game's own hand-rolled general-purpose container, reused for several kinds of data — chapter deployments, chapter maps, shop inventories — that otherwise share nothing in common. Once recognized, the shape is unmistakable everywhere it appears:</p>
  <ol>
    <li>A 0x20-byte header: the file's exact size, the size of everything from <code>0x20</code> to the end of the <em>label pool</em>, the number of relocation entries, the number of sections, then an import count, an unused word and eight bytes the loader fills in memory (all zero on disc).</li>
    <li>The format's own records, from <code>0x20</code>.</li>
    <li>The label pool itself — plain, NUL-terminated ASCII strings: internal names for characters, classes, items, skills, AI behaviors, chapter identifiers. Almost every 4-byte value elsewhere in one of these files is a <em>pointer into this pool</em>, not a raw number.</li>
    <li>A <strong>relocation table</strong> — an ascending list of every earlier position that points into the pool.</li>
    <li>A <strong>section table</strong> — named regions of actual record data, one (address, name offset) pair per section, followed by the names.</li>
  </ol>
  <div class="table-wrap"><table><thead><tr><th>Offset</th><th>Size</th><th>Field</th><th>Meaning</th></tr></thead><tbody>
    <tr><td><code>0x00</code></td><td>4</td><td><code>filesize</code></td><td>Total file size</td></tr>
    <tr><td><code>0x04</code></td><td>4</td><td><code>data_size</code></td><td>Size from <code>0x20</code> to the end of the label pool</td></tr>
    <tr><td><code>0x08</code></td><td>4</td><td><code>relocation_count</code></td><td>Entries in the relocation table</td></tr>
    <tr><td><code>0x0C</code></td><td>4</td><td><code>section_count</code></td><td>Entries in the section table</td></tr>
    <tr><td><code>0x10</code></td><td>4</td><td><code>import_count</code></td><td>Entries of an extra 8-byte table before the names; 0 in every file</td></tr>
    <tr><td><code>0x14</code></td><td>4</td><td>&mdash;</td><td>Zero, never read</td></tr>
    <tr><td><code>0x18</code></td><td>8</td><td>&mdash;</td><td>Zero on disc. In memory the loader writes <code>HSDArc</code> at <code>0x18</code> once the pointers are relocated, and sets <code>0x1F</code> once the sections are registered by name</td></tr>
  </tbody></table></div>
  <div class="callout">
    <p class="callout-t">The relocation table, solved</p>
    <p>The table is an ascending list of every 4-byte-aligned field position whose stored value resolves to a valid label. This rule reproduces each stored relocation entry exactly. When the file loads, the game adds the file's data address to every listed field, turning offsets into pointers; a field left off the list stays a raw offset. ${badge("confirmed","engine")}</p>
  </div>
  <p>The layout is HAL Laboratory's sysdolphin archive, the format behind Super Smash Bros. Melee's <code>.dat</code> files: the loader checks and stamps the signature <code>HSDArc</code>. ${wl("fe8data")} and the message files use the same container. ${badge("confirmed","engine")}</p>
  <p>Compare against ${wl("fe8anim","FE8Anim.bin and FE8Effect.bin")}, which share the label-pool idea but start their data section with a record count.</p>
  <h2>Mental model: records point to names</h2><p>Most record fields do not embed <code>PID_IKE</code> or <code>IID_IRONSWORD</code>. They store an address into one shared string pool. The relocation table catalogs the locations of those address-bearing fields, while the section table says where groups of records begin.</p>
  <h2>Worked edit</h2><p>Replacing one pointer with another existing same-file label can preserve file size. Adding a new label grows the pool and moves the relocation and section tables; their addresses and any affected pointers must be rebuilt together. Copying a record to a new position likewise changes the set of pointer locations that belongs in the relocation table.</p>
  <h2>Known limits</h2><p>The container layout and relocation rule are confirmed. Individual section payloads still require their own format article; a valid labeled-section parse does not prove that every byte inside each record is understood.</p>
  `
},

"tpl-texture": {
  ns:"format", title:"TPL Texture", dek:"GameCube/Wii's native texture container, in nine of its pixel-format variants",
  infobox:{ type:"Image format", status:"confirmed", fields:[
    ["Standard","Yes — Nintendo GX texture spec"],["Formats used","9 of the GX enum's variants"],
    ["Palette formats","RGB5A3 (common), RGB565 (rare)"],["Module","<code>tpl.py</code>"]
  ]},
  categories:["Graphics"],
  body:`
  <p>TPL is GameCube/Wii's native texture container—part of the standard GX texture specification and not specific to this game. A file can hold several images, each tagged with its own pixel format. Path of Radiance uses <strong>nine</strong> variants across its complete texture set.</p>
  <div class="table-wrap"><table><thead><tr><th>ID</th><th>Format</th><th>Bits/px</th><th>Palette</th><th>Where it's used</th></tr></thead><tbody>
    <tr><td class="num">14</td><td><code>CMPR</code></td><td class="num">4</td><td>No</td><td>Full-screen images — chapter backgrounds</td></tr>
    <tr><td class="num">9</td><td><code>C8</code></td><td class="num">8</td><td>Yes (256)</td><td>Character portraits; several images per file often share <em>one</em> palette</td></tr>
    <tr><td class="num">8</td><td><code>C4</code></td><td class="num">4</td><td>Yes (16)</td><td>Smaller UI art</td></tr>
    <tr><td class="num">0</td><td><code>I4</code></td><td class="num">4</td><td>No</td><td>Plain grayscale UI art</td></tr>
    <tr><td class="num">2</td><td><code>IA4</code></td><td class="num">8</td><td>No</td><td>Grayscale + alpha, 4+4 bit — soft/transparent edges</td></tr>
    <tr><td class="num">3</td><td><code>IA8</code></td><td class="num">16</td><td>No</td><td>Grayscale + alpha, 8+8 bit</td></tr>
    <tr><td class="num">4</td><td><code>RGB565</code></td><td class="num">16</td><td>No</td><td>Full color, opaque only — incl. the title-screen logo</td></tr>
    <tr><td class="num">5</td><td><code>RGB5A3</code></td><td class="num">16</td><td>No</td><td>Color + alpha as a direct pixel format — small map icons</td></tr>
    <tr><td class="num">6</td><td><code>RGBA8</code></td><td class="num">32</td><td>No</td><td>Full RGBA; unusual tiling (below) — translucent UI panels</td></tr>
  </tbody></table></div>
  <div class="callout"><p class="callout-t">RGB5A3 has two pixel layouts</p><p>Bit 15 selects the layout. When set, the remaining 15 bits are opaque RGB555. When clear, the word stores 3-bit alpha plus 4 bits each of red, green, and blue. C8 and C4 images store palette indexes; their palette entries may use this same RGB5A3 encoding.</p></div>
  <p>RGBA8 uses a distinctive 4×4 tiled layout: each tile stores all alpha/red pairs first, followed by all green/blue pairs. See ${wl("rect-format")} for how full-screen images are named, animated and shown.</p>
  <h2>How an image reaches the screen</h2><p>A TPL image header selects dimensions, pixel format, and possibly a palette. The renderer interprets pixels in GX tiles rather than ordinary left-to-right rows. The surrounding game system chooses the TPL resource—portrait, background, UI element, or icon—and may first remove an LZ10 wrapper.</p>
  <h2>Worked replacement</h2><p>Replacing a C8 portrait image means resizing to the slot dimensions, mapping each new pixel to the existing shared palette, tiling indexes in C8 order, and recompressing the containing <code>.cms</code>. Regenerating a palette for only one image can recolor sibling mouth or eye frames that point to the same palette.</p>
  <h2>Known limits</h2><p>The nine pixel formats listed here are decoded. Resource-specific animation timing, icon indexing, and UI placement belong to their consumer formats rather than TPL itself.</p>
  `
},

fe8data: {
  ns:"format", title:"FE8Data.bin", dek:"The shared definitions from which characters, classes, items, and skills are built",
  infobox:{ type:"Data table &middot; uncompressed", status:"confirmed", fields:[
    ["Header size","0x20 (pointer-relative)"],["Sections","13 named sections"],
    ["Main tables","340 characters, 115 classes, 189 items, 98 skills"],["Also holds","Chapters, terrain, battle scenes, supports, difficulty constants"],
    ["Location","<code>files/FE8Data.bin</code>"]
  ]},
  categories:["Core data","Balance"],
  body:`
  <p><strong>FE8Data.bin is the game's catalog of reusable definitions.</strong> It answers questions such as “What are Ike's personal growths?”, “What can a Ranger equip?”, “How much might does an Iron Sword have?”, and “Which parameters belong to Sol?” It does not store the current HP of the Ike in a save or where an enemy stands in a chapter; those are mutable runtime and deployment data.</p>
  <h2>How the four main tables work together</h2>
  <p>Four tables hold the cast and its equipment:</p>
  <ul><li>A <strong>character</strong> record identifies a person and links to a starting class, portrait, personal skills, bonuses, and growths.</li><li>A <strong>class</strong> record defines shared movement, weapon access, caps, innate skills, and promotion relationships.</li><li>An <strong>item</strong> record defines a weapon or usable item's identity and mechanical properties.</li><li>A <strong>skill</strong> record defines a skill identifier, display/help keys, restrictions, and behavior parameters.</li></ul>
  <p>The records refer to one another through labels such as <code>PID_IKE</code>, <code>JID_RANGER</code>, <code>IID_IRONSWORD</code>, and <code>SID_SUNTRICK</code>. A stored pointer leads into the file's label pool; the readable label is the stable identity used across other files.</p>
  <h2>Example — resolving Ike</h2>
  <ol><li>Read the first character record and resolve its <code>PID_</code> pointer to <code>PID_IKE</code>.</li><li>Resolve its <code>JID_</code> pointer to <code>JID_RANGER</code>.</li><li>Use the class table to find Ranger's movement, weapon ranks, caps, and innate skills.</li><li>Resolve personal <code>SID_</code> pointers through the skill table.</li><li>When a chapter deploys <code>PID_IKE</code>, the engine combines these definitions with that chapter's inventory and position and the save's mutable progression.</li></ol>
  <div class="callout"><p class="callout-t">Do not treat FE8Data.bin as a save file</p><p>The file defines templates shared by every new game and chapter. Current HP, gained experience, consumed durability, temporary status, and chapter position belong to runtime/save structures.</p></div>
  <h2>Physical layout</h2>
  <p><code>FE8Data.bin</code> is uncompressed and sits directly under <code>files/</code>; there is no LZ10 or ${wl("pack-archive","pack")} layer. “FE8” is an internal filename retained by the released game. The offsets below apply to the US release.</p>
  <div class="table-wrap"><table><thead><tr><th>Table</th><th>Start</th><th>Record size</th><th>Count</th><th>Detail article</th></tr></thead><tbody>
    <tr><td>Characters</td><td><code>0x30</code></td><td><code>0x54</code> (84B)</td><td class="num">340</td><td>${wl("characters")}</td></tr>
    <tr><td>Classes</td><td><code>0x6FC4</code></td><td><code>0x64</code> (100B)</td><td class="num">115</td><td>${wl("classes")}</td></tr>
    <tr><td>Items</td><td><code>0x9CB4</code></td><td><code>0x60</code> (96B)</td><td class="num">189</td><td>${wl("items-weapons")}</td></tr>
    <tr><td>Skills</td><td><code>0xE398</code></td><td><code>0x28</code> (40B)</td><td class="num">98</td><td>${wl("skills")}</td></tr>
    <tr><td>Terrain types</td><td>symbol <code>TerrainData</code> + 4</td><td><code>0x0C</code> (12B)</td><td class="num">77</td><td>below</td></tr>
  </tbody></table></div>
  <p>The file is a named-section container: after the <code>0x20</code>-byte header (file size, data size, pointer count, symbol count) come the data, the list of every pointer field, and a table naming each section. A table's name points at a 4-byte record count; the records follow it. ${badge("confirmed","engine")}</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Section</th><th>Holds</th></tr></thead><tbody>
    <tr><td><code>DatabaseHead</code></td><td>The build time (<code>2005/06/29 10:11:21</code>) and author (<code>金子</code>, Kaneko), printed to the debug console at boot</td></tr>
    <tr><td><code>PersonData</code>, <code>JobData</code>, <code>ItemData</code>, <code>SkillData</code></td><td>Characters, classes, items, skills; each skill's scroll and restriction lists follow the skill records</td></tr>
    <tr><td><code>DivineData</code>, <code>RelianceData</code>, <code>KiznaData</code></td><td>Affinity bonuses, support lists and bonds (${wl("support-system")})</td></tr>
    <tr><td><code>GameData</code></td><td>Seven difficulty constants, below</td></tr>
    <tr><td><code>TerrainData</code></td><td>Terrain types and their stats blocks, below</td></tr>
    <tr><td><code>BattleTerrData</code>, <code>BattleSkyData</code></td><td>Battle backdrops, below</td></tr>
    <tr><td><code>ChapterData</code></td><td>One record per chapter (${wl("chapters")})</td></tr>
    <tr><td><code>GroupData</code></td><td>The army names (${wl("armies-allegiance")})</td></tr>
  </tbody></table></div>
  <h2>Address convention</h2>
  <p>Record offsets and pointers use a base immediately after the 0x20-byte file header. To convert a documented header-relative position to an absolute file offset, add <code>0x20</code>. Multi-byte values are big-endian. Every eight-value stat block—growths, caps, and base/personal stats—uses <strong>HP, Str, Mag, Skl, Spd, Lck, Def, Res</strong> order.</p>
  <h2>Terrain types</h2>
  <p>The <code>TerrainData</code> table lists the 77 terrain types a map tile can have. Each record holds the Japanese name that ${wl("map-format","a map's tile records")} point to (<code>平地</code>), the message key of the name shown in the terrain window (<code>MT_平地</code>, “Plain”), and a pointer to a 24-byte stats block shared by similar types. The game finds a tile's type by matching its name against this table, then reads the block for the unit standing there. ${badge("confirmed","engine + in game")}</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Block bytes</th><th>Meaning</th></tr></thead><tbody>
    <tr><td class="num">0, 1, 2</td><td>Avoid, defence, resistance bonus ${badge("confirmed","in game")}</td></tr>
    <tr><td class="num">3, 4, 5</td><td>The same bonuses for units with a particular movement trait (plausibly fliers) ${badge("strong","engine")}</td></tr>
    <tr><td class="num">6</td><td>HP healed at the start of each turn, as a percentage of max HP: 10 on Heal, Healhedge, Throne, Castle and Fort ${badge("confirmed","engine")}</td></tr>
    <tr><td class="num">7</td><td>Object tile — roofs, trees, fences, small objects, buildings, holes, sandbags: the game never picks such a tile when it looks for the nearest free place to put a unit ${badge("strong","engine")}</td></tr>
    <tr><td class="num">8&ndash;22</td><td>Movement cost for each of 15 movement types; 255 = impassable ${badge("confirmed","in game")}</td></tr>
  </tbody></table></div>
  <p>A class's movement type — one byte of its record — picks which of the 15 cost columns its units use. ${badge("confirmed","engine")} The 77 terrain types share only 13 stat blocks, so the plain-floor types, for example, all read the same one. Two more well-formed blocks sit in the file with no terrain type pointing at them.</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Type</th><th>Classes</th><th>Different from foot soldiers</th></tr></thead><tbody>
    <tr><td class="num">0&ndash;2</td><td>Ike's Ranger and Hero; unpromoted and promoted infantry and archers</td><td>—</td></tr>
    <tr><td class="num">3, 4</td><td>Knight; General and Black Knight</td><td>Slower in desert and on shores and trails</td></tr>
    <tr><td class="num">5, 6</td><td>Mages and priests; sages and bishops</td><td>Desert costs 1</td></tr>
    <tr><td class="num">7, 8</td><td>Cavaliers; Paladins</td><td>Slower in thickets, desert and marsh</td></tr>
    <tr><td class="num">9</td><td>Pegasus, Falcon and Wyvern knights, bird laguz</td><td>Every terrain costs 1, water, cliffs and trees included</td></tr>
    <tr><td class="num">10, 11</td><td>Thieves; bandits and berserkers</td><td>Desert costs 1; bandits cross rivers and sea at 2</td></tr>
    <tr><td class="num">12, 13</td><td>Lion, Tiger and Cat; the three dragon tribes</td><td>Thickets cost 1; desert costs 1</td></tr>
    <tr><td class="num">14</td><td>The other laguz tiers, citizens, children</td><td>—</td></tr>
  </tbody></table></div>
  <p>Painted onto the Prologue, Thicket gave avoid 10 and defence 1 at a movement cost of 2; Talisman defence 3 and resistance 3; Heal and Trail avoid 10 and defence 1. The type named “Fort” (<code>砦</code>) has no bonus and blocks every unit: in Path of Radiance it is a building units cannot enter (152 tiles on chapters 6 and 9), while the healing tile is Heal (<code>回復</code>). Several types share a display name (<code>平地</code>, <code>平地２</code>... are all “Plain”). The Gate and the breakable door are looked up as the ordinary Door, and five types (Objective, Target, Sanctuary, Defend, Visit) mark chapter goals.</p>
  <h2>Difficulty constants</h2>
  <p><code>GameData</code> holds seven rows of four bytes, one per difficulty (Normal, Hard, Maniac, Easy). ${badge("confirmed","engine")}</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Row</th><th>N / H / M / E</th></tr></thead><tbody>
    <tr><td>Battle EXP mode bonus</td><td>20 / 15 / 30 / 30</td></tr>
    <tr><td>Battle EXP level constant</td><td>20 / 20 / 30 / 30</td></tr>
    <tr><td>Promoted effective-level bonus</td><td>0 / 0 / 0 / 0</td></tr>
    <tr><td>Boss EXP bonus</td><td>30 / 25 / 40 / 40</td></tr>
    <tr><td>Thief EXP bonus</td><td>20 / 20 / 30 / 30</td></tr>
    <tr><td>Transformed laguz growth bonus</td><td>10 / 13 / 10 / 10</td></tr>
    <tr><td>Class critical bonus</td><td>15 / 15 / 15 / 15</td></tr>
  </tbody></table></div>
  <p>See ${wl("combat-mechanics")} for how these enter the EXP formula.</p>
  <h2>Battle backdrops</h2>
  <p>The scene behind a battle depends on the map and on the terrain the fight takes place on. <code>BattleTerrData</code> has one row per map (<code>bmap01</code>&hellip;<code>bmap31</code>, the trial maps, the tutorial and three alternate maps) and, in each row, one battle-scene name per terrain type (<code>map01_woods</code>, <code>map04_ship</code>, <code>garia_woods</code>&hellip;). An empty entry falls back to the first row, <code>Map6</code>, the default for every map. <code>BattleSkyData</code> names the sky for each map weather (<code>sky_01</code>, <code>cloudy_01</code>, <code>night_01</code>, <code>sunset_01</code>, <code>sandstorm_01</code>&hellip;). ${badge("confirmed","engine")}</p>
  <h2>What to read next</h2>
  <p>Use ${wl("characters")} for the character-to-runtime-unit lifecycle, ${wl("classes")} for class capabilities and promotion, ${wl("items-weapons")} for item mechanics, and ${wl("skills")} for ownership and native behavior. Those pages explain meaning; this page provides the shared binary map.</p>
  <div class="callout warn">
    <p class="callout-t">Known limits</p>
    <p>Every byte has a known role. A few fields hold values the game never reads: one character word (always empty), two class bytes, a skill flag set on exactly the skills that have a scroll, three reserved skill bytes, and one header word. The class's menu name key is the only field whose use is inferred rather than traced. <code>system.cmp</code> also contains a copy of this file; the game loads that archive at boot and its file lookup searches loaded archives first, so the copy inside <code>system.cmp</code> is the one read. ${badge("strong","engine")}</p>
  </div>
  `
},

"dispo-format": {
  ns:"format", title:"Dispo Format", dek:"Who spawns on a map, as what class, carrying what — the file to edit for chapter design",
  infobox:{ type:"Record list &middot; <code>Labeled Section Format</code>", status:"confirmed", fields:[
    ["File","<code>zmap/bmapNN/dispos.cmp</code>"],["Files inside","dispos_c/n/h/m.bin (4, in one <code>pack</code>)"],
    ["Record size","0x6C bytes (108)"],["Fields/record","48"],["Write support","Yes"]
  ]},
  categories:["Chapter data","Editable"],
  body:`
  <p>Deployment data — who appears on a chapter's map, where, as what class, at what level, carrying what items, with what AI. Each <code>dispos.cmp</code> decompresses (${wl("lz10")}) to a ${wl("pack-archive","pack archive")} holding four ${wl("labeled-section","Labeled Section")} files, <code>dispos_c.bin</code>, <code>dispos_n.bin</code>, <code>dispos_h.bin</code> and <code>dispos_m.bin</code>, all loaded with the map. Their sections are named groups of units — <code>bmap02_mikata_c</code> (the player army), <code>bmap02_first_n</code> (the enemies at the start), <code>bmap02_z01_n</code> (a reinforcement wave) — each a list of fixed-size <strong>0x6C-byte, 48-field</strong> unit records.</p>
  <h2>Which groups appear</h2><p>Nothing appears by itself: the chapter's ${wl("events-scripting","event script")} deploys a group by name. A <code>_c</code> group is called directly and appears on every difficulty; the <code>_n</code>, <code>_h</code> and <code>_m</code> versions of a group are passed together to a helper that picks one by difficulty. A group that no script names is never seen.</p>
  <h2>How a record becomes a unit</h2><p>The game reads each record into a runtime placement record, then creates the unit: it looks up the character and class by name, puts the unit in its army, sets its level, grows it to that level with the class's growth rates when the record asks for autolevelling, adds the record's stat bonuses, gives it the items and skills, and sets its AI. The unit appears on the spawn tile and walks to the destination tile (the nearest free tile from it) — the Prologue's Ike appears at (6, 7) and walks to (3, 9); a unit that stands still has both tiles equal. Tiles use the map's full ${wl("map-grid","grid")}, border included; a record whose tiles fall outside the map is skipped.</p>
  <h2>Example: Chapter 1's boss</h2><p>Zawanar's record names his character and class, sets level 4, army 1 (enemy), autolevel, a flag on his first item (the one he drops), and stat bonuses of HP &minus;11, Str +6, Skl +1, Spd &minus;2, Def +3 on top of what autolevelling gives him.</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Field</th><th>Name</th><th>Meaning</th><th></th></tr></thead><tbody>
    <tr><td class="num">0 / 1</td><td><code>pid</code> / <code>jid</code></td><td>Character and class; no class means the character's own</td><td>${badge("confirmed","")}</td></tr>
    <tr><td class="num">2</td><td>&mdash;</td><td>Not read</td><td>${badge("confirmed","unused")}</td></tr>
    <tr><td class="num">3&ndash;10</td><td><code>item0..7</code></td><td>Inventory, up to eight items</td><td>${badge("confirmed","")}</td></tr>
    <tr><td class="num">11&ndash;15</td><td><code>skill0..4</code></td><td>Skills added to the character's and class's own</td><td>${badge("confirmed","")}</td></tr>
    <tr><td class="num">16&ndash;18</td><td>&mdash;</td><td>Not read</td><td>${badge("confirmed","unused")}</td></tr>
    <tr><td class="num">19&ndash;26</td><td><code>bonus_hp..res</code></td><td>Signed stat bonuses: HP, Str, Mag, Skl, Spd, Lck, Def, Res</td><td>${badge("confirmed","")}</td></tr>
    <tr><td class="num">27</td><td><code>laguz_gauge</code></td><td>Starting laguz gauge (nonzero values below 20)</td><td>${badge("confirmed","")}</td></tr>
    <tr><td class="num">28&ndash;30</td><td><code>seq_attack/move/heal</code></td><td>AI behavior scripts (<code>SEQ_*</code>, ${wl("cp-data-format","cp_data.bin")}) — always <code>SEQ_NO*</code> on player units</td><td>${badge("confirmed","")}</td></tr>
    <tr><td class="num">31</td><td><code>mtype</code></td><td>Movement AI (<code>MTYPE_*</code>, ${wl("cp-data-format","cp_data.bin")})</td><td>${badge("confirmed","")}</td></tr>
    <tr><td class="num">32&ndash;33</td><td><code>pos_x/y</code></td><td>Spawn tile</td><td>${badge("confirmed","")}</td></tr>
    <tr><td class="num">34&ndash;35</td><td><code>pos2_x/y</code></td><td>Tile the unit walks to after appearing</td><td>${badge("confirmed","")}</td></tr>
    <tr><td class="num">36</td><td><code>level</code></td><td>Level; when the class is the character's own and the character's base level is higher, the base level wins</td><td>${badge("confirmed","")}</td></tr>
    <tr><td class="num">37</td><td><code>faction</code></td><td>Army: 0 player, 1 enemy, 2 ally/other</td><td>${badge("confirmed","")}</td></tr>
    <tr><td class="num">38</td><td><code>flags</code></td><td><code>0x01</code> autolevel; <code>0x02</code> hold position; <code>0x04</code> commander of its army; <code>0x08</code> a reinforcement appears even if the character isn't in play; <code>0x40</code> cannot enter bridge-cover tiles (see below)</td><td>${badge("confirmed","")}</td></tr>
    <tr><td class="num">39</td><td><code>ai_order</code></td><td>Enemy-phase turn order: lower acts first (0 on player units, 0&ndash;81 on enemies)</td><td>${badge("confirmed","")}</td></tr>
    <tr><td class="num">40&ndash;47</td><td><code>item0..7_flag</code></td><td>A flag per item — set on the items bosses drop</td><td>${badge("strong","")}</td></tr>
  </tbody></table></div>
  <h2>Around the records</h2><p>A section starts with a 4-byte header: its unit count, a mode byte (4), a byte that lets units appear on occupied tiles, and the group's army (see below). After the sections come the label pool — the <code>PID_</code>/<code>JID_</code>/<code>IID_</code>/<code>SID_</code>/<code>SEQ_</code>/<code>MTYPE_</code> strings the records point at — then a relocation list of every place that holds such a pointer, then the section table and names. The first section of every file, <code>&lt;map&gt;_date_&lt;x&gt;</code>, holds no units: it points at a date string. Because the game looks labels up by their text, a record can name any character, class, item or skill in ${wl("fe8data")}; adding one means growing the pool and the relocation list and updating the header's sizes together.</p>
  <h2>The flags</h2><div class="table-wrap"><table class="tight"><thead><tr><th>Bit</th><th>Effect</th><th>Used on</th></tr></thead><tbody>
    <tr><td class="num"><code>0x01</code></td><td>Autolevel: the unit grows from its base stats to its level with the class's growth rates</td><td>Most generic enemies</td></tr>
    <tr><td class="num"><code>0x02</code></td><td>Hold position: the AI never moves the unit. It still attacks, heals or uses items from the tile it stands on. The same AI check also covers some status conditions</td><td>Cutscene actors and a few stationary enemies (Chapter 1's Zawanar)</td></tr>
    <tr><td class="num"><code>0x04</code></td><td>Commander: the leader of the unit's army (see below)</td><td>Ike in every player group, each chapter's boss</td></tr>
    <tr><td class="num"><code>0x08</code></td><td>A reinforcement appears even when the character is not already in play</td><td>Reinforcements</td></tr>
    <tr><td class="num"><code>0x40</code></td><td>Bridge-cover barrier: movement onto terrain 55 (&ldquo;bridge cover&rdquo;, normally cost 1) costs 48, more than any unit has</td><td>Every unit except fliers (Chapter 23's dragon and pegasus knights, Jill) and a few cutscene actors</td></tr>
    <tr><td class="num"><code>0x10</code>, <code>0x20</code></td><td>Let the AI use a Door Key (<code>0x10</code>) or a Chest Key (<code>0x20</code>); no vanilla record sets them</td><td>&mdash; ${badge("confirmed","")}</td></tr>
  </tbody></table></div>
  <h2>Armies and commanders</h2><p>The last byte of a group's header names its <strong>army</strong>: an index into the 30 army names in ${wl("fe8data")} (<code>GroupData</code>). Every unit the group deploys joins that army; 0 leaves the unit's army unchanged.</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Id</th><th>Army</th><th>Id</th><th>Army</th><th>Id</th><th>Army</th></tr></thead><tbody>
    <tr><td class="num">1</td><td>Crimean Army</td><td class="num">11</td><td>Begnion Army</td><td class="num">21</td><td>Prisoners</td></tr>
    <tr><td class="num">2, 3</td><td>Daein Army</td><td class="num">12</td><td>Stray pegasus knights</td><td class="num">22</td><td>Begnion reinforcements</td></tr>
    <tr><td class="num">4</td><td>Gallia Army</td><td class="num">13</td><td>Merchant caravan</td><td class="num">23</td><td>Militia</td></tr>
    <tr><td class="num">5</td><td>Bandits</td><td class="num">14</td><td>Laguz Liberation Army</td><td class="num">24</td><td>Tanith's reinforcements</td></tr>
    <tr><td class="num">6</td><td>Pirates</td><td class="num">15</td><td>Duke Tanas's army</td><td class="num">25</td><td>Mysterious army</td></tr>
    <tr><td class="num">7</td><td>Elincia's reinforcements</td><td class="num">16</td><td>Thieves</td><td class="num">26</td><td>Daein remnants</td></tr>
    <tr><td class="num">8</td><td>Tanith's reinforcements</td><td class="num">17</td><td>Kilvas Army</td><td class="num">27</td><td>Mysterious force</td></tr>
    <tr><td class="num">9</td><td>Kariwa bandits</td><td class="num">18</td><td>Phoenicis Army</td><td class="num">28</td><td>Fighters</td></tr>
    <tr><td class="num">10</td><td>Greil Mercenaries</td><td class="num">19</td><td>Truly unaffiliated</td><td class="num">29</td><td>Heron clan</td></tr>
    <tr><td></td><td></td><td class="num">20</td><td>Palmeny monks</td><td class="num">30</td><td>Stray mercenaries</td></tr>
  </tbody></table></div>
  <p>(Names translated from the Japanese keys; the game shows the text of its message files.) The map's army list sorts units by army, and the living unit flagged <code>0x04</code> is that army's commander. A commander with ${wl("skills","Charisma")} gives the units of its own army within 3 tiles +5 Hit and +5 Avoid (never on the player side); each enemy with Horror within 3 tiles takes 5 off Hit and Critical. Player groups use 10 (Greil Mercenaries) early on, then 1 (Crimean Army). Event scripts read and change a unit's army with <code>UnitGet</code>/<code>UnitSet</code> field 38, and a unit moved to another side by <code>UnitTransferToForce</code> takes that side's army. ${badge("confirmed","engine")}</p>
  <h2>Enemy turn order</h2><p>At the start of each AI phase the game scores every unit of the acting side and moves them lowest score first. Field 39 fills the top of the score, so it sets the order outright. Among units with the same value, faster units and units carrying staves or weaker weapons go earlier. Vanilla leaves most units at 0 and gives higher numbers to later waves and bosses, so reinforcements and commanders act after the front line.</p>
  <p>See ${wl("chapters")} for how this file fits together with the other three per-chapter files, and ${wl("characters")}/${wl("skills")} for what a resolved <code>PID_</code>/<code>SID_</code> value means at the game-system level.</p>
  `
},

"map-format": {
  ns:"format", title:"Map File Format", dek:"Terrain, placed 3D scenery, tile elevation, and lighting for one chapter",
  infobox:{ type:"Record list &middot; <code>Labeled Section Format</code>", status:"confirmed", fields:[
    ["File","<code>zmap/bmapNN/map.cmp</code>"],["Unpacks to","<code>map.bin</code> + that chapter's 3D models, in one <code>pack</code>"],
    ["Sections","13 named sections"],["Write support","Record fields only"]
  ]},
  categories:["Chapter data","Editable"],
  body:`
  <p>A chapter map defines terrain, placed scenery, tile elevation, lighting, fog, and invisible objective markers. Decompressing <code>map.cmp</code> produces a ${wl("pack-archive","pack archive")} containing <code>map.bin</code> and the chapter's 3D scenery models, allowing object records to refer to companion models by filename.</p>
  <h2>How the sections build a battlefield</h2><p><code>mapcapacity</code> establishes dimensions; object descriptions define reusable things; instance records place them; three panel layers describe tile-corner elevation; sparse link grids add per-tile blocking/status bits; and single-record lighting/fog/extra sections set presentation and runtime grid margins. Unit deployment is separate and uses the tactical grid.</p>
  <h2>Example: one tree model, many trees</h2><p>One <code>mapbuilddesc</code> can name the tree model and its footprint. Several <code>mapbuildinst</code> records can then place that same description at different positions and angles. Editing the description changes every instance; editing one instance moves only that placement.</p>
  <div class="table-wrap"><table><thead><tr><th>Section</th><th>Size</th><th>Contents</th></tr></thead><tbody>
    <tr><td><code>mapcapacity</code></td><td class="num">12B, 1 rec.</td><td>Grid size; <code>scale_unit</code> is an <strong>f32</strong> confirmed always exactly <code>2000.0</code></td></tr>
    <tr><td><code>mapbuilddesc</code></td><td class="num">32B/object</td><td>The model's bounding box as its minimum and maximum corners in (x, y, z) order, three flag-bit bytes, a type byte, model filename</td></tr>
    <tr><td><code>mapbuildinst</code></td><td class="num">12B/inst.</td><td>Placed-instance x/y/angle (unsigned byte; 64 = 270&deg; by the native formula), <code>mapbuilddesc</code> index, the rectangle of tiles the object covers after rotation, and a raw float32 height</td></tr>
    <tr><td><code>uniquepanel</code>/<code>Roof</code>/<code>Base</code></td><td class="num">12B/record</td><td>Four signed corner elevations, three layers (ground+object / ground alone / building); tiles share records through the <code>panelindex</code> grids, which hold 0-based record numbers. The ground layer sits at terrain height <code>&minus;elevation&nbsp;/&nbsp;400</code>. Each record also points to a terrain-type name (${wl("fe8data","TerrainData")}); the combined layer's name is the tile's terrain, the ground layer's the ground under objects ${badge("confirmed","files + in game")}</td></tr>
    <tr><td><code>maplink</code>/<code>maplinkAt</code>/<code>maplinkAbs</code></td><td class="num">sparse grids</td><td>Count followed by <code>(x, y, value)</code> entries; together they form per-tile status/blocking bitfields</td></tr>
    <tr><td><code>maplight</code>/<code>mapfog</code>/<code>mapgrid</code>/<code>mapextra</code></td><td class="num">1 rec. each</td><td>Ambient+directional light color, fog density/color, grid overlay color, tactical-grid margins and map-mode flags</td></tr>
  </tbody></table></div>
  <h2>Runtime loading</h2>
  <p>The native map loader copies the section payload image into RAM using the same offsets as <code>map.bin</code> after the first <code>0x20</code>-byte header. In live dumps, each chapter's <code>mapcapacity</code> bytes appear exactly once, and <code>mapextra</code> appears at <code>capacity_ram + (mapextra_file_offset - 0x20)</code>. This confirms that the loader preserves section layout while resolving named sections by pointer.</p>
  <h2><code>mapextra</code></h2>
  <p>The first eight bytes are eight independent bytes, not mixed 16-bit fields. Bytes 0 and 1 are the positive counterpart of the base terrain instance's negative placement coordinate in every checked chapter; bytes 2 and 3 are <code>ceil(x_size/2)</code> and <code>ceil(y_size/2)</code>; byte 5 is the confirmed tactical-grid buffer. The game uses that buffer to compute usable bounds as <code>min_x=min_y=buffer</code> and <code>max_x=x_size-buffer</code>, <code>max_y=y_size-buffer</code>. The trailing word is a set of map flags: its low bits switch on the terrain's texture overlay and the moving-water effect (bit <code>0x20</code>, set on every map with water and on none without), and two higher fields are map-mode values read at load. ${badge("confirmed","engine")}</p>
  <h2>Water</h2>
  <p>A map's water is its own model, <code>&lt;map&gt;_water0</code> (up to three on one map), placed at the terrain's origin: on the Prologue a flat, half-transparent plane two units below the ground. Its material, <code>map_water</code>, has two textures that scroll; the water object's animation file moves no bones and holds only a four-number table, the two textures' scroll speeds (the Prologue's river: −0.124, 0.360, −0.231, −0.572, times the map's clock). ${badge("confirmed","engine + files")} The surface covers exactly the tiles whose terrain type is river — the terrain types, not the model, decide where units can go. ${badge("strong","engine + files")}</p>
  <h2>Terrain texture stages</h2>
  <p>Chapter terrain can use several material texture stages and a second UV channel. Three-stage base terrain materials are common across the game's maps: the first two texture-stage records share one metadata pattern, while the third has a distinct light/shadow-like pattern and uses the second UV channel. The Prologue's base terrain material, for example, references three textures: a tall macro/detail atlas, a road/cliff blend mask, and a light/shadow overlay. See ${wl("terrain-texture-rendering")} for how a material's textures actually combine at render time.</p>
  <h2>Terrain mesh and tile heights</h2>
  <p>The land terrain model's vertices are world positions starting at <code>(0, 0)</code>, five units per tile; tile 0 of the tactical grid starts at five times the <code>mapextra</code> panel offset. Units stand on the elevations stored in the panel layers, not on the mesh itself, so the two only agree because the map's authors kept them in step: on the Prologue and chapter 1, every playable tile corner of the ground layer is at exactly <code>&minus;elevation&nbsp;/&nbsp;400</code> of the mesh height. ${badge("confirmed","files")} On later maps some tiles stand on props instead — bridges, castle floors and walls: counting placed props too, 98.6% of chapter 6's and 98.8% of chapter 11's tile corners lie on a surface.</p>
  <p>The move and attack grid is drawn from the same corner heights: one flat panel per tile half, each tile split along its top-right to bottom-left diagonal. Vanilla terrain follows those panels exactly in the playable area — every triangle there has its corners on tile corners (on flat ground one triangle may span two tiles, level with both), and split tiles use the same diagonal — so the grid lies on the ground. Placed props sit at their tile's surface through their own height value. A reshaped playable area therefore needs the three to move together: in the Prologue, a hill added to the ground, its tile heights and prop heights raised to match, and the ground cut and flattened onto the tile panels, played correctly, while the same hill with an uncut mesh showed ground through the grid where it bulged inside a tile. ${badge("confirmed","in game")}</p>
  <p>Tiles share panel records, so new heights need new records and the panel sections grow; everything after them in the file moves, together with every stored pointer and section address that refers to it.</p>
  <h2>Link grids</h2>
  <p>The three link sections are sparse because most tiles do not need an explicit value. Native loading applies <code>maplink</code>, then <code>maplinkAt</code>, then <code>maplinkAbs</code>; the last one replaces the cell with an absolute low nibble plus that nibble's inverse in bits 4&ndash;7. Low bits 0&ndash;3 are confirmed directional passability openings: west, east, south, north. A later native pass clears those openings if either corner on the shared edge differs from the neighboring tile by 400 height units or more. The higher status bits still need gameplay verification.</p>
  <div class="callout">
    <p class="callout-t">Placed-object flags, resolved</p>
    <p><strong>Map-wide object</strong> (bits 7&ndash;6): the object <em>is</em> the map's own base terrain/water-plane model, not merely large — every real object carrying it is literally named after its own map. ${badge("confirmed","confirmed")}<br>
    <strong>Has a matching animation file</strong> (bit 1 of a third flag byte): set exactly when a matching animation file exists across 873 objects. ${badge("confirmed","confirmed")}<br>
    <strong>Battle-goal type</strong> (a 3-bit field): a multi-value type recurring across chapters on invisible markers named for conditions such as “ascendancy,” “defense,” and “attainment.” ${badge("confirmed","confirmed")}</p>
  </div>
  <p>See ${wl("chapters")} for how this file's chapter-duplication story compares to ${wl("dispo-format","dispo's")}.</p>
  `
},

"event-script": {
  ns:"format", title:"Event Script", dek:"Compiled bytecode driving chapter setup, cutscene triggers, and win/lose conditions",
  infobox:{ type:"Bytecode &middot; uncompressed", status:"confirmed", fields:[
    ["File","<code>Scripts/CNN.cmb</code>, plus <code>startup.cmb</code> and <code>ending.cmb</code>"],["Opcodes","72 slots (<code>0x00</code>&ndash;<code>0x47</code>), 66 used"],
    ["Trigger types","16 (0&ndash;15)"],["Byte order","Little-endian records, big-endian operands"],["Real scripts checked","43 (all of them)"]
  ]},
  categories:["Chapter data","Editable","Scripting"],
  body:`
  <p>The compiled bytecode driving a chapter — setup, cutscene triggers, win/lose conditions. Not compressed or archived: a direct binary file per chapter, plus <code>startup.cmb</code> (helpers every chapter calls) and <code>ending.cmb</code>. Each function inside a script carries a <strong>trigger type</strong> (start of turn, start of phase, a unit reaching a tile, ...) and parameters controlling exactly when it fires; a stack-machine bytecode body does the actual work once triggered. See ${wl("events-scripting")} for how the engine runs it.</p>
  <p>For a step-by-step explanation of modules, event state, execution, timing and the boundaries of script-driven changes, read the <a href="../research/EVENT_SCRIPT_GUIDE.md">event script system guide</a>. Its scope is the researched US Path of Radiance executable; a registered function name alone does not establish all argument meanings or Radiant Dawn compatibility.</p>
  <h2>How a script function becomes an event</h2>
  <p>The engine evaluates a function's trigger and parameters; when eligible, it starts that function's stack-machine bytecode. Instructions manipulate values and branch locally, while external calls request native game operations. The format therefore stores both the condition and the response, but mutable chapter state lives outside the file.</p>

  <h2>File layout</h2>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Offset</th><th>Content</th></tr></thead><tbody>
    <tr><td class="num">0x00</td><td>Header (0x24 bytes): <code>"cmb\\0"</code>, the file name, a constant <code>0x20041125</code> at <code>+0x18</code>, a word the loader overwrites at <code>+0x20</code>, and the script's global-slot count at <code>+0x22</code></td></tr>
    <tr><td class="num">0x24</td><td>Offset of the string pool (always <code>0x2C</code>)</td></tr>
    <tr><td class="num">0x28</td><td>Offset of the function table</td></tr>
    <tr><td class="num">0x2C</td><td>String pool: NUL-separated Shift-JIS strings, padded to 4 bytes</td></tr>
    <tr><td>table</td><td>One 32-bit address per function, ended by a 0 word</td></tr>
    <tr><td>functions</td><td>Per function, 4-byte aligned: a 20-byte record, its trigger parameters, an optional name, then the code</td></tr>
  </tbody></table></div>
  <p>Header, table and record words are little-endian; instruction operands are big-endian. ${badge("confirmed","confirmed")}</p>

  <h2>Function record</h2>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Offset</th><th>Size</th><th>Field</th></tr></thead><tbody>
    <tr><td class="num">+0x00</td><td>4</td><td>Address of the function's name (0 = anonymous)</td></tr>
    <tr><td class="num">+0x04</td><td>4</td><td>Address of the code</td></tr>
    <tr><td class="num">+0x08</td><td>4</td><td>0 on disc; the loader stores the owning script here</td></tr>
    <tr><td class="num">+0x0C</td><td>1</td><td>Trigger type</td></tr>
    <tr><td class="num">+0x0D</td><td>1</td><td>Argument count</td></tr>
    <tr><td class="num">+0x0E</td><td>1</td><td>Trigger-parameter count</td></tr>
    <tr><td class="num">+0x0F</td><td>1</td><td>Unused</td></tr>
    <tr><td class="num">+0x10</td><td>2</td><td>Function index (its position in the table)</td></tr>
    <tr><td class="num">+0x12</td><td>2</td><td>Frame size: arguments plus local variables, in 4-byte slots</td></tr>
    <tr><td class="num">+0x14</td><td>2 &times; n</td><td>Trigger parameters</td></tr>
  </tbody></table></div>
  <p>The name, when present, follows the parameters (NUL-terminated, padded to 4); the code follows, padded with 1 to 4 bytes to the next 4-byte boundary. Padding and the unused byte are never read, and a few chapters hold leftover non-zero values there. A named function is registered globally when its script loads, so any loaded script can call it by that name.</p>

  <h2>Trigger types</h2>
  <p>Every trigger value across the 43 chapter scripts falls inside 0&ndash;15. Trigger parameters may be raw numbers, character identifiers, flag names, or debug labels resolved through the script's string pool (a label parameter of 0 means "none").</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Type</th><th>Trigger</th><th>Notable params</th></tr></thead><tbody>
    <tr><td class="num">0</td><td>None — runs only when called</td><td>—</td></tr>
    <tr><td class="num">1 / 2</td><td>Map goal achieved / failed</td><td>The watched flag (<code>gf_complete</code> / <code>gf_gameover</code>)</td></tr>
    <tr><td class="num">3 / 6</td><td>Before / after a phase starts</td><td>First and last turn, phase (0=player, 1=enemy, 3=partner) — raw numbers</td></tr>
    <tr><td class="num">4</td><td>A unit moves into a zone</td><td>Zone bounds, which side triggers, a resolved debug event-name</td></tr>
