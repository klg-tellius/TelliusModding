"font-format": {
  ns:"format", title:"Font", dek:"Five bitmap fonts: a glyph table over grayscale texture sheets",
  infobox:{ type:"File format", status:"confirmed", fields:[
    ["Location","<code>Fonts/*.gcf</code>, <code>Fonts/system.cms</code>"],["Header","0x30 bytes"],
    ["Glyph record","16 bytes, sorted by code"],["Sheets","GX I4, 128² or 256²"],["Fonts","5"]
  ]},
  categories:["Graphics"],
  body:`
  <p>Every piece of text the game draws, from dialogue to menu labels, comes from one of five bitmap fonts. A font file holds a small header, a table saying where each character sits, and one or more grayscale texture sheets holding the character images. The game has no other text source: a character missing from the font cannot be drawn.</p>

  <h2>The five fonts</h2>
  <p>Text refers to a font by number: the ${wl("message-format","message code")} <code>#F</code> switches between them mid-sentence, and menu code selects one directly. ${badge("confirmed","confirmed")}</p>
  <table><thead><tr><th>#</th><th>Name</th><th>File</th><th>Characters</th><th>What it looks like</th></tr></thead><tbody>
    <tr><td>0</td><td>system</td><td><code>Fonts/system.cms</code> (${wl("lz10","LZ10")})</td><td>3,988</td><td>The general UI font: full Japanese character set plus ASCII</td></tr>
    <tr><td>1</td><td>fe_font</td><td><code>Fonts/fe_font.gcf</code></td><td>95</td><td>The invented Tellius alphabet: calligraphic letters mapped onto the ASCII codes, so ordinary text in this font renders in the in-world script</td></tr>
    <tr><td>2</td><td>talk</td><td><code>Fonts/talk.gcf</code></td><td>4,005</td><td>The dialogue font: same character set as system, slightly taller</td></tr>
    <tr><td>3</td><td>bigkana</td><td><code>Fonts/bigkana.gcf</code></td><td>95</td><td>Large Latin serif (the name dates from the Japanese release)</td></tr>
    <tr><td>4</td><td>alpha</td><td><code>Fonts/alpha.gcf</code></td><td>77</td><td>Large condensed sans-serif: letters, digits and a little punctuation</td></tr>
  </tbody></table>
  <p>Fonts 1–4 are loaded at boot from copies bundled in <code>system.cmp</code>, which take priority over the loose files, so an edit has to reach both. The system font is loaded separately from the compressed <code>system.cms</code>. The disc also carries a loose <code>Fonts/system.gcf</code> that the game never loads. ${badge("confirmed","confirmed")}</p>

  <h2>File layout</h2>
  <table><thead><tr><th>Offset</th><th>Size</th><th>Field</th></tr></thead><tbody>
    <tr><td>0x00</td><td>4</td><td>Header size, always 0x20 (not read by the game)</td></tr>
    <tr><td>0x04</td><td>2</td><td>Highest character code in the table</td></tr>
    <tr><td>0x08</td><td>2</td><td>Ascent: pixels above the baseline</td></tr>
    <tr><td>0x0A</td><td>2</td><td>Descent: pixels below it (line height = ascent + descent)</td></tr>
    <tr><td>0x0C</td><td>2</td><td>Widest glyph, used as a fixed cell width for number columns ${badge("strong","strong")}</td></tr>
    <tr><td>0x10</td><td>4</td><td>Zero on disc; filled with the line height when loaded</td></tr>
    <tr><td>0x14</td><td>4</td><td>Bytes per sheet</td></tr>
    <tr><td>0x18</td><td>2</td><td>Texture format, 0 = I4 (4-bit grayscale)</td></tr>
    <tr><td>0x1A</td><td>2</td><td>Number of sheets</td></tr>
    <tr><td>0x1E / 0x20</td><td>2 + 2</td><td>Sheet width and height</td></tr>
    <tr><td>0x22</td><td>2</td><td>Offset of the glyph table (0x30)</td></tr>
    <tr><td>0x24</td><td>4</td><td>Offset of the first sheet; the glyph table ends here</td></tr>
    <tr><td>0x28</td><td>4</td><td>Total size of all sheets</td></tr>
  </tbody></table>
  <p>Unlisted header bytes are zero. After the table come the sheets back to back, and the file ends with the last one.</p>

  <h2>Glyph records</h2>
  <p>Each character is a 16-byte record: its code (2 bytes), sheet number, and the left and top pixel of its box on that sheet (2 bytes each); the box width and height (1 byte each); then three signed bytes: horizontal bearing, vertical bearing (how far the glyph top sits above the baseline), and advance (how far the pen moves afterwards). Three zero bytes pad the record. ${badge("confirmed","confirmed")}</p>
  <p>Codes are single bytes for ASCII and two bytes for Japanese characters, using the Windows code page 932 variant of Shift-JIS; the large fonts include its extra symbol row (circled numbers ①–⑳, Roman numerals, unit abbreviations). Unassigned codes in the large fonts hold a one-pixel dot.</p>

  <h2>How a character is found</h2>
  <p>The records are sorted by code and the game binary-searches them. If the character is not in the font, it tries the white star ☆ (code 0x8199) instead, and if that is missing too, it uses the first record, a space in every vanilla font. So a character missing from the dialogue font shows up as ☆, while one missing from the three small fonts simply disappears. ${badge("confirmed","confirmed")}</p>

  <h2>Drawing a glyph</h2>
  <p>To draw a character the game binds its sheet as a texture, draws the glyph box at <em>x</em> + horizontal bearing and <em>y</em> + ascent − vertical bearing, tints it with the current ${wl("message-format","#C colour")}, and moves right by the advance. The gray level of each pixel is its coverage.</p>

  <h2>Example</h2>
  <p>In the dialogue font the letter <code>A</code> (code 0x41) advances 13 pixels and every digit advances 12, so numbers line up in columns. The same <code>A</code> written in font 1 is drawn as a Tellius letter instead.</p>

  <h2>Which font is used where</h2>
  <p>Screen text is queued as 2D drawing commands; the kind of text command decides the font. Menus use one kind, the dialogue box another, and a <code>#F</code> code inside the text can switch fonts partway through. ${badge("confirmed","confirmed")}</p>
  <table><thead><tr><th>Font</th><th>Where it appears</th></tr></thead><tbody>
    <tr><td>system</td><td>Every menu, status, forecast, shop and list screen; tutorial windows; speaker names in the conversation log</td></tr>
    <tr><td>talk</td><td>Dialogue box lines and the lines of the conversation log</td></tr>
    <tr><td>fe_font</td><td>Lines spoken in the ancient language: the heron galdr, Leanne and Reyson's exchanges, and the endgame. The text switches in with <code>#F01</code> and back with <code>#F02</code></td></tr>
    <tr><td>bigkana</td><td>The title menu and the file menu: each label is prefixed with <code>#F03</code></td></tr>
    <tr><td>alpha</td><td>The names in the staff roll, drawn with <code>#F04</code></td></tr>
  </tbody></table>
  <p>A font switch only lasts until the end of the current line. The dialogue box draws each line as a separate piece of text that starts in the talk font, which is why the game's own ancient-language lines repeat <code>#F01</code> at the start of every line. Debug overlays use a separate built-in 8×8 font that is not stored in these files.</p>
  <p>The message code <code>$O</code>, which always travels with these font switches, is not a font code: it picks the typing sound played as the text appears (see ${wl("message-format")}).</p>

  <h2>Replacing a font</h2>
  <p>A font file is loaded into memory sized from the file itself, so a replacement may be larger than the original; nothing in the game reserves a fixed-size buffer for it. The cost is memory, and for fonts 1–4 a larger <code>system.cmp</code>, which is loaded whole at boot. ${badge("strong","strong")}</p>
  <p>Glyph boxes can sit anywhere on the sheets, since the game reads only each record's sheet, position and size. What must hold: records sorted by code, a texture format and sheet size the header describes, and the original ascent and descent if text should stay on its lines. Only characters with a code page 932 code can appear in game text, so a letter such as <code>é</code> needs a spare code of its own before any font can show it.</p>

  <div class="callout warn">
    <p class="callout-t">Open</p>
    <p>Whether chapter title cards, map names and battle damage numbers are font text or pre-drawn images is not yet established. The shadow and outline behind dialogue text are described in ${wl("message-format")}. ${badge("open","open")}</p>
  </div>
  `
},

/* ------------------------------------------------------------------ NEW: GRAPHICS SYSTEM */

"graphics-system": {
  ns:"system", title:"Graphics & Images", dek:"Which folder holds which kind of image, and the constraints that come with each one",
  infobox:{ type:"Game system", status:"confirmed", fields:[
    ["Underlying format",`${wl("tpl-texture","TPL Texture")}`],["Folders covered","8"],["Palette sharing","Portraits only"]
  ]},
  categories:["Graphics"],
  body:`
  <p>Every 2D image in the game — backgrounds, portraits, UI chrome, world-map art — is stored as a ${wl("tpl-texture","TPL texture")}, either standalone or wrapped in ${wl("lz10","LZ10")} compression. What varies by folder is what kind of image it is and how it's used, not the underlying container.</p>
  <p style="color:var(--ink-muted);font-size:13px">This article covers 2D image resources specifically; for how a 3D terrain material blends multiple textures at once, see ${wl("terrain-texture-rendering")}.</p>
  <h2>How to follow an image from system to pixels</h2><p>First identify which game system requests the resource and by what name or path. Then remove any compression wrapper, parse the TPL image and palette, and finally apply resource-specific rules such as shared portrait palettes or background-label lookup.</p>
  <h2>Example</h2><p>A portrait request selects a file under <code>Face/</code>; LZ10 expands its <code>.cms</code> to a multi-image TPL whose base face and mouth/eye pieces may share one palette. A dialogue background instead resolves through ${wl("rect-format")} to a usually standalone CMPR TPL under <code>s/</code>.</p>
  <table><thead><tr><th>Folder</th><th>Contents</th></tr></thead><tbody>
    <tr><td><code>s/</code></td><td>Full-screen backgrounds behind dialogue and menu scenes — the most common use of the format, always block-compressed (CMPR)</td></tr>
    <tr><td><code>Face/</code></td><td>Character portraits — LZ10-compressed, one file per character variant</td></tr>
    <tr><td><code>illust/</code></td><td>Full-screen CG illustration art</td></tr>
    <tr><td><code>ending/</code></td><td>Ending-sequence art</td></tr>
    <tr><td><code>window/</code></td><td>UI window chrome and layout art</td></tr>
    <tr><td><code>etc/</code></td><td>Miscellaneous graphics not covered by the other folders</td></tr>
    <tr><td><code>gmap/</code></td><td>World-map screen art</td></tr>
    <tr><td><code>zu/</code></td><td>Battle models (uncompressed packs, one per weapon type, and loose textures)</td></tr>
  </tbody></table>
  <h2>Portraits share one palette per character</h2>
  <p>A portrait file holds several images at once — one large base face plus a handful of tiny animation-frame pieces (eye blinks, mouth flaps) — and, confirmed on real files, nearly all of them point at the exact same color palette. That's a real constraint on any replacement image: a new portrait is limited to that one shared palette's roughly 256 colors, because generating a fresh palette for just one of those images would recolor every sibling image sharing it too.</p>
  <h2>Item and skill icons share one sheet</h2>
  <p><code>window/icon.tpl</code> holds every item and skill icon, cut into grids 32 cells wide. Its first image (768×216) has 24×24 cells: menu glyphs and buttons, then from cell 96 the item icons, one per item icon number. Its second image (1024×96) has 32×32 cells: 46 skill icons, blank frames, then status and unit-type badges; a skill's icon number <em>n</em> is cell <em>n</em> − 1. Each image has one palette shared by all its cells, so a new icon has to fit colours left in it. The game reads the copy bundled in <code>system.cmp</code>. ${badge("confirmed","confirmed")}</p>
  <h2>A background can hold more than one image</h2>
  <p>A single background file commonly holds several images at once too — a day and night variant of the same location, or progressive damage states for a scene — each an independent image inside the same file, at its own fixed dimensions.</p>
  `
}

};

/* meta counts used on the home page, computed once */
const ARTICLES_META = {
  formats: Object.fromEntries(Object.entries(ARTICLES).filter(([,a]) => a.ns === "format")),
  systems: Object.fromEntries(Object.entries(ARTICLES).filter(([,a]) => a.ns === "system")),
};

/* ============================== RENDER ============================== */

const NS_ORDER = ["format","system","meta"];

function buildNav(filterText){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  const q = (filterText||"").trim().toLowerCase();
  let any = false;
  for (const ns of NS_ORDER){
    const items = Object.entries(ARTICLES)
      .filter(([,a]) => a.ns === ns)
      .filter(([,a]) => {
        if (!q) return true;
        const searchable = [a.title, a.dek, ...(a.categories||[]), a.body]
          .join(" ").replace(/<[^>]+>/g," ").toLowerCase();
        return searchable.includes(q);
      })
      .sort((a,b) => a[1].title.localeCompare(b[1].title));
    if (!items.length) continue;
    any = true;
    const group = document.createElement("div");
    group.className = "nav-group";
    const label = document.createElement("div");
    label.className = "nav-label";
    label.innerHTML = `${NS_LABEL[ns]} <span class="n">(${items.length})</span>`;
    group.appendChild(label);
    const ul = document.createElement("ul");
    ul.className = "nav-list";
    for (const [id, a] of items){
      const li = document.createElement("li");
      const link = document.createElement("a");
      link.href = `#/${id}`;
      link.textContent = a.title;
      link.dataset.id = id;
      li.appendChild(link);
      ul.appendChild(li);
    }
    group.appendChild(ul);
    nav.appendChild(group);
  }
  if (!any){
    const empty = document.createElement("p");
    empty.className = "nav-empty";
    empty.textContent = "No matching articles.";
    nav.appendChild(empty);
  }
  document.getElementById("artCount").textContent = `${Object.keys(ARTICLES).length} articles`;
  highlightActive();
}

function highlightActive(){
  const current = currentId();
  document.querySelectorAll(".nav-list a").forEach(a => {
    a.classList.toggle("active", a.dataset.id === current);
  });
}

function currentId(){
  const h = location.hash.replace(/^#\/?/, "");
  return h || "main";
}

function slugify(s){
  return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

function buildInfobox(a){
  if (!a.infobox) return "";
  const statusBadge = a.infobox.status ? badge(a.infobox.status, a.infobox.status[0].toUpperCase()+a.infobox.status.slice(1)) : "";
  const rows = (a.infobox.fields||[]).map(([k,v]) => `<div class="ib-row"><div class="ib-k">${k}</div><div class="ib-v">${v}</div></div>`).join("");
  return `
  <aside class="infobox">
    <div class="infobox-head">
      <p class="infobox-title">${a.title}</p>
      <p class="infobox-type">${a.infobox.type}</p>
    </div>
    <div class="infobox-rows">${rows}</div>
    ${statusBadge ? `<div class="infobox-status">${statusBadge}</div>` : ""}
  </aside>`;
}

function buildToc(containerEl){
  const heads = containerEl.querySelectorAll("h2, h3");
  if (heads.length < 2) return "";
  let html = `<div class="toc"><p class="toc-title">Contents</p><ol>`;
  heads.forEach((h,i) => {
    const id = "sec-" + slugify(h.textContent) + "-" + i;
    h.id = id;
    html += `<li class="${h.tagName === "H3" ? "sub" : ""}"><a href="#${id}">${h.textContent}</a></li>`;
  });
  html += `</ol></div>`;
  return html;
}

function buildRelated(currentId, article){
  const categories = new Set(article.categories || []);
  if (!categories.size) return "";
  const related = Object.entries(ARTICLES)
    .filter(([id]) => id !== currentId && id !== "main")
    .map(([id,a]) => ({id, a, score:(a.categories||[]).filter(c => categories.has(c)).length}))
    .filter(x => x.score > 0)
    .sort((x,y) => y.score - x.score || x.a.title.localeCompare(y.a.title))
    .slice(0,6);
  if (!related.length) return "";
  return `<div class="callout"><p class="callout-t">Related articles</p><p>${related.map(x => wl(x.id, x.a.title)).join(" · ")}</p></div>`;
}

function render(){
  const id = currentId();
  const a = ARTICLES[id] || ARTICLES.main;
  const el = document.getElementById("content");

  const crumbs = `<div class="crumbs"><a href="#/main">Tellius Archive</a> &rsaquo; ${NS_LABEL[a.ns]}</div>`;

  if (id === "main"){
    el.innerHTML = `
      ${crumbs}
      <div class="home-hero">
        <h1>Tellius Archive</h1>
      </div>
      ${a.body}
      <footer class="colophon">Technical reference for the US release of Fire&nbsp;Emblem: Path of Radiance. Confidence markers apply to individual claims and fields, not automatically to an entire article.</footer>
    `;
    const gridF = document.getElementById("homeFormats");
    const gridS = document.getElementById("homeSystems");
    for (const [fid, fa] of Object.entries(ARTICLES_META.formats)){
      gridF.innerHTML += `<div class="portal-card"><h3>${wl(fid, fa.title)}</h3><p>${fa.dek}</p></div>`;
    }
    for (const [sid, sa] of Object.entries(ARTICLES_META.systems)){
      gridS.innerHTML += `<div class="portal-card"><h3>${wl(sid, sa.title)}</h3><p>${sa.dek}</p></div>`;
    }
    document.getElementById("statFormats").textContent = Object.keys(ARTICLES_META.formats).length;
    document.getElementById("statSystems").textContent = Object.keys(ARTICLES_META.systems).length;
    document.title = "Tellius Archive";
    window.scrollTo(0,0);
    buildNav(document.getElementById("search").value);
    return;
  }

  const infobox = buildInfobox(a);
  el.innerHTML = `
    ${crumbs}
    <div class="art-head">
      <div class="art-ns">${NS_LABEL[a.ns]}</div>
      <h1 class="art-title">${a.title}</h1>
      <p class="art-dek">${a.dek}</p>
    </div>
    <div class="art-layout">
      <div class="art-body" id="artBody">${a.body}</div>
      ${infobox}
    </div>
  `;
  const bodyEl = document.getElementById("artBody");
  const tocHtml = buildToc(bodyEl);
  if (tocHtml){
    const firstHead = bodyEl.querySelector("h2, h3");
    const tocWrap = document.createElement("div");
    tocWrap.innerHTML = tocHtml;
    if (firstHead) bodyEl.insertBefore(tocWrap.firstChild, firstHead);
    else bodyEl.appendChild(tocWrap.firstChild);
  }
  const relatedHtml = buildRelated(id, a);
  if (relatedHtml) bodyEl.insertAdjacentHTML("beforeend", relatedHtml);
  if (a.categories && a.categories.length){
    const cats = document.createElement("div");
    cats.className = "cats";
    cats.innerHTML = `<span class="lbl">Categories:</span>` + a.categories.map(c => `<span class="cat-tag">${c}</span>`).join("");
    bodyEl.appendChild(cats);
  }
  document.title = a.title + " — Tellius Archive";
  window.scrollTo(0,0);
  buildNav(document.getElementById("search").value);
}

window.addEventListener("hashchange", render);
document.getElementById("search").addEventListener("input", (e) => buildNav(e.target.value));
document.getElementById("randomBtn").addEventListener("click", () => {
  const ids = Object.keys(ARTICLES).filter(id => id !== currentId());
  const pick = ids[Math.floor(Math.random()*ids.length)];
  location.hash = "#/" + pick;
});

render();
</script>

</body></html>
