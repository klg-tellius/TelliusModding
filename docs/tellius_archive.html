    <tr><td class="num">5</td><td>A unit acts at a location</td><td>Location, action (9 visit, 11 door, 12 chest, 13 seize, 14 escape, 37 destroy house, 41 arrive, 44 other), and a resolved debug name; it does not identify the acting character</td></tr>
    <tr><td class="num">7</td><td>After every action</td><td>—</td></tr>
    <tr><td class="num">8 / 9</td><td>Two units talk / fight starts</td><td>Two resolved <code>PID_</code> character references (an empty second one on a fight matches anyone), a direction flag (0: the first character must be the one talking or attacking, the second its target; 1: either way round), and a one-time flag name — the event is skipped while that flag is set</td></tr>
    <tr><td class="num">10 / 11</td><td>A unit's death (back on the map / in battle)</td><td>A <code>PID_</code> character reference</td></tr>
    <tr><td class="num">12</td><td>Scenario complete</td><td>A debug name</td></tr>
    <tr><td class="num">13</td><td>A support conversation</td><td>Two <code>PID_</code> references, support level (1 = C, 2 = B, 3 = A)</td></tr>
    <tr><td class="num">14</td><td>A base conversation</td><td>An “info flag” name, a character reference in the distinct <code>MPID_</code> ID family, a star count</td></tr>
    <tr><td class="num">15</td><td>Selecting a unit</td><td>—</td></tr>
  </tbody></table></div>
  <p>A debug listing left in the executable, headed “C-minor registered function list” — <strong>C-minor</strong> being the developers' name for this script language — gives each type its original name: 1 Complete, 2 Gameover, 3 Turn, 4 Area, 5 Poke, 6 TurnAfter, 7 Taiki (“wait”), 8 Talk, 9 BossTalk, 10 Die, 11 LocalDie, 12 Achieve, 13 Yell, 14 BaseTalk, 15 Pickup, and <code>local</code> for type 0. ${badge("confirmed","confirmed")}</p>

  <h2>Instructions</h2>
  <p>An instruction is one opcode byte followed by 0 to 4 operand bytes. Every operand is <strong>signed</strong>: a one-byte literal covers −128 to 127, and a one-byte string offset only reaches the first 128 bytes of the pool. ${badge("confirmed","confirmed")}</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Opcodes</th><th>Group</th><th>Effect</th></tr></thead><tbody>
    <tr><td class="num">01&ndash;0C</td><td>Local variables</td><td>Push a variable, an array element (index popped), or their address — in 1- and 2-byte slot forms. Arguments are slots 0, 1, …; locals follow.</td></tr>
    <tr><td class="num">0D&ndash;18</td><td>Global variables</td><td>The same six modes on the engine-wide script global table</td></tr>
    <tr><td class="num">19&ndash;1B</td><td>Literals</td><td>Push a 1-, 2- or 4-byte number</td></tr>
    <tr><td class="num">1C&ndash;1E</td><td>Strings</td><td>Push a string, by offset into the pool</td></tr>
    <tr><td class="num">1F, 20, 21</td><td>Memory</td><td><code>deref</code> (read through an address, keeping it), <code>pop</code>, <code>store</code> (write, then push the value again)</td></tr>
    <tr><td class="num">22&ndash;36</td><td>Arithmetic &amp; comparison</td><td>add, sub, mul, div, mod, neg, bitwise not/or/and/xor, shifts, logical not, the six comparisons, and two string comparisons</td></tr>
    <tr><td class="num">37, 38</td><td>Calls</td><td><code>localCall</code> (a function of this script, by index) and <code>externCall</code> (any registered name, with an argument count)</td></tr>
    <tr><td class="num">39</td><td>return</td><td>Pops the return value, drops the frame, pushes the value for the caller</td></tr>
    <tr><td class="num">3A&ndash;3E</td><td>Branches</td><td>Jump; jump if non-zero; jump if zero; and two "keep" forms that leave 1 / 0 on the stack when they jump — the building blocks of <code>||</code> and <code>&amp;&amp;</code></td></tr>
    <tr><td class="num">3F</td><td>yield</td><td>Pause until the engine resumes the script</td></tr>
    <tr><td class="num">40, 41</td><td>Debug</td><td>A 4-byte no-op and <code>printf</code>, whose native does nothing</td></tr>
    <tr><td class="num">42&ndash;47</td><td>—</td><td>Only used by Radiant Dawn</td></tr>
  </tbody></table></div>
  <p>A branch's target is its own offset + 1 + the operand. Every call leaves exactly one value on the stack; a call made as a statement is followed by <code>pop</code>. ${badge("confirmed","confirmed")}</p>

  <h2>How the original compiler shaped the code</h2>
  <p>The scripts were compiled from a C-like language, and the output is completely regular:</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Source</th><th>Bytecode</th></tr></thead><tbody>
    <tr><td><code>if (c) A else B</code></td><td><code>c · branch-if-zero Else · A · jump End · Else: B · End:</code></td></tr>
    <tr><td><code>while (c) A</code></td><td><code>Top: c · branch-if-zero End · A · jump Top · End:</code></td></tr>
    <tr><td><code>do A while (c);</code></td><td><code>Top: A · c · branch-if-non-zero Top</code></td></tr>
    <tr><td><code>x = e;</code></td><td><code>push-address x · e · store · pop</code></td></tr>
    <tr><td><code>int x = e;</code></td><td><code>push-address x · e · store</code> (no pop)</td></tr>
    <tr><td><code>f(a, b);</code></td><td><code>a · b · call f · pop</code></td></tr>
    <tr><td>end of a function</td><td><code>push 0 · return</code>, always</td></tr>
  </tbody></table></div>
  <p>Numbers always use the smallest operand that fits, and a negative number is written as its positive value followed by <code>neg</code>.</p>
  <div class="callout">
    <p class="callout-t">Growing the string pool</p>
    <p>A string operand is <em>pool-relative</em>, not an absolute file address. Appending a string at the pool's end does not change existing offsets, but every structure physically stored after the pool moves and must receive an updated address. ${badge("confirmed","confirmed")}</p>
  </div>
  `
},


"face-data": {
  ns:"format", title:"Face Data", dek:"How each conversation portrait is assembled from its texture set, placed and layered",
  infobox:{ type:"Record table &middot; relocatable resource", status:"confirmed", fields:[
    ["File","<code>face/facedata.bin</code> in <code>system.cmp</code>"],["Records","358, 32 bytes each"],
    ["Key","<code>FID_</code> portrait ID"],["Textures","<code>Face/&lt;name&gt;.cms</code>"]
  ]},
  categories:["Graphics","Text"],
  body:`
  <p>Every portrait the game can show has one record in the face table, keyed by its <code>FID_</code> ID (for example <code>FID_IKE</code> for the small portrait, <code>FID_L_IKE</code> for the large one). The record names the texture set, says where the eyes and mouth go on the base image, and how far back the character stands. ${badge("confirmed","confirmed")}</p>
  <h2>Record</h2>
  <div class="table-wrap"><table><thead><tr><th>Offset</th><th>Field</th></tr></thead><tbody>
    <tr><td>0x00</td><td>Portrait ID (<code>FID_</code>)</td></tr>
    <tr><td>0x04</td><td>Display-name key (<code>MPID_</code>), shown on the nameplate</td></tr>
    <tr><td>0x08</td><td>Texture set file name (<code>.cms</code>)</td></tr>
    <tr><td>0x0C&ndash;0x17</td><td>Top-left corner of the left eye, right eye and mouth on the base image (signed x, y pairs)</td></tr>
    <tr><td>0x18</td><td>Parts present: 1 eyes, 2 mouth</td></tr>
    <tr><td>0x1A</td><td>Texture number of the 64&times;64 menu face, or <code>0xFFFF</code> for none</td></tr>
    <tr><td>0x1C</td><td>Mouth set picked automatically in some scenes</td></tr>
    <tr><td>0x1D</td><td>Depth: portraits with a higher value are drawn behind the others</td></tr>
    <tr><td>0x1E</td><td>Pixels the portrait is lowered when shown in a menu panel (signed)</td></tr>
  </tbody></table></div>
  <h2>Texture set</h2><p>Texture 0 is the base picture. With both parts, textures 1&ndash;3 and 4&ndash;6 are the two mouth sets (3 and 6 are the closed mouths) and 7&ndash;9 and 10&ndash;12 the left and right eye frames. Without a mouth the eye numbers move down by six. Small portraits end with a 64&times;64 face used by menus, which is the texture field 0x1A points to; large portraits have none. When both eyes share the same position, only the right-eye overlay is drawn.</p>
  <h2>Placement</h2><p>A portrait is anchored by the middle of its bottom edge at its seat and is never resized. Facing the other way mirrors the whole picture. In conversations, the depth byte decides the layering: Titania (depth 54) appears in front of Greil (108) whatever their seat order. In menus such as the status screen and item lists, the large portrait sits at the bottom of a clipped panel, and tall characters are lowered by field 0x1E so their face stays visible: 3 px for Titania, 39 for Gort, 47 for Dheginsea.</p>
  `
},

"message-format": {
  ns:"format", title:"Message Format", dek:"Chapter dialogue text, with an inline scripting language for portraits and pacing",
  infobox:{ type:"Text &middot; relocatable resource", status:"confirmed", fields:[
    ["Files","<code>Mess/cNN.m</code>, <code>common.m</code>, &hellip;"],["Text encoding","Shift-JIS"],
    ["Lookup","By ID, through the engine's global name hash"],["Messages","4,905 across all message files"]
  ]},
  categories:["Chapter data","Editable","Text"],
  body:`
  <p>Every line of dialogue and narration lives in a message file, one per chapter plus shared files such as <code>common.m</code>. Each message has an ID (for example <code>MS_02_OP_01</code>) and a text. The text is written in a small inline language: ordinary sentences interrupted by <code>$</code>-prefixed commands that set up the scene, move portraits, and control pacing. <code>$K</code> waits for a button press, <code>$w3</code> pauses briefly, and <code>$FCL_IKE|</code> brings up Ike's large portrait.</p>
  <h2>File layout</h2><p>A message file is a relocatable resource, the same container family used by many other data files. After a 32-byte header comes the text blob, then a table of <code>(text offset, ID offset)</code> pairs, then the ID strings. The header's export count is the number of messages, and the pair table is the export table.</p>
  <h2>How the game finds a message</h2><p>Loading a message file registers every message ID in the engine's single global name table. The same table holds sound cues and script scene names. An ${wl("event-script","event script")} plays a message by naming it, for example <code>TalkEvent("MS_02_OP_01")</code>. The engine looks the ID up and opens the message window with its text. ${badge("confirmed","confirmed")}</p>
  <p>The table stores two numbers per name: a bucket (each byte ×37, modulo 509) and a check value (each byte ×31), computed over signed bytes. A lookup returns the first entry in the bucket whose check value matches; the name itself is never compared. Two consequences follow:</p>
  <ul>
    <li>The order of messages inside a file does not matter, although every retail file is sorted alphabetically by ID.</li>
    <li>Two different IDs with the same bucket and check value would shadow each other, and the one registered first wins. No two retail message IDs collide.</li>
  </ul>
  <p>Text beginning with <code>@</code> is a template: <code>@{0}</code>&hellip;<code>@{9}</code> are replaced by runtime values before display.</p>
  <h2>How a message becomes a scene</h2><p>A message is a little scene script. It picks a layout (the window and portrait-seat arrangement) and optionally a background, loads portraits into seats, then shows lines of text in textboxes. The message controls how the exchange is presented. The event script decides when it plays, and a message can hand control back to the script partway through and resume later.</p>
  <p>There are two styles. <strong>Box style</strong> (layout 上下会話, “up-down conversation”) pairs each of four textboxes with one portrait seat: <code>$c0ZAWANAR|</code> opens box 0 with that face, and <code>$s0</code> selects it for text. <strong>Seat style</strong> (背景会話, “background conversation”, and the world-map layout GMAP会話) uses up to nine seats: <code>$F1$FCL_TIAMAT|</code> loads Titania into seat 1, and <code>$F1$P</code> starts a line spoken from that seat.</p>
  <h2>Command reference</h2>
  <table class="tight"><thead><tr><th>Code</th><th>Meaning</th></tr></thead><tbody>
    <tr><td><code>$R&lt;layout&gt;|</code></td><td>Layout, e.g. 上下会話, 背景会話, GMAP会話, 背景なし会話; clears every textbox</td></tr>
    <tr><td><code>$B&lt;background&gt;|</code></td><td>Background image, e.g. 村-崖 (“village-cliff”), 平原-昼 (“plains-day”) — see ${wl("tpl-texture","backgrounds")}</td></tr>
    <tr><td><code>$=dddd</code>, <code>$&lt;</code></td><td>Screen-transition duration in ms (9999 = default 267 ms); start the transition</td></tr>
    <tr><td><code>$F&lt;0-8&gt;</code></td><td>Select portrait seat N</td></tr>
    <tr><td><code>$FC&lt;name&gt;|</code>, <code>$FD</code></td><td>Load a portrait into the current seat (<code>L_</code> names are the large ones; see ${wl("face-data")}); remove it</td></tr>
    <tr><td><code>$Fc</code> <code>$Fh</code> <code>$Fo</code> <code>$Fd</code></td><td>Eyes closed / half-open / held open / normal blinking</td></tr>
    <tr><td><code>$Ff</code>, <code>$Fs</code></td><td>Quick / normal blinking</td></tr>
    <tr><td><code>$FS</code>, <code>$FA</code></td><td>First / second mouth texture set (not show/hide)</td></tr>
    <tr><td><code>$c&lt;0-3&gt;&lt;name&gt;|</code></td><td>Open textbox N and load that portrait into seat N</td></tr>
    <tr><td><code>$s&lt;0-3&gt;</code>, <code>$d&lt;0-3&gt;</code></td><td>Select (and clear) textbox N; dismiss box N and its portrait</td></tr>
    <tr><td><code>$W-</code> <code>$W+</code> <code>$WD</code></td><td>Hide all windows / show them again / hide the current one</td></tr>
    <tr><td><code>$ND</code></td><td>Toggle the speaker nameplate</td></tr>
    <tr><td><code>$P</code></td><td>Clear the current box and start a new line</td></tr>
    <tr><td><code>$K</code></td><td>Wait for a button press; the text stays on screen — the most common code in the game</td></tr>
    <tr><td><code>$N</code></td><td>Start a new text line</td></tr>
    <tr><td><code>$w&lt;n&gt;</code></td><td>Pause 2<sup>n</sup> frames</td></tr>
    <tr><td><code>$MC</code>&hellip;<code>$MD</code></td><td>Stop and restart mouth movement — wraps “...” and “--” so the speaker's mouth stays still</td></tr>
    <tr><td><code>$H</code></td><td>Hand control back to the event script; the message resumes later</td></tr>
    <tr><td><code>$UB</code>, <code>$Ub</code></td><td>Let the event script waiting on the message run again (the two behave the same). Always followed by <code>$H</code>: at the end of a message it keeps the windows and portraits for the next message; mid-message it lets the script move the camera or units before the text resumes</td></tr>
    <tr><td><code>$SD</code>, <code>$SE</code></td><td>Skip disable / enable. B normally skips the whole conversation; after <code>$SD</code> it advances the text like A instead. Used around choices so a decision cannot be skipped past (<code>$DC</code> is an unused alias of <code>$SD</code>)</td></tr>
    <tr><td><code>$Y</code></td><td>Move on without waiting for a button press, e.g. when a speaker is cut off</td></tr>
    <tr><td><code>$G</code></td><td>Record the following text in the text log as narration, with no speaker name (world-map narration)</td></tr>
    <tr><td><code>$O&lt;n&gt;</code></td><td>Typing sound played as text appears: 1 dialogue, 2 ancient language, 3 world-map narration, 4 tutorial, 0 silent</td></tr>
    <tr><td><code>#Cxx</code>, <code>#c</code>, <code>#Fxx</code></td><td>Text colour from the palette / previous colour; ${wl("font-format","font")} (system, fe_font, talk, bigkana, alpha) for the rest of the line</td></tr>
    <tr><td><code>#Pnnn</code></td><td>Inline icon: cell <code>nnn</code> (hex) of <code>window/icon.tpl</code>, 24&times;24, 32 per row, centred on the line and 24 px wide. <code>#P027</code> is the A button, <code>#P028</code> the B button, <code>#P00F</code>&ndash;<code>#P016</code> the weapon types</td></tr>
  </tbody></table>
  <p>The background name 支援背景 (“support background”) stands for the current chapter's conversation background, set in the chapter data. ${badge("confirmed","confirmed")}</p>
  <h2>Timing</h2><p>Text appears one character per tick. A tick lasts 10 frames at the Slow message speed, 4 at Normal and 1 at Fast; at Max the whole page appears at once. Opening, clearing or closing a box, waiting for a button, <code>$Y</code> and <code>$w</code> each end the current tick, so the next character waits for the following one. A press of A shows the rest of the page at once. Boxes and portraits fade in and out over 8 frames, and the portraits of characters who are not speaking dim over 4 frames. Screen fades (<code>$&lt;</code>, <code>$&gt;</code>) last the <code>$=</code> duration and run while the text continues. Z at a wait opens the text log, which keeps the last 256 lines. ${badge("confirmed","confirmed")}</p>
  <h2>Text effects</h2><p>Every dialogue window draws its text with a <strong>drop shadow</strong>, the glyphs again in black at half opacity 2 pixels down and right, and a 1-pixel black <strong>outline</strong>, the glyphs redrawn in black in eight directions around their position. The choice dialog uses neither. Inside a text, <code>#E</code>/<code>#e</code> switch the shadow on or off and <code>#O</code>/<code>#o</code> the outline; <code>#Ixx</code> slants the following letters so that the top of the line leans <code>xx</code>/16 pixels to the right (<code>#i</code> ends it); <code>#Rxx</code>, <code>#Gxx</code>, <code>#Bxx</code> and <code>#Axx</code> set the red, green, blue or opacity of the text colour. <code>#D</code> returns to the default colour, size and slant and turns the shadow and outline off. The game's own texts never use these codes. ${badge("confirmed","confirmed")}</p>
  <h2>Text scale</h2><p><code>#Sxx</code> scales text in both directions, <code>#Xxx</code> only horizontally and <code>#Yxx</code> only vertically, by <code>xx</code>/64: <code>#S40</code> is normal size, <code>#S80</code> double. <code>#s</code>, <code>#x</code> and <code>#y</code> reset them, as do <code>#D</code> and the start of every line. Scaled text grows right and down from the start of its line, the line spacing does not change, and icons keep their size; window widths take the horizontal scale into account. The game squeezes three long defeat conditions of the objective window with <code>#X3A</code> (91&nbsp;%, &ldquo;Exceed 15 turns&rdquo;) and enlarges the tutorial's &ldquo;- Demonstration -&rdquo; title with <code>#S50</code> (125&nbsp;%). ${badge("confirmed","confirmed")}</p>
  `
},

"shop-format": {
  ns:"format", title:"Shop Format", dek:"Per-difficulty armory, vendor and forge inventories, one section set per chapter",
  infobox:{ type:"Record list &middot; <code>Labeled Section Format</code>", status:"confirmed", fields:[
    ["Files","<code>shop/shopitem_&lt;n/h/m&gt;.bin</code>"],["Sections/file","96"],
    ["Section name","<code>&lt;W|I|F&gt;SHOP_ITEMS_C&lt;nn&gt;</code>"],["Chapter key","Disc file number (Prologue = 01)"],["Write support","Yes"]
  ]},
  categories:["Economy","Editable"],
  body:`
  <p>Shop data uses the ${wl("labeled-section","Labeled Section Format")}. One file exists per difficulty: <code>shopitem_n.bin</code> serves Normal and Easy, <code>shopitem_h.bin</code> Hard and <code>shopitem_m.bin</code> Maniac. Each holds 96 sections named <code>&lt;W|I|F&gt;SHOP_ITEMS_C&lt;nn&gt;</code>: an armory, a vendor and a forge for each chapter number 00&ndash;31. ${badge("confirmed","confirmed")}</p>
  <h2>How a chapter receives shop stock</h2><p>When a base shop opens, the game builds the section name from the current chapter number (<code>"WSHOP_ITEMS_C%02d"</code>) and looks that section up by name. The chapter number is the chapter's disc file number &mdash; the Prologue is 01, Chapter 1 is 02 &mdash; so <code>WSHOP_ITEMS_C05</code> is the armory of the chapter whose files are <code>bmap05</code>, in-game Chapter 4. A chapter number with no section gets an empty armory and vendor and a built-in default forge list. ${badge("confirmed","confirmed")}</p>
  <h2>Sections</h2>
  <div class="table-wrap"><table><thead><tr><th>Letter</th><th>Shop</th><th>Holds</th></tr></thead><tbody>
    <tr><td><code>W</code></td><td>Armory</td><td>A list of <code>IID_</code> weapon pointers ended by a zero word, in display order</td></tr>
    <tr><td><code>I</code></td><td>Vendor</td><td>A list of <code>IID_</code> staves and consumables ended by a zero word</td></tr>
    <tr><td><code>F</code></td><td>Forge</td><td>A fixed grid of 45 (item, base) pointer pairs: 5 rows &times; 9 base columns, no terminator</td></tr>
  </tbody></table></div>
  <p>Each <code>IID_</code> resolves to the global ${wl("fe8data","FE8Data.bin")} item definition; the shop file stores no price or stats. An item's price is its cost per use &times; its uses.</p>
  <h2>The forge grid</h2><p>The base column is the same in every forge section: <code>MDV_IRN</code>, <code>MDV_SLM</code>, <code>MDV_STL</code>, <code>MDV_SLV</code>, <code>MDV_HND</code>, <code>MDV_FI</code>, <code>MDV_TH</code>, <code>MDV_WD</code>, <code>MDV_LIT</code> &mdash; Iron, Slim, Steel, Silver, Thrown, Fire, Thunder, Wind and Light, the base weapon the player picks before forging. Each row is a weapon family (swords, lances, axes, bows, tomes in vanilla), and each cell names the weapon forged from that base, or 0 when the row doesn't offer it.</p>
  <h2>Example</h2><p>The early-game sword row reads Iron Sword/<code>MDV_IRN</code>, Slim Sword/<code>MDV_SLM</code>, Steel Sword/<code>MDV_STL</code>, then zero for Silver and the magic bases; later chapters fill Silver Sword/<code>MDV_SLV</code>. The tome row leaves the physical bases empty and fills Fire, Thunder, Wind and Light.</p>
  <h2>The sell shop</h2><p>The base also has a sell shop (<code>SSHOP</code>, the <code>_SSHOP_</code> dialogue tag). It lists the player's own items, so it has no inventory section; its messages include refusing to buy a valuable item. ${badge("confirmed","confirmed")}</p>
  <h2>File layout</h2><p>After the 0x20-byte header come two pointers to the file's build timestamp and author strings, then every armory section, every vendor section and every forge section in chapter order, the label pool, the relocation table, and the section table sorted by name.</p>
  `
},
"cp-data-format": {
  ns:"format", title:"cp_data.bin", dek:"The computer player's data: AI scripts, movement-scoring weights, heal thresholds, waypoint and target tables",
  infobox:{ type:"Record list &middot; <code>Labeled Section Format</code>", status:"confirmed", fields:[
    ["File","<code>cp_data.bin</code> (also bundled in <code>system.cmp</code>)"],["Size","26,024 bytes (US)"],["Sections","134"],
    ["Loader","<code>load_cp_data_resource</code> <code>800FC678</code>"],["Write support","Yes"]
  ]},
  categories:["Combat","Editable"],
  body:`
  <p><code>cp_data.bin</code> is the data of the enemy and NPC AI (&ldquo;CP&rdquo; is <em>computer player</em>, not support points). It uses the ${wl("labeled-section","Labeled Section Format")}: every section name is registered in the engine's name hash table at load, so a unit's ${wl("dispo-format","dispo record")} (<code>seq_attack</code>, <code>seq_move</code>, <code>seq_heal</code>, <code>mtype</code>) and the <code>UnitSetCp*</code> script calls find their section by name. ${badge("confirmed","confirmed")}</p>
  <h2>Sections</h2>
  <div class="table-wrap"><table><thead><tr><th>Sections</th><th>Count</th><th>Holds</th></tr></thead><tbody>
    <tr><td><code>CP_DataHead</code></td><td>1</td><td>Build timestamp and author, then pointers to the defaults (<code>TBL_STEALITEMS</code>, <code>MTYPE_NORMAL</code>, <code>SEQ_NOATTACK</code>, <code>SEQ_NOMOVE</code>, <code>SEQ_NOHEAL</code>, <code>ATK_SEQID_LIST</code>)</td></tr>
    <tr><td><code>TBL_STEALITEMS</code></td><td>1</td><td>67 <code>IID_</code> names an AI thief may steal (skill scrolls, rings, drops, keys, healing items)</td></tr>
    <tr><td><code>TBL_PID_*</code></td><td>14</td><td>Character lists used as target filters by AI scripts</td></tr>
    <tr><td><code>TBL_MAP*_ROUTE*</code></td><td>10</td><td>Waypoints, one word <code>(x &lt;&lt; 16) | y</code> each, ended by <code>0xFFFF0000</code></td></tr>
    <tr><td><code>MTYPE_*</code></td><td>32</td><td>24-byte movement-scoring weight tables</td></tr>
    <tr><td><code>SEQ_*</code> scripts</td><td>69</td><td>AI scripts: 31 attack, 38 move</td></tr>
    <tr><td><code>SEQ_*HEAL*</code></td><td>6</td><td>8-byte heal behaviours</td></tr>
    <tr><td><code>*_SEQID_LIST</code>, <code>MTYPE_TABLEID_LIST</code></td><td>4</td><td>Name lists; a record's position is its id in the save file</td></tr>
  </tbody></table></div>
  <h2>AI scripts</h2>
  <p>A script is an array of 28-byte entries of seven words: an opcode and six fields <code>a</code>&ndash;<code>f</code>. The first two entries are a header carrying the script's own name and its id. Each unit keeps one program counter per script kind (one byte each, saved in the save file), so a script resumes on the next turn where its last <code>END</code> sent it. The engine runs the entry the counter points at by looking its opcode up in a 52-entry handler table (<code>0x80273000</code> US, <code>0x8027C2C0</code> PAL, <code>0x8026CAF0</code> JP, the same opcodes in all three). ${badge("confirmed","confirmed")}</p>
  <p>Before the handler runs, a non-zero <code>b</code> word is copied into the <em>threat limit</em>: the move checks then only stop on tiles whose enemy threat (a per-tile sum of the threat of every enemy that can reach it) is at most that value; <code>0xFFFF</code> means no limit. Handlers advance the counter by one; jumps move it to the first label entry (opcode 0) whose <code>c</code> is the wanted label, label 0 meaning the first entry. The label search does not stop at the end of the script: it reads on into the sections that follow. ${badge("confirmed","confirmed")}</p>
  <h3>A unit's turn</h3>
  <p>The AI runs a fixed list of steps for each unit: retreat and heal (driven by the heal record), the <strong>attack script</strong>, then the <strong>move script</strong>, stopping at the first step that found an action. A script step calls entries until one ends the run (<code>END</code>, or a <code>SET_SCRIPTS</code> that replaces the running script); after 256 entries without that, a built-in script runs instead (attack with 100% chance, or move toward the nearest foe). Action entries register a candidate action and set a <em>found</em> flag; a later action entry replaces the candidate, so vanilla scripts follow every action with a jump to label 99 when one was found. ${badge("confirmed","confirmed")}</p>
  <div class="table-wrap"><table><thead><tr><th>Opcode</th><th>Name</th><th>Effect</th></tr></thead><tbody>
    <tr><td class="num">0</td><td>LABEL</td><td>Jump target <code>c</code></td></tr>
    <tr><td class="num">1</td><td>COMPARE</td><td>If register <code>a</code> compared with <code>c</code> by <code>b</code> (0 <code>&gt;</code>, 1 <code>&gt;=</code>, 2 <code>==</code>, 3 <code>&lt;=</code>, 4 <code>&lt;</code>, 5 <code>!=</code>) holds, jump to label <code>d</code></td></tr>
    <tr><td class="num">2</td><td>CALL</td><td>Call the function registered under the name <code>e</code> (unused)</td></tr>
    <tr><td class="num">3</td><td>SET_SCRIPTS</td><td>Give the unit attack script <code>e</code> and/or move script <code>f</code></td></tr>
    <tr><td class="num">4 / 6 / 7</td><td>GOTO / JUMP_IF_FOUND / CLEAR_FOUND</td><td>Jump to <code>d</code>; jump when an action was found (or, <code>a</code> = 0, when none was); forget the found action</td></tr>
    <tr><td class="num">5</td><td>EVENT_ACTION</td><td>Turn the pending move into the action of an event on the destination tile (unused)</td></tr>
    <tr><td class="num">100&ndash;104</td><td>ATTACK family</td><td>Weapon attack (action 15) on the named character (100), on any target (101), without moving (103), on a class (104)</td></tr>
    <tr><td class="num">105 / 106</td><td>USE_STAFF</td><td>Use a staff: heal, Restore, Silence, Sleep, Berserk, Warp, Rescue or Ward (+ without moving)</td></tr>
    <tr><td class="num">107 / 108</td><td>STEAL</td><td>Steal an item listed in <code>TBL_STEALITEMS</code> (needs <code>SID_STEAL</code>; + without moving)</td></tr>
    <tr><td class="num">110 / 111</td><td>USE_SKILL</td><td>Use skill <code>f</code>: Gamble (attack, action 21), Fairness, Flutter, Tackle, Tackle 2, Snarl, Earth / Sky Blessing</td></tr>
    <tr><td class="num">112</td><td>SHOOT</td><td>Fire a ballista (actions 49 / 42)</td></tr>
    <tr><td class="num">113 / 114</td><td>ROCK_ATTACK</td><td>Use a map object of kind 10, the rocks (action 46); 114 without a roll, from a tile list ${badge("strong","strong evidence")}</td></tr>
    <tr><td class="num">115</td><td>TACKLE</td><td>Shove (action 19) an adjacent unit</td></tr>
    <tr><td class="num">116</td><td>ATTACK_DIRECT</td><td>Weapon attack with a simpler choice of tile ${badge("strong","strong evidence")}</td></tr>
    <tr><td class="num">200&ndash;218</td><td>Movement</td><td>Move to a tile (200), toward a character to talk (201, 215), toward a class (203), destroy a village (204), safest tile (205), toward the nearest target (206, 207, 217), to an event (209), random tile (210), escape (211), to the nearest breakable terrain and attack it (212), along a waypoint route (216), talk in place (218)</td></tr>
    <tr><td class="num">500 / 501 / 600</td><td>Registers</td><td>Count the targets within a multiple of the unit's Mov (16.16 factor in <code>b</code>); test skill #9; change the Mov bonus and read Mov</td></tr>
    <tr><td class="num">502</td><td>USE_ITEM</td><td>Use the item <code>e</code> (action 4)</td></tr>
    <tr><td class="num">1000 / 1001</td><td>STOP / END</td><td>End the run; the next run starts at label <code>d</code> (identical code)</td></tr>
    <tr><td class="num">102, 109, 202, 208, 213, 214</td><td>NOP</td><td>Nothing</td></tr>
  </tbody></table></div>
  <p>The action opcodes share their fields: <code>a</code> is a percent chance (the handler acts when a roll of 0&ndash;99 is at most <code>a</code>), <code>e</code> an optional <code>TBL_PID_*</code> character list and <code>d</code> its mode. With no list they target every hostile unit; with a list they target its characters whatever their side, or, with <code>d</code> set, every hostile unit not in it (<code>SEQ_ALLATK100_NOLAGU</code>). Movement and talk opcodes leave a result code in register 0: 1 not on the map, 2 next to the target, 3 talk queued, 8 arrived, 9 nothing found, 10 try limit reached, 11 has the skill. ${badge("confirmed","confirmed")}</p>
  <h3>Example</h3>
  <p>The app shows every entry as one line of readable code. <code>SEQ_ATTACK1.5RANGEMOVE</code>, the move script of units that wait until a foe comes within one and a half times their move range, reads:</p>
  <pre><code>r0 = count_units(range=1.5, weapon_range=True)
if r0 &gt; 0: goto L1
nop202()
stop()
L1:
set_scripts(move=SEQ_NEARESTUNITMOVE)
stop(resume=L1)</code></pre>
  <p><code>SEQ_USECHANGE_ATRANGE</code> has no <code>END</code>, and the labels it jumps to are not in it: the label search finds them in <code>SEQ_USECHANGE_1.5ATRANGE</code>, the next section in the file, whose code it then runs. ${badge("confirmed","confirmed")}</p>
  <h2>Movement types and heal records</h2>
  <p>An <code>MTYPE_*</code> table gives the weights of the terms that score every tile a unit could attack from: damage dealt, the share of the foe's HP removed, adjacent foes, a bonus per category of the foe's class (<code>mage</code>, <code>fly</code>, <code>knight</code>, <code>armor</code>, laguz, <code>human</code>, <code>beast</code>, <code>dragon</code>, <code>bird</code>, <code>hero</code>: the "killer" types weight their namesake, the archer type fliers), the turn number, skill modifiers, damage taken, terrain defense and the unit's own HP lost. The tile with the best score wins. A heal record holds the HP percentage at which a unit begins retreating, the percentage at which it stops, and whether it tries healing items first. ${badge("confirmed","confirmed")}</p>
  <div class="callout">
    <p class="callout-t">Editing</p>
    <p>The app's <em>Game Data &rsaquo; AI (CP)</em> tab edits scripts (as readable code or as raw entries), heal records, movement weights, the steal list and the routes. New scripts are appended to their id list so existing ids never move; the build copies the file into <code>system.cmp</code>.</p>
  </div>
  <p>The Japanese, European and US releases ship the same <code>cp_data.bin</code>, byte for byte.</p>
  `
},

"stm-format": {
  ns:"format", title:"STM & DSP-ADPCM", dek:"Nintendo's real GameCube audio codec, wrapped in an engine-specific container",
  infobox:{ type:"Audio codec (standard) + wrapper", status:"confirmed", fields:[
    ["Files","<code>Sound/*.stm</code>"],["Codec","DSP-ADPCM (Nintendo standard)"],
    ["Channel header","0x60 bytes"],["Encode cost","Approximately 1.7 CPU-seconds per audio-second per channel"]
  ]},
  categories:["Audio","Editable"],
  body:`
  <p>Background music tracks use Nintendo's DSP-ADPCM codec, a standard GameCube/Wii predictor-based format. Audio is divided into 14-sample frames. Each frame selects one of the channel's stored predictor coefficient pairs and a scale, then reconstructs samples from 4-bit residual values and the two preceding decoded samples.</p>
  <h2>How playback is reconstructed</h2><p>The STM header identifies stream properties and channel regions. For each channel, the decoder restores every 14-sample frame from its predictor, scale, residual nibbles, and two-sample history, then interleaves channels for playback. Loop state restores the predictor history at the loop boundary.</p>
  <h2>Example: looping stereo</h2><p>A stereo track carries two DSP headers and two back-to-back encoded streams. At the loop point, playback must resume each channel with its own recorded history; jumping only to the byte offset without restoring that state causes an audible discontinuity.</p>
  <p>The <code>.stm</code> wrapper is engine-specific: a small stream header, one standard 0x60-byte DSP header per channel, then each channel's complete ADPCM stream stored back-to-back. The wrapper repeats each channel's encoded byte length and loop-point byte offset three times. Loop state in the DSP header lets playback resume with the correct predictor history.</p>
  <p>Encoding chooses predictor coefficients through an iterative statistical fit, making it substantially more expensive than decoding. A 60-second stereo track typically requires roughly 100–200 seconds to encode on the measured reference system.</p>
  <p>See ${wl("music-system")} for how the game actually picks which track to play — a separate question from the codec itself, resolved through a name→track table rather than anything in the <code>.stm</code> format.</p>
  `
},

"thp-format": {
  ns:"format", title:"THP", dek:"Nintendo's cutscene video codec — near-standard JPEG frames plus DSP-ADPCM audio",
  infobox:{ type:"Video codec (standard)", status:"confirmed", fields:[
    ["Files","<code>Movie/*.thp</code>"],["Frame codec","Near-standard JPEG (one escape quirk)"],
    ["Audio codec","Same DSP-ADPCM as <code>STM & DSP-ADPCM</code>"],["Sources cross-checked","2 independent (community + Nintendo SDK)"]
  ]},
  categories:["Video","Editable"],
  body:`
  <p>Cutscenes use Nintendo's THP format: frames are near-standard JPEGs, while audio reuses the same ${wl("stm-format","DSP-ADPCM codec")} as music but packages samples per video frame. THP's JPEG payload omits the usual escape byte after literal <code>0xFF</code> values in entropy-coded data. Encoded frames are padded to 32-byte boundaries, and per-frame audio sample counts are multiples of 14 except for the last frame.</p>
  <h2>How a movie advances</h2><p>The header describes components and the first frame. Each frame supplies video plus its matching audio slice and points indirectly to the next frame's total size. The player decodes the image, queues the associated samples, carries the next size forward, and repeats at the declared frame rate.</p>
  <h2>Example: following the frame chain</h2><p>To reach frame 2, read frame 0 using the header's first size, obtain frame 1's size from frame 0, then obtain frame 2's size from frame 1. Treating each frame's <code>next_total_size</code> as its own current size shifts boundaries and corrupts the stream.</p>
  <div class="callout"><p class="callout-t">Frame sizes form a linked chain</p><p>The main header gives frame 0's size. Inside frame N, <code>next_total_size</code> describes frame N+1, while <code>prev_total_size</code> describes frame N−1. A reader must therefore carry the next size forward rather than treating it as the current frame's length.</p></div>
  <p>A THP stream can be constructed from a sequence of image frames plus optional PCM audio, provided component tables, frame-chain sizes, alignment, and per-frame audio boundaries are rebuilt consistently.</p>
  <p>See ${wl("cutscenes")} for how a script actually triggers a video — a literal path string, simpler than ${wl("music-system","music's")} name→table lookup.</p>
  `
},

"model-formats": {
  ns:"format", title:".g / .gs / .ga", dek:"Skeleton, mesh, and battle animation — three sibling formats for every character and object model",
  infobox:{ type:"3D model trio", status:"confirmed", fields:[
    ["Files","<code>.g</code>, <code>.gs</code>, <code>.ga</code>"],["Role","Skeleton, mesh, animation"],
    ["On the disc","1,785 skeletons, 1,785 meshes, 4,422 animations"],
    ["Bones per draw call","up to 10"]
  ]},
  categories:["Graphics","3D","Animation"],
  body:`
  <p>Character and object models — <code>zbg/</code>'s 3D battle scenery, units' map models under <code>ymu/</code> and battle models under <code>zu/</code>, spell effects under <code>yme/</code>, weapons under <code>xwp/</code> and map props under <code>zmap/</code> — use three sibling formats, usually bundled together in a ${wl("pack-archive","pack archive")}: <code>.g</code> (bone hierarchy), <code>.gs</code> (mesh geometry), and one <code>.ga</code> per animation. None are public, documented Nintendo formats — all three are proprietary to this game's engine.</p>
  <h2>Two models per unit</h2>
  <p>Every unit is drawn with two different models: a small one on the map, and a detailed one in the battle scenes. ${badge("confirmed","confirmed in game")}</p>
  <div class="table-wrap"><table><thead><tr><th>Folder</th><th>Model</th><th>Contents</th></tr></thead><tbody>
    <tr><td><code>ymu/&lt;class&gt;/</code></td><td>Map model, also used for combat on the map (at most 853 visible triangles)</td><td>An ${wl("lz10","LZ10-compressed")} <code>pack.cmp</code> with <code>skeleton.g</code>, <code>body.gs</code>, the idle and move animations and one texture; the map-combat animations and more texture variants (one 128×128 image each) are loose files next to it</td></tr>
    <tr><td><code>zu/&lt;code&gt;/</code></td><td>Battle model (up to 8,840 visible triangles)</td><td>One uncompressed pack per weapon type (<code>fig1_ax.pak</code>, <code>fig1_ha.pak</code>, <code>fig1_no.pak</code>...), each holding the same mesh and skeleton plus that weapon's battle animations (attacks, criticals, dodge, damage, death...); loose texture files (two 256×256 images each), one per character or army variant</td></tr>
  </tbody></table></div>
  <p>The battle engine's table <code>jobList.dbx</code> maps every class to its battle-model code — the Ranger to <code>reng</code>, the Fighter to <code>fig1</code>, Greil's Hero class to <code>helg</code>, the Cleric to <code>mist</code> — and can give one character or one animation ID its own code. The model's parameter table then names the texture file for the unit's character or army: in the Prologue, Boyd (<code>PID_BOLE_MAP1</code>, a separate record from later-chapter Boyd) uses <code>zu/fig1/bole_map1.tpl</code>. See ${wl("zdbx","ZDBX & DBX")}. ${badge("confirmed","confirmed in game")}</p>

  <h2>How the three files become one model</h2>
  <p>An in-game 3D actor holds four resources side by side: a skeleton, a mesh, an animation and a ${wl("tpl-texture","TPL")} texture file. The skeleton names bones and establishes their hierarchy, the mesh binds vertices to those bones, and animation curves change bone transforms over time. The first time each file is loaded, the engine turns its internal file offsets into memory pointers — each format has its own way of listing which fields need that.</p>
  <table><thead><tr><th>File</th><th>Loader fix-up rule</th></tr></thead><tbody>
    <tr><td><code>.gs</code></td><td>Uses the generic relocatable-resource header; every nonzero pointer in the file is listed in the relocation table in ascending order.</td></tr>
    <tr><td><code>.g</code></td><td>Fixes a fixed set of fields: the name pool, bone array, and each bone's parent, sibling, child, and name references.</td></tr>
    <tr><td><code>.ga</code></td><td>Fixes header words 0, 1, 8, 9, 10, and 11 plus the nine optional footer slots.</td></tr>
  </tbody></table>

  <h2>.g — skeleton</h2>
  <p>A 16-byte header (a zero word, the name-pool offset, the bone count, and the bone-array offset — always <code>0x10</code>), then one <code>0xF4</code>-byte (244) record per bone, then the name pool: a root name that no bone uses, followed by every bone's name in order. ${badge("confirmed","confirmed")}</p>
  <div class="table-wrap"><table><thead><tr><th>Bone record</th><th>Meaning</th></tr></thead><tbody>
    <tr><td><code>0x00</code>, <code>0x04</code>, <code>0x08</code></td><td>Parent, next sibling and first child, as bone indices (<code>-1</code> = none) — the hierarchy is a tree of first-child / next-sibling links ${badge("confirmed","confirmed")}</td></tr>
    <tr><td><code>0x0C</code></td><td>Flags: which transform terms the bone uses (scale, rotation, translation, joint orient, pivots, rotate axis); the engine adds extra bits based on the bone's name (a bone named <code>persp</code> is marked specially) ${badge("confirmed","confirmed")}</td></tr>
    <tr><td><code>0x10</code></td><td>The skinning matrix (3&times;4): a draw call with a bone subset multiplies it after the bone's world matrix ${badge("confirmed","confirmed")}</td></tr>
    <tr><td><code>0x40</code></td><td>The <strong>value block</strong>: 43 floats the animation system reads and overwrites (table below) ${badge("confirmed","confirmed")}</td></tr>
    <tr><td><code>0xEC</code>, <code>0xEE</code>, <code>0xF0</code></td><td>The bone's own index, its Euler rotation order (always X, then Y, then Z), then a name pointer ${badge("confirmed","confirmed")}</td></tr>
  </tbody></table></div>
  <div class="table-wrap"><table><thead><tr><th>Value block</th><th>Meaning</th></tr></thead><tbody>
    <tr><td>0&ndash;2</td><td>Scale</td></tr>
    <tr><td>3&ndash;5</td><td>Rotation X/Y/Z, in degrees</td></tr>
    <tr><td>6&ndash;8</td><td>Translation</td></tr>
    <tr><td>9&ndash;11</td><td>Joint orient</td></tr>
    <tr><td>12&ndash;14</td><td>Rotate pivot — on character rigs, the joint's position in the bind pose</td></tr>
    <tr><td>15&ndash;26</td><td>Scale pivot, the two pivot offsets, and a rotate axis</td></tr>
    <tr><td>27&ndash;30</td><td>A rotation quaternion (unused by any shipped animation)</td></tr>
    <tr><td>31&ndash;42</td><td>The seed local matrix (3&times;4) for bones no animation drives</td></tr>
  </tbody></table></div>
  <p><strong>Anchor bones.</strong> A bone whose name is wrapped in underscores — <code>_s1_</code>, <code>_sw1_</code>, <code>_cam_</code> — is flagged as an anchor when the skeleton loads, and anchors are the only bones the engine ever finds by name: it asks for the first anchor containing a token such as <code>s1</code>/<code>s2</code> (present on every class rig), a weapon-trail pair (<code>sw1</code>/<code>sw2</code>, <code>sp</code>, <code>ax</code>, <code>ja</code>, <code>ha</code>, <code>bw</code>, <code>ex</code>), <code>root</code>, <code>cam</code>, <code>sun</code>, <code>ref</code>, <code>tail</code>, <code>r_hand</code>/<code>l_hand</code> or the feet. Names containing <code>_bl_</code> and <code>_by_</code> receive two additional loader bits whose exact effects remain open. Every other bone name is free. ${badge("confirmed","confirmed")}</p>
  <p>A replacement character skeleton can follow the vanilla convention directly: identity skinning matrix, rotate and scale pivots at the joint position, rest values elsewhere, flags <code>0x180</code>, an identity seed matrix, and X/Y/Z Euler order. Under that convention the bind pose draws stored vertices in place and each bone rotates about its joint.</p>
  <p>The engine builds each bone's matrix from these values the way Maya does: translation, then a rotation about the rotate pivot (joint orient, Euler rotation, rotate axis), then a scale about the scale pivot. The seed matrix at slots 31&ndash;42 is exactly that matrix built from the bone's own values on 56,463 of the 56,836 bones on the disc. ${badge("confirmed","confirmed")}</p>

  <h2>.gs — mesh</h2>
  <p>A <code>.gs</code> file uses the engine's general <strong>relocatable resource</strong> header: file size, the location and length of a relocation table listing every pointer field in the file, and counts of named symbols the file exports or imports. After it comes a mesh header holding an export date (<code>0x20040723</code> on almost every model), a per-model id, a bounding box, and ten array pointers with their counts: positions, normals, UVs, vertex colors, materials, meshes, three draw-call lists, and a CPU-skinning buffer. ${badge("confirmed","confirmed")}</p>
  <p>Draw calls ("shapes") are split into <strong>three render passes</strong>, each a linked list drawn in order with its own settings (see "Draw passes" below). Each shape names a mesh, a material and a bone, carries blend and depth flags (additive, subtractive, depth-off, hidden) and a GX vertex-attribute mask, and points to a ready-made GameCube <strong>display list</strong> that the engine hands to the GPU unchanged. Every vertex attribute in that list is a 16-bit index into the shared arrays, so a mesh can hold up to 65,535 positions. ${badge("confirmed","confirmed")}</p>
  <div class="table-wrap"><table><thead><tr><th>Skinning mode</th><th>How a vertex follows the skeleton</th></tr></thead><tbody>
    <tr><td>Single bone</td><td>The whole shape moves with one bone</td></tr>
    <tr><td>Bone subset</td><td>The shape lists up to <strong>10</strong> bones; each vertex picks one of them (a GameCube hardware limit of 10 matrix slots)</td></tr>
    <tr><td>Blended</td><td>Vertices mix up to four bones by weight, computed on the CPU each frame — used by 324 models: every battle model (<code>zu/</code>), bows (<code>xwp/</code>) and ships (<code>zmap/</code>)</td></tr>
  </tbody></table></div>
  <p><strong>The blended-vertex buffer.</strong> Blended shapes do not use the shared position and normal arrays. They index a separate buffer of 12-byte vertex slots (a 16-bit position and a 16-bit normal, both scaled by the same power of two stored in the buffer header), grouped by weight records. Each record lists up to four bones with 8-bit weights (weight / 256, not renormalized) and a run of vertices that share them. Every frame the engine moves each record's vertices into the CPU's locked cache in whole 32-byte blocks, blends the record's bone matrices, transforms the positions and normals, and writes them to the same place in a per-actor output buffer. The shapes then draw that output with only the actor's own matrix. ${badge("confirmed","confirmed")}</p>
  <div class="table-wrap"><table><thead><tr><th>Weight record field</th><th>Meaning</th></tr></thead><tbody>
    <tr><td><code>0x00</code> bones[4]</td><td>Bone indices, <code>-1</code> when unused ${badge("confirmed","confirmed")}</td></tr>
    <tr><td><code>0x08</code> weights[4]</td><td>8-bit weights out of 256; zero in one-bone records, which skip the blend ${badge("confirmed","confirmed")}</td></tr>
    <tr><td><code>0x0C</code> block offset</td><td>32-byte-aligned start of the record's first block; every record begins a fresh block ${badge("confirmed","confirmed")}</td></tr>
    <tr><td><code>0x10</code> block size</td><td>Bytes moved per record: a multiple of 32, at most 4&nbsp;KiB ${badge("confirmed","confirmed")}</td></tr>
    <tr><td><code>0x12</code> first vertex</td><td>Offset of the first vertex inside the block: the next multiple of 12 (0, 4 or 8) ${badge("confirmed","confirmed")}</td></tr>
    <tr><td><code>0x13</code> bone count</td><td>1 to 4 ${badge("confirmed","confirmed")}</td></tr>
    <tr><td><code>0x14</code> / <code>0x16</code></td><td>Vertex count; count of vertices that also carry a binormal and tangent (unused on the disc) ${badge("confirmed","confirmed")}</td></tr>
  </tbody></table></div>
  <p>The header's scale also applies to the <em>animated</em> output, so every posed coordinate must still fit a 16-bit value at that scale; shipped files use 5 to 10 fraction bits. The header's last field equals the number of records that hold more than one vertex, and no engine reader for it has been found. ${badge("strong","value pattern")}</p>
  <p><strong>Battle models are fully blended.</strong> Every visible shape of a battle model goes through the blended path, including vertices that follow a single bone. A battle model rebuilt with multi-bone hardware shapes instead draws those parts out of place in battle, for a reason not yet traced. ${badge("confirmed","confirmed in game")}</p>
  <p><strong>Hidden shapes.</strong> The draw routine skips any shape flagged hidden, and no code has been found that changes the flag. 81 battle models use it for weapon placeholders: meshes of the weapons the character can hold, each shape assigned to a bone named after its weapon type (Greil's model has a hidden sword on <code>SW</code> and a hidden axe on <code>AX</code>) while its vertices are weighted to the hand socket. The weapon actually shown in battle is the separate model of the equipped item. About half the shapes of the weapon models themselves are hidden too, for a purpose not yet known. ${badge("strong","engine + in game")}</p>
  <p><strong>Weapon sockets.</strong> The game attaches the equipped weapon to the body's hand bone by name — the left hand for bows, the right hand otherwise. ${badge("confirmed","engine")} Inside the body, the hidden placeholders sit on socket bones wrapped in underscores (<code>_r_hand_</code>) or on bow and arrow bones (<code>BW001</code>, <code>_ar1_</code>); visible geometry essentially never uses them, and the camera, root and foot sockets carry none at all.</p>
  <p><strong>Two kinds of bone.</strong> Most bones of a battle body are placed by an offset from their parent and have no rest rotation; a few (<code>Base</code>, <code>weapon</code>, <code>target</code>) turn about a pivot at their joint, which is how every bone of a map model works; sockets with no transform simply follow their parent. Animation keys are absolute values tied to bone numbers, so an animation can be moved to another skeleton by matching bones by name and shifting position keys by the difference in rest position. ${badge("strong","engine + files")}</p>
  <p><strong>Named bones.</strong> The game looks a bone up by name only when the name is wrapped in underscores and contains a token (<code>_r_hand_</code> answers to <code>r_hand</code>); every other name is free (a skeleton with entirely different names and proportions works in game once it has these). In battle, <code>_r_hand_</code> holds the weapon (<code>_l_hand_</code> for bows), <code>_root_</code> follows the hips so a step taken in one animation carries into the next, <code>_cam_</code> is a camera target, and the foot and <code>_pl_</code> sockets are optional. On the map, <code>_s1_</code>/<code>_s2_</code> place the feet and shadow and pairs like <code>_ax1_</code>/<code>_ax2_</code> mark the ends of a weapon's swing trail. ${badge("confirmed","engine + in game")}</p>
  <p><strong>Battle situations.</strong> Each battle model's <code>zu/&lt;code&gt;.dbx</code> names the animation for every situation and weapon (idle, ready, two attacks, two crits, dodge, damage, death, run, sidestep, throw, crit throw) and for follow-ups such as a crit followed by an attack. Situations may share a file: the Fighter's 29 files hold 14 distinct motions. ${badge("confirmed","files + engine")}</p>
  <p><strong>Events combat waits for.</strong> Melee attacks and crits carry event code 0 (the blow lands: damage, HP gauge) and code 1 (the swing, which moves the round on after a miss); throws carry code 2, which releases the thrown weapon. An attack without them leaves the round waiting; with them, retargeted and newly timed attacks play through in game. The other codes are cosmetic: footsteps and dust (50), weapon trails (0x14&ndash;0x1B, with 0x19 ending the trail), ground splashes, camera lights (0x28/0x29) and sounds (1000 and up). ${badge("confirmed","engine + files")}</p>
  <p><strong>Map actions.</strong> A map model plays one file per action and weapon (<code>wait</code>, <code>move</code>, <code>atk1</code>&hellip;); an action its record does not enable plays <code>tackle</code> instead. Map weapons are part of the body, each on its own bone, and each animation shows the weapon in use by scaling its bone to 1 and the others to 0. ${badge("confirmed","engine + files")}</p>
  <p><strong>Draw passes.</strong> The camera draws every model's first shape list, then every second list, then every third, each with fixed GPU settings. A shape's list decides how the transparency of its texture is treated. ${badge("confirmed","engine + in game")}</p>
  <div class="table-wrap"><table><thead><tr><th>List</th><th>Settings</th><th>Used for</th></tr></thead><tbody>
    <tr><td>1st &mdash; opaque</td><td>No blending; texture alpha ignored; depth written</td><td>Solid geometry: weapons, ground, cliffs, most map models</td></tr>
    <tr><td>2nd &mdash; alpha-tested</td><td>Pixels with alpha below 128 are discarded; depth tested after texturing and written</td><td>Cut-outs: leaves, grass cards, and about half of all battle-model shapes</td></tr>
    <tr><td>3rd &mdash; blended</td><td>Blended by alpha; depth tested but not written</td><td>Translucent effects: 7,399 of the 7,515 spell-effect shapes, most of them also additive</td></tr>
  </tbody></table></div>
  <p>Cut-out textures are stored as CMPR with 1-bit alpha, using the format's three-colour block mode, whose fourth colour is transparent. Scenery with its leaf shapes moved to the opaque list draws their transparent pixels as dark blocks. Some model states override the lists, drawing a whole model opaque, alpha-tested or blended.</p>
  <p>A shape that follows a single bone stores its vertices <strong>in that bone's own space</strong>: the engine draws them through the bone's world matrix. On an unanimated prop that is the chain of each ancestor's seed matrix — the map cursor's arrow, for example, is stored at unit size and scaled up and raised by its two bones. Character bodies store their vertices in model space: their bones turn about their pivots, and the animation rebuilds every driven bone's matrix each frame. The header's bounding box is in model space; each mesh record's bounds are in its bone's space. ${badge("confirmed","confirmed")}</p>
  <div class="table-wrap"><table><thead><tr><th>Shape flag bits</th><th>Effect</th></tr></thead><tbody>
    <tr><td><code>0x1000</code></td><td>Back faces culled (single-sided) — 3,469 shipped shapes ${badge("confirmed","confirmed")}</td></tr>
    <tr><td><code>0x0800</code></td><td>Front faces culled — unused on the disc ${badge("confirmed","confirmed")}</td></tr>
    <tr><td><code>0x1800</code></td><td>Nothing culled (double-sided) — 13,686 shipped shapes ${badge("confirmed","confirmed")}</td></tr>
    <tr><td><code>0x6000</code></td><td>Always the shape's render pass + 1 (<code>0x2000</code>, <code>0x4000</code>, <code>0x6000</code>); no reader found ${badge("strong","value pattern")}</td></tr>
  </tbody></table></div>
  <p>The GameCube treats <strong>clockwise</strong> triangles as front-facing, and the shipped triangle strips are stored that way — the reverse of the counter-clockwise convention most modern 3D tools use. ${badge("confirmed","confirmed")}</p>
  <div class="callout"><p class="callout-t">Materials are brightened at load time</p><p>When a mesh is first loaded, the engine multiplies every material's primary color by 1.25 (capped at 255). A stored gray of <code>204</code> is therefore drawn as full white.</p></div>
  <p>Shape flags are part of the render contract, not just authoring metadata. Bits <code>0x1800</code> select the GX cull mode, while an actor-side <code>0x1000</code> flag swaps front and back and turns the double-sided case into culling everything. Bits <code>0x6000</code> mirror the render-pass list number, but no engine reader has been isolated for them.</p>

  <h2>.ga — animation</h2>
  <div class="table-wrap"><table><thead><tr><th>Region</th><th>Location</th></tr></thead><tbody>
    <tr><td>Header</td><td><code>0x00</code>, 12 big-endian u32 words</td></tr>
    <tr><td><strong>Bone-group table</strong></td><td><code>0x30</code> &hellip; <code>curve_table_addr</code> — 16B/record, header word 7 records</td></tr>
    <tr><td><strong>Curve table</strong></td><td><code>curve_table_addr</code> &hellip; <code>keyframe_data_addr</code> — 12B/record</td></tr>
    <tr><td>Keyframe data</td><td><code>(frame: u16, value: int16)</code> pairs, one run per curve in curve order</td></tr>
    <tr><td>Footer</td><td>Header word 0, when nonzero — nine block pointers right after the keyframes</td></tr>
  </tbody></table></div>
  <div class="callout"><p class="callout-t">The curve count is derived from addresses</p><p>The header does not store the total curve count. The curve table runs from <code>curve_table_addr</code> to <code>keyframe_data_addr</code>; dividing that byte span by 12 gives the number of curve records.</p></div>
  <p><strong>Bone assignment</strong> comes from the group table: each 16-byte record is <code>(bone_index, channel_mask, first_curve, curve_count)</code>, and every record names a real bone — usually starting at the hip (bone 1), just below the root locator. A curve's channel is the slot of the bone's value block it overwrites: 0&ndash;2 scale, 3&ndash;5 rotation (degrees), 6&ndash;8 translation, 12&ndash;14 rotate pivot. Values are <strong>absolute</strong> — a key's integer times 2<sup>&minus;shift</sup> — linear between keys and held before the first and after the last. Bones without a group keep their seed matrix. ${badge("confirmed","confirmed")}</p>
  <p>The archer's bow bone is animated with a scale of 0 whenever the bow should not be seen. ${badge("confirmed","confirmed")}</p>
  <div class="table-wrap"><table><thead><tr><th>Header word</th><th>Meaning</th></tr></thead><tbody>
    <tr><td>3</td><td>Format: <code>0x11</code> on every file (Euler rotation, 16-bit keys) ${badge("confirmed","confirmed")}</td></tr>
    <tr><td>4, 5</td><td>Loop flag and the frame a loop restarts at — only the idle <code>ready</code> animations loop ${badge("confirmed","confirmed")}</td></tr>
    <tr><td>6</td><td>The frame playback ends at; it can run past the last key, holding the final pose ${badge("confirmed","confirmed")}</td></tr>
  </tbody></table></div>
  <p>Footer slot 0 is the <strong>event track</strong>: a list of frames, each with a few event codes. As the animation plays, the engine collects the codes of every frame it passes and hands them to the battle code. Codes 3 and 4 mark a loop's start and end, <code>0x1C</code>/<code>0x1D</code> raise and clear a battle flag, and <code>0x28</code>/<code>0x29</code> spawn camera and light effects ${badge("confirmed","confirmed")}. Code 1 sits on the frame an attack connects, and codes from 1,000 up look like sound effects ${badge("strong","by placement")}. That is why the track appears on attacks, criticals, spells and moves but never on <code>damage</code>, <code>dead</code>, <code>escape</code>, <code>ready</code> or <code>wait</code>. Other slots appear on spell-effect and scenery animations and are not yet decoded ${badge("open","open")}.</p>
  <h2>Round-trip layout certainty</h2>
  <p>The three formats are layout-complete enough to rebuild every shipped file byte-for-byte: 1,785 <code>.gs</code> meshes, 1,785 <code>.g</code> skeletons, and 4,422 <code>.ga</code> animations. That pins down block order, 32-byte display-list and bone-subset alignment, string-pool ordering, and curve-ordered keyframe runs. The remaining open questions are behavioral meaning for a few flags and event slots, not the physical layout of the files.</p>
  <p>See ${wl("combat-animation")} for how a <code>.ga</code> file is actually selected during a battle, via ${wl("fe8anim","FE8Anim.bin")}.</p>
  `
},

fe8anim: {
  ns:"format", title:"FE8Anim.bin", dek:"The map-model registry: each animation ID's folder, weapon, textures and actions",
  infobox:{ type:"Flat ID registry", status:"confirmed", fields:[
    ["Records","508"],["Record size","20 bytes"],["Symbol","<code>AnimData</code>"],
    ["Resolves cleanly","508 / 508"],["Read from","the copy bundled in <code>system.cmp</code>"]
  ]},
  categories:["Graphics","Animation","Registry"],
  body:`
  <p>A <code>.ga</code> ${wl("model-formats","animation")} file has no embedded name or identity. <strong>FE8Anim.bin</strong> maps a symbolic <code>AID_</code> animation name to the <code>ymu/</code> folder holding the map model, the weapon it is for, the texture each army uses and the actions the folder has.</p>
  <h2>How a unit finds its map model</h2><p>A character record holds an unpromoted and a promoted base animation ID (<code>AID_FIGHTER_BO</code>, Boyd's); a unit without one uses its class's. The engine appends the weapon suffix (<code>AID_FIGHTER_BO_AX</code>), finds that record, and loads <code>ymu/&lt;folder&gt;/pack.cmp</code>, the action's <code>.ga</code> and the army's texture. A missing record or pack falls back to <code>AID_DUMMY_N</code>. The engine registers every record by name at boot, so the record order does not matter, and a record added to the file works like a vanilla one. ${badge("confirmed","engine + in game")} Battle-scene models are found through <code>jobList.dbx</code> instead (see ${wl("zdbx","ZDBX & DBX")}).</p>
  <h2>Example</h2><p>An <code>AID_..._SW</code> entry resolves to a class folder and weapon enum 1, so it is eligible for the sword presentation of that class. A tagged form such as <code>AID_KNIGHT_KE_N</code> can select Kieran-specific unarmed or neutral presentation without changing the Knight class definition.</p>

  <div class="callout brass">
    <p class="callout-t">Container, shared with FE8Effect.bin</p>
    <p>The standard <code>0x20</code>-byte header (file size, data size, pointer count, symbol count), a data section, the list of every pointer field's offset, and one symbol, <code>AnimData</code>. The data section starts with the record count (508), then the records, then the pool of every name they point to, sorted and without duplicates. ${badge("confirmed","confirmed")}</p>
  </div>

  <p>Every one of the 508 records resolves cleanly to an <code>(AID_ name, folder)</code> pair — 508/508, zero exceptions.</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Offset</th><th>Meaning</th></tr></thead><tbody>
    <tr><td class="num">0x00</td><td>Pointer to the record's <code>AID_</code> name: a base animation ID plus the weapon suffix (<code>AID_KNIGHT_SW</code>)</td></tr>
    <tr><td class="num">0x04</td><td>Pointer to the <code>ymu/</code> folder name, always ending <code>/</code></td></tr>
    <tr><td class="num">0x08</td><td>Weapon type, see below</td></tr>
    <tr><td class="num">0x09</td><td>Blend weight: when the unit switches animation on the map, the old and new animations cross-fade over 16 frames for a weight of 20 or less, rising evenly to 32 frames at 40 and above. Most classes use 20, armoured units and lions 40, dragons 60 ${badge("confirmed","engine")}</td></tr>
    <tr><td class="num">0x0B</td><td>A signed byte, nearly one value per folder (negative on most humans, zero on children and dragons, positive on fliers); nothing in the map-animation code reads it ${badge("open","open")}</td></tr>
    <tr><td class="num">0x0C</td><td>Four texture numbers, one per army (player, enemy, other, ally): the unit's texture is <code>tex_&lt;n&gt;.tpl</code> in the folder. Generic fighters use 32, 97, 162 and 227 (four army colours); Boyd's records repeat 4. Every number names an existing file ${badge("confirmed","engine + in game")}</td></tr>
    <tr><td class="num">0x10</td><td>Action mask: bit <em>n</em> is set when the folder has action <em>n</em> for this weapon — <code>wait</code>, <code>move</code>, <code>atk1</code>, <code>atk2</code>, <code>crit</code>, <code>rod</code>, <code>tackle</code>, <code>escape</code>, <code>ready</code>, <code>damage</code>, <code>trans</code>, <code>dead</code>, <code>magic1</code>, <code>magic2</code>, <code>crit2</code>, <code>move2</code>, <code>event</code>. An action whose bit is clear plays <code>tackle</code>. Every set bit has its file; 33 animation files on the disc have no bit and are never played ${badge("confirmed","engine + files")}</td></tr>
  </tbody></table></div>
  <p>The weapon type is the index into the engine's suffix table, confirmed with zero exceptions by cross-checking every <code>AID_</code> name's trailing suffix against its own byte value across all 86 real class folders:</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Suffix</th><th>Value</th><th>Weapon</th></tr></thead><tbody>
    <tr><td><code>N</code></td><td class="num">0</td><td>Unarmed</td></tr><tr><td><code>SW</code></td><td class="num">1</td><td>Sword</td></tr>
    <tr><td><code>AX</code></td><td class="num">2</td><td>Axe</td></tr><tr><td><code>HA</code></td><td class="num">3</td><td>Hand axe</td></tr>
    <tr><td><code>SP</code></td><td class="num">4</td><td>Spear</td></tr><tr><td><code>JA</code></td><td class="num">5</td><td>Javelin</td></tr>
    <tr><td><code>BW</code></td><td class="num">6</td><td>Bow</td></tr>
  </tbody></table></div>
  <p>A character with no animation ID of its own uses its class's: the class record names one (the Ranger <code>AID_LORD</code>, the Fighter <code>AID_FIGHTER</code>). A name that finds no record, or an empty one, gives <code>AID_DUMMY_N</code>, a black stand-in. ${badge("confirmed","engine + in game")}</p>
  <p>A new map model can be given to one character without touching the rest of its class: records copied under a new base ID and pointing at a copied folder, and the character's animation ID pointed at that new name. In the Prologue, Boyd (<code>PID_BOLE_MAP1</code>) was given <code>AID_FIGHTER_BOX</code> with a recoloured copy of his texture, and the game drew it on the map. ${badge("confirmed","in game")}</p>
  <p>Many <code>AID_</code> names carry a two-letter tag between class and weapon suffix (<code>AID_KNIGHT_KE_N</code>), consistent with a character-specific override. About 29 tags occur, including unambiguous cast initials such as <code>IK</code> (Ike), <code>BO</code> (Boyd), <code>OS</code> (Oscar), <code>KE</code> (Kieran), and <code>TA</code> (Titania). ${badge("strong","strong evidence")} A complete tag-to-character table remains open.</p>
  `
},

fe8effect: {
  ns:"format", title:"FE8Effect.bin", dek:"The visual-effect registry for combat, spell, and environmental presentation",
  infobox:{ type:"Flat ID registry", status:"confirmed", fields:[
    ["Records","263"],["Record size","12 bytes"],["Identifier prefix","<code>EID_</code>"],
    ["Resolves cleanly","263 / 263"],["Write support","Rebuild (byte-identical); add record"]
  ]},
  categories:["Graphics","Animation","Registry"],
  body:`
  <p>The registry contains 263 <strong><code>EID_</code></strong> (Effect ID) entries covering combat and spell visuals: <code>EID_FIRE</code>/<code>FIRE2</code>/<code>FIRE3</code>/<code>FIRE4</code> (spell tiers), <code>EID_BREATHRED</code>/<code>BREATHWHITE</code> (dragon breath), <code>EID_CLASSCHANGE</code>, <code>EID_COUNTER</code>, <code>EID_GODDESS</code>, and environmental effects such as <code>EID_CLOUDOFDUST</code>/<code>CLOUDOFSNOW</code>.</p>
  <h2>How an effect ID becomes a visual sequence</h2><p>A combat, spell, skill, or environment system requests an <code>EID_</code>. The registry supplies flags and, for chained effects, a pointer to the next stage. Following those links produces the ordered visual sequence while the underlying gameplay calculation remains in its owning system.</p>
  <h2>Example: Fire4</h2><p><code>EID_FIRE4</code> advances through <code>EID_FIRE4_2</code> and <code>EID_FIRE4_3</code> before reaching terminal <code>EID_FIRE4_2D</code>. These are stages of one presentation chain, not four independent damage applications.</p>
  <p>Uses the same container as ${wl("fe8anim","FE8Anim.bin")}: its data section starts with the record count (263). 263 &times; 12-byte records, each with a name pointer (263/263 resolve, zero exceptions), a flags word, and an optional second pointer.</p>
  <div class="table-wrap"><table class="tight"><thead><tr><th>Byte</th><th>Values seen</th><th>Reading</th></tr></thead><tbody>
    <tr><td>0</td><td>0, 2, 4, 5, 6</td><td>Plausible category enum</td></tr>
    <tr><td>1</td><td>0&ndash;66, continuous</td><td>Unconfirmed — structurally similar to a ${wl("skills","skill's confirmed ID space")}</td></tr>
    <tr><td>2</td><td><strong>always 5</strong></td><td>Constant — a fixed record-type tag</td></tr>
    <tr><td>3</td><td>mostly 0; rare 2/3/5/7/10</td><td>Too rare a signal to name</td></tr>
  </tbody></table></div>
  <div class="callout">
    <p class="callout-t">The second pointer is a chain, not a sibling</p>
    <p>53 of 263 records carry a nonzero second pointer. Following it repeatedly from a tiered spell always eventually reaches a <code>_2D</code>-suffixed terminal entry — real chains found up to 3 hops long: <code>EID_FIRE4</code> &rarr; <code>EID_FIRE4_2</code> &rarr; <code>EID_FIRE4_3</code> &rarr; <code>EID_FIRE4_2D</code>. Simpler cases are a single hop straight to a <code>_2D</code> sibling. Read as “next effect stage/fallback to play.” ${badge("confirmed","confirmed")}</p>
  </div>
  <p>See ${wl("combat-animation")} for where these effects fit relative to a unit's own battle animation.</p>
  `
},

"rect-format": {
  ns:"format", title:"Rect.bin", dek:"The game-wide table of full-screen images and how each one is animated and shown",
  infobox:{ type:"Resource table", status:"confirmed", fields:[
    ["File","<code>s/rect.bin</code> (the copy bundled in <code>system.cmp</code> is the one the game reads)"],
    ["Resources","195 named <code>RID_</code> resources"],["Images","316 layers over 195 texture files"],
    ["Container",`${wl("labeled-section","Labeled Section Format")}`],["Shown by","<code>RectBuild</code> in event scripts"]
  ]},
  categories:["Graphics","Registry"],
  body:`
  <p>Every full-screen picture that an event can put on screen is a <strong>rect resource</strong>: conversation and cutscene backgrounds, the illustrated region maps, the title screen and its animated flame, the game-over and ending art. <code>s/rect.bin</code> holds them all. Each resource has a Japanese-derived name beginning <code>RID_</code> (for example <code>RID_街-夜</code>, “town, night”), points at one or more images of a file in <code>s/</code>, and carries the few settings that decide how those images are animated and shown. The <code>s/</code> files themselves are ordinary ${wl("tpl-texture","TPL textures")}; the file names are opaque three-character codes, so the resource names are what identify a picture.</p>
  <h2>How a script uses a resource</h2>
  <p>An event script calls <code>RectBuild("RID_…")</code> to create the image (or <code>RectLeave</code> to create it without tying it to the running event). The name is looked up in the engine's global name table, which the resource file fills when it loads. The resulting image can then be moved, faded, scaled, rotated, brightened or removed with the other <code>Rect*</code> calls. <code>RectPreLoad</code> loads a resource's textures ahead of time so it appears without a hitch. ${badge("confirmed","confirmed")}</p>
  <h2>What a resource contains</h2>
  <div class="table-wrap"><table><thead><tr><th>Setting</th><th>Meaning</th></tr></thead><tbody>
    <tr><td>Layers</td><td>One to 255 images. Each names a texture file, the image number inside it, the rectangle of the texture to show (all vanilla layers show the whole texture) and an alpha.</td></tr>
    <tr><td>Composition mode</td><td>How several layers combine: <strong>stack</strong> them, show them as a hard <strong>flip-book</strong>, or <strong>cross-fade</strong> from one to the next. All 195 vanilla resources use cross-fade.</td></tr>
    <tr><td>Period</td><td>Seconds for one pass through all layers, from 0.8 s up to 10 s. A resource with one layer never changes, so its period is irrelevant.</td></tr>
    <tr><td>Brightness</td><td>255 leaves the picture alone; smaller values darken it. Vanilla uses 122–255 (full-frame art is always 255); many conversation backdrops are dimmed a little so the dialogue box reads clearly.</td></tr>
    <tr><td>Overlay</td><td>An optional self-running weather or particle effect drawn with the picture: snow (the eleven snow scenes), sand (the desert), mist (the river plain) and a particle overlay used by the two altar scenes.</td></tr>
  </tbody></table></div>
  <h2>Animation</h2>
  <p>With several layers the resource is a short looping animation. A clock advances once per frame so that one pass over all layers lasts exactly the period; each layer owns an equal share. In cross-fade mode the current layer is drawn opaque and the next one fades in over it, then the cycle continues and wraps. The layers are usually lighting variants: the night version of the command room (<code>RID_アジト-作戦室-夜</code>) is four candle-flicker frames over 1.85 seconds; a door scene has an open and a closed state; the title flame is forty frames over ten seconds. ${badge("confirmed","confirmed")}</p>
  <div class="callout"><p class="callout-t">Size and pivot</p><p>A resource is as large as its first layer's rectangle. That size is also its default pivot (half the width and height), the origin of scaling and rotation, and what the “align inside the 608 × 448 layout area” script call measures.</p></div>
  <h2>Properties scripts can change</h2>
  <p>A shown image keeps eleven properties, addressed by number by <code>RectSet</code>, <code>RectGet</code> and <code>RectSetCurve</code>: X and Y position, a depth offset, the pivot X and Y, horizontal and vertical scale (percent), rotation, opacity (0–255) and brightness (0–255, 128 is normal). Opacity and brightness are reset after every drawing pass so they never leak into other graphics. ${badge("confirmed","confirmed")}</p>
  <h2>The images</h2>
  <ul>
    <li>195 distinct texture files, none shared between resources, holding 316 images. Almost all are CMPR; the title logo is RGB565 and two others are RGB5A3.</li>
    <li>Most resources are 608 × 296 (the strip above the dialogue box, 114 of them) or 608 × 448 (full frame, 39). Region exteriors are 664 × 448; the title is 512 × 320; scrolls and world-map pieces run taller (up to 608 × 912) or wider (up to 1024 × 616, the largest a texture can be).</li>
    <li>Three files in <code>s/</code> are used by no resource.</li>
    <li>One vanilla resource asks for two more rows than its texture has; the extra rows are simply never drawn.</li>
  </ul>
  <h2>What a new resource needs</h2>
  <p>The game finds a texture file by path, first among the loaded archives and then on the disc, so a new file under <code>s/</code> with any name is found. The resource needs a name, at least one layer, and a texture no larger than 1024 pixels on either side; the resource table itself is a relocatable file whose export list must stay sorted by name. Because the game reads the copy inside <code>system.cmp</code>, an edited table has to be present there. ${badge("strong","strong evidence")} An edited table has not been run in the game.</p>
  <h2>The other resource files</h2>
  <p>The window and ending files (<code>window/RectDesc.bin</code>, <code>RectBases.bin</code>, <code>RectUnitList.bin</code>, <code>ending/RectFinale.bin</code>) use the same container and descriptor and differ only in the kinds of layer they hold. Besides the textured quad, a layer can be a <strong>text line</strong> (a message ID or literal text with inline markup, a position and an alignment), a <strong>rectangle with four corner colours</strong> (panels, letterbox bars, fade masks; the corners run upper-left, upper-right, lower-left, lower-right), a <strong>quad with corner colours</strong>, a <strong>dialogue textbox</strong> (frame, panel and cursor resources, text origin, width, line height, line count, typing speed, portrait seat) and a <strong>seat table</strong> (where each portrait stands and which way it faces). ${badge("confirmed","confirmed")}</p>
  <div class="table-wrap"><table><thead><tr><th>File</th><th>What it defines</th></tr></thead><tbody>
    <tr><td><code>window/RectDesc.bin</code></td><td>The shared interface vocabulary, loaded at boot: the nine dialogue layouts (up-down, background, no-background, world-map, tutorial&hellip;), the text-window frames, the page and world-map cursors (16- and 12-frame flip-books), the weapon-triangle icons, the cinema letterbox and the fade masks.</td></tr>
    <tr><td><code>window/RectBases.bin</code></td><td>The base shop windows: a frame with a title strip and a dialogue box for each of the four shops, and the warehouse plate.</td></tr>
    <tr><td><code>window/RectUnitList.bin</code></td><td>The unit-list panel.</td></tr>
    <tr><td><code>ending/RectFinale.bin</code></td><td>The ending: 22 illustration slides, one portrait per character, and the whole staff roll as text resources.</td></tr>
  </tbody></table></div>
  <p>Everything in these files is plain data, so text, positions, colours and images can be changed without touching the executable. The Sound Room's slideshow is a list of these resources too: see ${wl("sound-room")}. </p><p>Each text line and each dialogue textbox carries two switches: a drop shadow (2 pixels, black at half opacity) and a 1-pixel black outline. Lines with icons and three large headings (Staff Credits, Satoru Iwata, Demonstration) use the outline; every dialogue textbox except the choice dialog uses both. ${badge("confirmed","confirmed")}</p>
  `
},

"sound-room": {
  ns:"format", title:"soundroom.bin", dek:"The list of pictures the Sound Room cycles through behind its track menu",
  infobox:{ type:"Record list", status:"confirmed", fields:[
    ["File","<code>soundroom.bin</code> (filesystem root, read directly from the disc)"],
    ["Records","21, eight bytes each"],["Pictures",`${wl("rect-format","Rect.bin")} resources`],
    ["Read by","The Sound Room menu"]
  ]},
  categories:["Graphics","Audio"],
  body:`
