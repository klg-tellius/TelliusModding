name: Windows portable release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: release/requirements-build.txt
      - run: python -m pip install -r release/requirements-build.txt
      - run: python -m unittest discover -s App/tests -q
      - run: python release/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: TelliusModding-Windows-x64
          path: |
            dist/TelliusModding-Windows-x64.zip
            dist/TelliusModding-Windows-x64.zip.sha256
            build/packaged-smoke-test.json
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --title "Tellius Modding $env:GITHUB_REF_NAME" --notes-file release/RELEASE-NOTES.md dist/TelliusModding-Windows-x64.zip dist/TelliusModding-Windows-x64.zip.sha256
