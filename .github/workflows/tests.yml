name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: release/requirements-build.txt
      - run: python -m pip install -r release/requirements-build.txt
      # Tests that need game data (FE9_EXTRACTED_FILES, FE9_SAVES, FE9_ZDBX) skip themselves here.
      - run: python -m unittest discover -s App/tests -v
